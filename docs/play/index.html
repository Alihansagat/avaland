/* quiz engine */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/* Answer checking.
   canon: case-insensitive, quotes unified, spaces around brackets/commas/operators don't matter ("[1,2]" = "[1, 2]").
   loose: also ignores separators, so "3, 1, 8" counts for the output "3 1 8" (with a note about the exact form).
   tight: fill-in answers ignore all spaces ("x=>x*2" = "x => x * 2"). */
const ansCanon = s => String(s).trim().toLowerCase().replace(/[“”«»"‘’`]/g, "'").replace(/;+\s*$/, "")
  .replace(/([\[\](){},;:=+\-*/%<>|!&?.])/g, " $1 ").replace(/\s+/g, " ").trim();
const ansLoose = s => ansCanon(s).replace(/(^| )[,;|]( |$)/g, " ").replace(/\s+/g, " ").trim();
const ansTight = s => ansCanon(s).replace(/ /g, "");
function checkAnswer(q, v) {
  if (!String(v).trim()) return { ok: false };
  if (q.ans.some(a => ansCanon(a) === ansCanon(v))) return { ok: true };
  if (q.t === "fill" && q.ans.some(a => ansTight(a) === ansTight(v))) return { ok: true };
  if (q.ans.some(a => ansLoose(a) === ansLoose(v))) return { ok: true, note: q.t === "out" ? "Засчитано. Точный вывод программы" : "Засчитано. Точная запись" };
  return { ok: false };
}
function startQuiz(cfg) {
  Q = Object.assign({ k: 0, res: [], xp: 0 }, cfg);
  Q.qs = Q.qs.map(x => ({ ...x, opts: x.q.t === "mc" ? shuffle(x.q.o.map((t, j) => ({ t, ok: j === x.q.a }))) : null }));
  showQ();
}
const KIND = { mc: "Выберите ответ", out: "Что выведет код? Впишите вывод", fill: "Впишите пропущенное" };
function quizTitle() {
  const L = LANGS[Q.l];
  return Q.mode === "lesson" ? esc(L.lessons[Q.i].t) : Q.mode === "exam" ? "Финальный экзамен" : Q.mode === "warmup" ? "Разминка дня" : `Удержать: ${esc(L.land)}`;
}
function showQ() {
  const x = Q.qs[Q.k], L = LANGS[x.l];
  const pips = Q.qs.map((_, j) => `<i class="${j < Q.res.length ? (Q.res[j] ? "ok" : "no") : j === Q.k ? "cur" : ""}"></i>`).join("");
  const body = x.q.t === "mc"
    ? `<div class="opts">${x.opts.map((o, j) => `<button class="opt" data-act="pick" data-o="${j}">${o.t}</button>`).join("")}</div>`
    : `<form class="answer" data-act="text" autocomplete="off"><input class="input" id="ans" aria-label="Ваш ответ" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="${x.q.t === "out" ? "Вывод программы" : "Пропущенный фрагмент"}"><button class="btn pri" type="submit">Проверить</button></form>`;
  shell(Q.mode === "warmup" ? L.color : LANGS[Q.l].color, `${esc(L.name)} · ${Q.mode === "exam" ? "экзамен" : Q.mode === "lesson" ? "испытание" : "повторение"}`, quizTitle(),
    `<div class="qhead"><span>Вопрос ${Q.k + 1} из ${Q.qs.length}${Q.mode !== "lesson" && Q.mode !== "exam" ? " · " + esc(L.lessons[x.i].t) : ""}</span><span class="pips">${pips}</span></div>
     <div class="kind">${KIND[x.q.t]}</div>
     <p class="q">${x.q.q}</p>
     ${x.q.c ? codeBlock(x.q.c, L.id, false) : ""}
     ${body}<div id="after"></div>`);
  openOv(x.q.t === "mc" ? ".opt" : "#ans");
}
function judge(ok, extra) {
  const x = Q.qs[Q.k];
  Q.res.push(ok);
  if (ok) { Q.xp += Q.mode === "exam" ? 15 : 10; beep("ok"); haptic("ok"); } else { beep("no"); haptic("no"); }
  if (Q.mode === "warmup" && ok) { const r = S.topics[tk(x.l, x.i)]; if (r) r.last = now(); }
  const last = Q.k === Q.qs.length - 1;
  $("#after").innerHTML = `<p class="exp"><b style="color:${ok ? "var(--ok)" : "var(--danger)"}">${ok ? "Верно." : "Неверно."}</b> ${x.q.e}${extra || ""}</p>
    <div class="acts" style="margin-top:12px"><button class="btn pri big" id="nx" data-act="next">${last ? "Итоги" : "Дальше"}</button></div>`;
  $("#nx").focus({ preventScroll: true });
  $("#nx").scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function pick(j) {
  const x = Q.qs[Q.k];
  if (Q.res.length > Q.k) return;
  dlg.querySelectorAll(".opt").forEach((b, n) => { b.disabled = true; if (x.opts[n].ok) b.classList.add("ok"); else if (n === j) b.classList.add("no"); });
  judge(x.opts[j].ok);
}
function submitText() {
  const x = Q.qs[Q.k], inp = $("#ans");
  if (Q.res.length > Q.k || !inp.value.trim()) return;
  const { ok, note } = checkAnswer(x.q, inp.value);
  inp.classList.add(ok ? "ok" : "no"); inp.readOnly = true;
  const btn = inp.parentElement.querySelector("button"); if (btn) btn.disabled = true;
  judge(ok, ok ? (note ? `<span class="right">${note}: ${esc(x.q.ans[0])}</span>` : "") : `<span class="right">Правильно: ${esc(x.q.ans[0])}</span>`);
}
function next() { if (Q.k === Q.qs.length - 1) finish(); else { Q.k++; showQ(); } }

function finish() {
  const right = Q.res.filter(Boolean).length, total = Q.qs.length;
  const L = LANGS[Q.l], perfect = right === total;
  let win, msg, need, title, eyebrow = "", extraBtn = "";
  const st0 = streak();
  if (Q.mode === "lesson") {
    need = Math.min(LESSON_PASS, total); win = right >= need;
    if (win) {
      const key = tk(Q.l, Q.i), was = S.topics[key];
      const wasSiege = status(Q.l, Q.i) === "siege";
      S.topics[key] = { last: now() };
      if (!was) { Q.xp += 20; S.counts.lessons++; }
      if (wasSiege) S.counts.lifted++;
      if (perfect) S.counts.perfect++;
      msg = was ? "Провинция укреплена, защита продлена на 14 дней." : Q.i === 0 ? "Столица захвачена! Над страной поднят флаг." : "Новая провинция ваша.";
      if (Q.i + 1 < L.lessons.length && status(Q.l, Q.i + 1) === "open") extraBtn = `<button class="btn pri big" data-act="learn" data-l="${Q.l}" data-i="${Q.i + 1}">Следующий урок</button>`;
      else if (examReady(Q.l) && !passed(Q.l)) extraBtn = `<button class="btn pri big" data-act="examIntro" data-l="${Q.l}">К финальному экзамену</button>`;
    } else msg = `Нужно хотя бы ${need} из ${total}. Перечитайте урок — ответы на все вопросы в нём есть.`;
    title = win ? "Победа" : "Отступление"; eyebrow = `${esc(L.name)} · испытание`;
  } else if (Q.mode === "review") {
    need = Math.round(total * 0.7); win = right >= need;
    if (win) {
      let lifted = false;
      L.lessons.forEach((_, i) => { const r = S.topics[tk(Q.l, i)]; if (r) { if (status(Q.l, i) === "siege") lifted = true; r.last = now(); } });
      if (lifted) S.counts.lifted++;
      S.counts.reviews++; Q.xp += 15;
      msg = `${esc(L.land)} под защитой ещё ${HOLD} дней.`;
    } else msg = `Нужно ${need} из ${total}. Перечитайте уроки, где были ошибки.`;
    title = win ? "Позиции удержаны" : "Оборона прорвана"; eyebrow = `${esc(L.name)} · повторение`;
  } else if (Q.mode === "warmup") {
    win = right > 0; need = 1;
    S.warmup = dayKey(now()); S.counts.reviews += right >= 4 ? 1 : 0;
    msg = right ? `${right} ${plural(right, "тема", "темы", "тем")} получили защиту ещё на ${HOLD} дней.` : "Ни одного верного ответа — загляните в уроки и попробуйте снова.";
    title = "Разминка завершена"; eyebrow = "повторение";
  } else {
    need = Math.ceil(total * EXAM_RATE); win = right >= need;
    const id = L.id;
    if (win) {
      const date = now();
      S.exams[id] = { passed: true, date, score: right, total, cid: certId(id, S.profile.name, date) };
      Q.xp += 100;
      msg = "Экзамен сдан. Сертификат выписан на ваше имя.";
      extraBtn = `<button class="btn pri big" data-act="cert" data-l="${Q.l}">Открыть сертификат</button>`;
    } else {
      S.exams[id] = { passed: false, failAt: now(), score: right, total };
      msg = `Нужно ${need} из ${total}. Пересдача через ${EXAM_COOLDOWN_MIN} минут — повторите уроки с ошибками.`;
    }
    title = win ? "Экзамен сдан" : "Экзамен не сдан"; eyebrow = `${esc(L.name)} · финальный экзамен`;
  }
  addXP(Q.xp);
  const st1 = streak();
  checkAch(); save();
  if (win) { beep("win"); haptic("ok"); }
  const cfg = { mode: Q.mode, l: Q.l, i: Q.i };
  shell(Q.mode === "warmup" ? "" : L.color, eyebrow, title,

const leetQuery = field => `query avaland($u:String!){matchedUser(username:$u){username ${field}{acSubmissionNum{difficulty count}}} recentAcSubmissionList(username:$u,limit:20){title titleSlug timestamp}}`;
async function leetPost(query, user) {
  const r = await P.CapacitorHttp.request({ url: "https://leetcode.com/graphql", method: "POST", headers: { "Content-Type": "application/json", Referer: "https://leetcode.com" }, data: { query, variables: { u: user } }, connectTimeout: 15000, readTimeout: 15000 });

async function leetFetch(user) {

  let d = await leetPost(leetQuery("submitStatsGlobal"), user);
  if (d && d.errors && !(d.data && d.data.matchedUser)) d = await leetPost(leetQuery("submitStats"), user);
  if (d && d.data && d.data.matchedUser && !d.data.matchedUser.submitStatsGlobal) d.data.matchedUser.submitStatsGlobal = d.data.matchedUser.submitStats;

async function leetSync(user) {

    const counts = {};
    ((mu.submitStatsGlobal || {}).acSubmissionNum || []).forEach(x => { counts[x.difficulty] = x.count; });
    const recent = (d.data.recentAcSubmissionList || []).map(x => x.titleSlug);
    let credited = 0;
    PR.forEach(p => { if (recent.includes(p.lc)) { const s = pstate(p.id); if (!s.lc) { s.lc = now(); if (!s.solved) { addXP(Math.round(DIFF[p.diff][2] / 2)); credited++; } } } });
    S.leet = { user: mu.username, counts, recent, syncedAt: Date.now() };
    checkAch(); save();
    toast(credited ? `LeetCode: засчитано задач — ${credited}` : "LeetCode синхронизирован");

}

/* --- превращаем фрагмент из урока в полную программу --- */
const DECL_RE = {
  go: /^(type|func|var|const|import)\s/,
  cpp: /^(#include|using\s|template\s*<|struct\s|class\s|enum\s|(static\s+|inline\s+|constexpr\s+)*(void|int|long|double|bool|auto|char|float|size_t|std::[\w:<>, ]+|[A-Z]\w*)\s*[&*]?\s+\w+\s*\([^;]*\)\s*(const\s*)?(\{.*)?$)/,
  java: /^(@\w+|import\s|static\s|((public|private|protected|abstract|final|sealed|non-sealed)\s+)*(class|record|interface|enum)\s)/,
  cs: /^(\[\w|namespace\s|((public|private|protected|internal|static|abstract|sealed|partial|readonly|file|ref)\s+)*(class|record|interface|enum|struct)\s)/,
  rs: /^(#\[|(pub\s+)?(fn|struct|enum|impl|trait|use|mod|const|static|type)\s)/,
  kt: /^(import\s|fun\s|class\s|data\s+class|enum\s+class|object\s|interface\s|sealed\s|abstract\s|open\s+class|typealias\s|inline\s|suspend\s+fun|const\s+val)/,
  dart: /^(import\s|class\s|abstract\s|enum\s|mixin\s|extension\s|typedef\s|sealed\s|base\s+class|final\s+class|interface\s+class|(Future<[^>]*>|Stream<[^>]*>|void|int|double|num|String|bool|dynamic|List<[^>]*>|Map<[^>]*>|Set<[^>]*>|Iterable<[^>]*>|[A-Z]\w*(<[^>]*>)?\??)\s+\w+\s*(<[^>]*>)?\s*\(.*\)\s*(async\*?|sync\*)?\s*(\{|=>))/,
};
function splitDecls(lang, code) {
  const re = DECL_RE[lang], decls = [], stmts = [], L = code.split("\n");
  let depth = 0, inDecl = false, paren = 0;
  for (let k = 0; k < L.length; k++) {
    const line = L[k];
    if (/^\s*\/\/\s*в main/i.test(line)) continue;
    if (!inDecl && depth === 0 && re.test(line)) inDecl = true;
    (inDecl ? decls : stmts).push(line);
    if (!inDecl) continue;
    const s = line.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|\/\/.*$/g, "");
    depth += (s.match(/\{/g) || []).length - (s.match(/\}/g) || []).length;
    paren += (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
    if (depth > 0 || paren > 0) continue;
    // a declaration whose body starts on the next line (C# / Allman style, annotations, base lists)
    const next = (L.slice(k + 1).find(x => x.trim()) || "").trim();
    const attr = /^(@\w+|#\[|\[\w)/.test(line.trim()) && !/[;{}]\s*$/.test(s);
    if (attr || (!/[;}]\s*$/.test(s) && /^(\{|=>|:|where\b|extends\b|implements\b|throws\b)/.test(next))) continue;
    inDecl = false; depth = 0; paren = 0;
  }
  return [decls.join("\n"), stmts.join("\n")];
}
const GO_PKGS = ["fmt", "strings", "sort", "errors", "strconv", "sync", "time", "os", "math", "slices", "maps", "unicode", "bufio", "context"];
function wrapProgram(lang, code) {
  const usings = [];
  code = String(code || "").replace(/\s+$/, "") + "\n";
  const ind = s => s.split("\n").map(x => x ? "    " + x : x).join("\n");
  switch (lang) {
    case "php": return /^\s*<\?php/.test(code) ? code : "<?php\n" + code;
    case "swift": return /\b(URL|URLSession|Date|DispatchQueue|JSONDecoder|JSONEncoder|NSString|Data)\b/.test(code) && !/^import\s+Foundation/m.test(code) ? "import Foundation\n\n" + code : code;
    case "cpp": {
      const pre = /bits\/stdc\+\+/.test(code) ? "" : "#include <bits/stdc++.h>\n";
      if (/\bint\s+main\s*\(/.test(code)) return pre + code;
      const [d, s] = splitDecls("cpp", code);
      return pre + (d ? d + "\n\n" : "") + "int main() {\n" + ind(s.trim()) + "\n}\n";
    }
    case "java": {
      const JI = "import java.util.*;\nimport java.util.function.*;\nimport java.util.stream.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n";
      if (/static\s+void\s+main/.test(code)) return JI + code;
      const [d, s] = splitDecls("java", code);
      const imports = d.split("\n").filter(x => /^import\s/.test(x)).join("\n");
      const members = d.split("\n").filter(x => !/^import\s/.test(x)).join("\n")
        .replace(/^((?:public|private|protected|abstract|final|sealed|non-sealed)\s+)*(class|record|interface|enum)\s/gm, m => "static " + m.replace(/\bpublic\s+/, ""));
      return `${JI}${imports ? imports + "\n" : ""}\npublic class Main {\n${members ? ind(members) + "\n\n" : ""}    public static void main(String[] args) throws Exception {\n${ind(ind(s.trim()))}\n    }\n}\n`;
    }
    case "cs": {
      if (!/static\s+(async\s+)?(void|int|Task)\s+Main\s*\(/.test(code)) {
        const [d, s] = splitDecls("cs", code.replace(/^using\s[^\n]*\n/gm, m => (usings.push(m), "")));
        if (d && s.trim()) code = usings.join("") + s.trim() + "\n\n" + d + "\n"; else code = usings.join("") + code.replace(/^using\s[^\n]*\n/gm, "");
      }
      const need = ["System", "System.Collections.Generic", "System.Linq", "System.Text", "System.Threading", "System.Threading.Tasks"].filter(u => !new RegExp("^using\\s+" + u.replace(/\./g, "\\.") + ";", "m").test(code));
      return need.map(u => `using ${u};`).join("\n") + (need.length ? "\n\n" : "") + code;
    }
    case "go": {
      if (/^package\s+main/m.test(code)) return code;
      let body = code;
      if (!/\bfunc\s+main\s*\(/.test(code)) { const [d, s] = splitDecls("go", code); body = (d ? d + "\n\n" : "") + "func main() {\n" + s.trim().split("\n").map(x => x ? "\t" + x : x).join("\n") + "\n}\n"; }
      const used = GO_PKGS.filter(p => new RegExp("\\b" + p + "\\.").test(body.replace(/"(?:[^"\\]|\\.)*"/g, "")));
      return "package main\n\n" + (used.length ? `import (\n${used.map(p => `\t"${p}"`).join("\n")}\n)\n\n` : "") + body;
    }
    case "rs": {
      if (/\bfn\s+main\s*\(/.test(code)) return code;
      const [d, s] = splitDecls("rs", code);
      return (d ? d + "\n\n" : "") + "fn main() {\n" + ind(s.trim()) + "\n}\n";
    }
    case "kt": {
      if (/\bfun\s+main\s*\(/.test(code)) return code;
      const [d, s] = splitDecls("kt", code);
      return (d ? d + "\n\n" : "") + "fun main() {\n" + ind(s.trim()) + "\n}\n";
    }
    case "dart": {
      if (/\bmain\s*\(/.test(code)) return code;
      const [d, s] = splitDecls("dart", code);
      const async = /\bawait\b/.test(s);
      return (d ? d + "\n\n" : "") + `${async ? "Future<void>" : "void"} main()${async ? " async" : ""} {\n` + s.trim().split("\n").map(x => x ? "  " + x : x).join("\n") + "\n}\n";
    }
    default: return code;
  }
}

  cloud.state = "sync";
  try {
    const c = await sbClient();
    const { data, error } = await c.from("progress").select("data, updated_at").eq("user_id", me.id).maybeSingle();
    if (error) throw error;
    if (data && data.data) {
      const keep = { settings: S.settings, offset: S.offset, tab: S.tab, sel: S.sel, push: S.push, lang: S.lang };
      S = Object.assign(mergeState(S, data.data), keep);
      saveLocal();
    }
    pullAt = Date.now();
    if (push || !data) await cloudPush();
    else cloud = { state: "ok", at: Date.now(), err: "" };
    checkAch();
    if (ov.hidden) render();
  } catch (e) { cloud = { state: "error", at: cloud.at, err: e.message || String(e) }; if (S.tab === "profile" && ov.hidden) render(); }
}
async function cloudPush() {
  if (!me) return;
  try {
    const c = await sbClient();
    const { error } = await c.from("progress").upsert({ user_id: me.id, data: cloudData(), updated_at: new Date().toISOString() });
    if (error) throw error;
    cloud = { state: "ok", at: Date.now(), err: "" };
  } catch (e) { cloud = { state: "error", at: cloud.at, err: e.message || String(e) }; }
  const el = $("#cloud-st"); if (el) el.innerHTML = cloudStatusText();
}
let cloudT = null;
function cloudQueue() {
  if (me) { clearTimeout(cloudT); cloudT = setTimeout(cloudPush, 3000); }
  if (S.push && S.push.endpoint) { clearTimeout(pushT); pushT = setTimeout(pushSync, 5000); }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && me && Date.now() - pullAt > 60000) cloudPull(false);
  if (document.visibilityState === "hidden" && me && cloudT) { clearTimeout(cloudT); cloudT = null; cloudPush(); }
});
function cloudStatusText() {
  if (cloud.state === "sync") return "Синхронизация…";
  if (cloud.state === "error") return `<span style="color:var(--danger)">Не удалось синхронизировать: ${esc(cloud.err)}</span>`;
  if (cloud.at) return `Прогресс сохранён в облаке · ${new Date(cloud.at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}`;
  return "Прогресс будет сохраняться в облаке автоматически";
}

/* --- экран аккаунта --- */
const GH_ICON = '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>';
const G_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.2s2.7-6.2 6-6.2c1.9 0 3.2.8 3.9 1.5l2.7-2.6C16.9 3.1 14.7 2 12 2 6.5 2 2 6.5 2 12s4.5 10 10 10c5.8 0 9.6-4 9.6-9.8 0-.7-.1-1.2-.2-1.7H12z"/></svg>';
const A_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.5-1-2.5-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>';
let authMode = "in";
function accountCardHTML() {
  if (me) {
    const av = me.user_metadata && me.user_metadata.avatar_url;
    const via = (me.app_metadata && me.app_metadata.provider) || "email";
    return `<section class="card stack"><div><div class="eyebrow">Аккаунт</div><h2 class="h-sec acc-h">${av ? `<img class="ava" src="${esc(av)}" alt="" width="32" height="32">` : ""}${esc(userName())}</h2></div>
      <p class="muted" style="margin:0">Вход через ${via === "github" ? "GitHub" : via === "google" ? "Google" : via === "apple" ? "Apple" : "почту"}${me.email && via !== "email" ? " · " + esc(me.email) : ""}. Прогресс, награды, решённые задачи и код сохраняются в облаке и вернутся на любом устройстве после входа.</p>
      <p class="note" id="cloud-st">${cloudStatusText()}</p>
      <div class="row"><button class="btn" data-act="cloudSync">Синхронизировать сейчас</button><button class="btn ghost" data-act="signOut">Выйти</button></div>
      <details class="log"><summary>Удалить аккаунт</summary><p class="note">Аккаунт и сохранённый в облаке прогресс будут удалены навсегда. Прогресс на этом устройстве останется.</p><button class="btn red" data-act="delAcc">Удалить аккаунт навсегда</button></details></section>`;
  }
  const oauth = [
    ["github", "GitHub", GH_ICON, AUTH_PROVIDERS.github],
    ["google", "Google", G_ICON, AUTH_PROVIDERS.google],
    ["apple", "Apple", A_ICON, AUTH_PROVIDERS.apple],
  ].map(([id, name, icon, on]) => `<button class="btn oauth" data-act="oauth" data-p="${id}" ${on && !NATIVE ? "" : "disabled"}>${icon}<span>Войти через ${name}</span>${on ? (NATIVE ? '<small>на сайте</small>' : "") : "<small>скоро</small>"}</button>`).join("");
  return `<section class="card stack"><div><div class="eyebrow">Аккаунт</div><h2 class="h-sec">Сохраните прогресс</h2></div>
    <p class="muted" style="margin:0">Сейчас прогресс хранится только на этом устройстве. Войдите — и карта, награды, задачи и код сохранятся в облаке: переустановите приложение или откройте сайт на другом устройстве, и всё вернётся.</p>
    <div class="oauths">${oauth}</div>
    <form class="stack" data-act="authForm" autocomplete="on">
      <div class="seg" role="group" aria-label="Режим"><button type="button" data-act="authMode" data-m="in" aria-pressed="${authMode === "in"}">Вход по почте</button><button type="button" data-act="authMode" data-m="up" aria-pressed="${authMode === "up"}">Регистрация</button></div>
      <div class="field"><label for="au-mail">Почта</label><input class="input" id="au-mail" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required maxlength="120" placeholder="you@example.com"></div>
      <div class="field"><label for="au-pass">Пароль${authMode === "up" ? " (не короче 8 символов)" : ""}</label><input class="input" id="au-pass" type="password" autocomplete="${authMode === "up" ? "new-password" : "current-password"}" required minlength="${authMode === "up" ? 8 : 6}" maxlength="72"></div>
      <button class="btn pri" type="submit">${authMode === "up" ? "Создать аккаунт" : "Войти"}</button>
      <p class="note" id="au-msg"></p>
    </form>
    <p class="note">LeetCode не даёт входить через свой аккаунт в сторонние приложения, поэтому его профиль привязывается на вкладке «Практика». Вход через Apple появится в версии для App Store.</p></section>`;
}
const AUTH_ERR = [
  [/invalid login credentials/i, "Неверная почта или пароль."],
  [/already registered|already exists/i, "Аккаунт с этой почтой уже есть — выберите «Вход по почте»."],
  [/password should be at least|weak/i, "Слишком простой пароль: нужно не меньше 8 символов, лучше с цифрами."],
  [/unable to validate email|invalid format|email address .* invalid/i, "Проверьте адрес почты."],
  [/rate limit|too many/i, "Слишком много попыток. Подождите минуту."],
  [/email not confirmed/i, "Почта не подтверждена. Откройте письмо от AVALAND."],
  [/fetch|network/i, "Нет связи с сервером. Проверьте интернет."],
];
const authErr = e => { const m = String((e && e.message) || e); const f = AUTH_ERR.find(([re]) => re.test(m)); return f ? f[1] : m; };
document.addEventListener("submit", async e => {
  if (!e.target.matches("form[data-act=authForm]")) return;
  e.preventDefault();
  const msg = t => { const el = $("#au-msg"); if (el) el.textContent = t; };
  const email = $("#au-mail").value.trim(), password = $("#au-pass").value;
  if (authMode === "up" && password.length < 8) { msg("Пароль должен быть не короче 8 символов."); return; }
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; msg(authMode === "up" ? "Создаю аккаунт…" : "Вхожу…");
  try {
    const c = await sbClient();
    const r = authMode === "up"
      ? await c.auth.signUp({ email, password, options: { data: { full_name: S.profile.name || "" }, emailRedirectTo: location.origin + location.pathname } })
      : await c.auth.signInWithPassword({ email, password });
    if (r.error) throw r.error;
    if (!r.data.session) { msg("Аккаунт создан. Подтвердите почту по ссылке из письма и войдите."); btn.disabled = false; return; }
    toast(authMode === "up" ? "Аккаунт создан, прогресс сохранён в облаке" : "Вы вошли");
  } catch (err) { msg(authErr(err)); btn.disabled = false; }
});
async function oauthStart(p) {
  if (!AUTH_PROVIDERS[p]) { toast("Этот способ входа появится позже"); return; }
  if (NATIVE) { toast("В приложении пока работает вход по почте. Через " + p + " можно войти на сайте."); return; }
  try {
    const c = await sbClient();
    saveLocal();
    const { error } = await c.auth.signInWithOAuth({ provider: p, options: { redirectTo: location.origin + location.pathname } });
    if (error) throw error;
  } catch (err) { toast("Не удалось начать вход: " + authErr(err)); }
}
async function deleteAccount() {
  try {
    const c = await sbClient();
    const { error } = await c.rpc("delete_me");
    if (error) throw error;
    await c.auth.signOut({ scope: "local" });
    me = null; toast("Аккаунт удалён"); render();
  } catch (err) { toast("Не удалось удалить аккаунт: " + authErr(err)); }
}

/* --- веб-пуш: напоминания и предупреждения об осаде на сайте и на экране «Домой» --- */
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const standalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function pushHint() {
  if (NATIVE) return "";
  if (isIOS() && !standalone()) return "На iPhone уведомления работают, если открыть AVALAND с экрана «Домой»: в Safari нажмите «Поделиться» → «На экран „Домой“», откройте приложение с иконки и включите напоминания здесь.";
  if (!pushSupported()) return "Этот браузер не поддерживает уведомления от сайтов.";
  if (Notification.permission === "denied") return "Уведомления запрещены в настройках браузера для этого сайта.";
  return S.push && S.push.endpoint ? "Напоминания включены на этом устройстве." : "Включите, чтобы получать напоминание о занятии и предупреждения об осаде.";
}
function nextSiege() {
  let min = null;
  LANGS.forEach((L, l) => L.lessons.forEach((_, i) => { const r = S.topics[tk(l, i)]; if (r) { const t = r.last - S.offset * DAY + HOLD * DAY; if (!min || t < min) min = t; } }));
  return min ? new Date(min).toISOString() : null;
}
function lastStudy() { const ks = Object.keys(S.days).filter(k => S.days[k] > 0).sort(); return ks.length ? ks[ks.length - 1] : null; }
const urlB64 = s => { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushEnable() {
  if (!pushSupported()) { toast(pushHint() || "Уведомления недоступны"); return false; }
  if (isIOS() && !standalone()) { toast("Сначала добавьте AVALAND на экран «Домой»"); return false; }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") { toast("Уведомления не разрешены"); return false; }
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(VAPID_PUBLIC) });
    S.push = { endpoint: sub.endpoint }; saveLocal();
    await pushSync();
    toast("Напоминания включены");
    return true;
  } catch (err) { toast("Не удалось включить уведомления: " + (err.message || err)); return false; }
}
async function pushSync() {
  if (!S.push || !S.push.endpoint || NATIVE) return;
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (!sub) { S.push = null; saveLocal(); return; }
    const c = await sbClient();
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Almaty";
    const { error } = await c.rpc("push_save", { p_sub: sub.toJSON(), p_tz: tz, p_hour: S.settings.hour, p_next_siege: nextSiege(), p_last_study: lastStudy(), p_streak: streak() });
    if (error) throw error;
    S.push.at = Date.now(); saveLocal();
  } catch (e) {}
}
async function pushDisable() {
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    const ep = (sub && sub.endpoint) || (S.push && S.push.endpoint);
    if (sub) await sub.unsubscribe();
    if (ep) { const c = await sbClient(); await c.rpc("push_delete", { p_endpoint: ep }); }
  } catch (e) {}
  S.push = null; saveLocal();
}
if (!NATIVE && "serviceWorker" in navigator && window.AVA_SW) {
  window.addEventListener("load", () => navigator.serviceWorker.register(window.AVA_SW).catch(() => {}));
}

/* --- резервная копия без аккаунта --- */
function backupDownload() {
  const blob = new Blob([JSON.stringify({ app: "AVALAND", v: S.v, at: new Date().toISOString(), data: cloudData() }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `avaland-progress-${dayKey(Date.now())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Файл с прогрессом сохранён");
}
function backupRestore(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!j || j.app !== "AVALAND" || !j.data) throw new Error("это не файл AVALAND");
      S = Object.assign(mergeState(S, j.data), { settings: S.settings, offset: S.offset, tab: S.tab });
      save(); checkAch(); render(); toast("Прогресс восстановлен");
    } catch (e) { toast("Не удалось прочитать файл: " + e.message); }
  };
  r.readAsText(file);
}
function cloudAction(a, b) {
  switch (a) {
    case "oauth": oauthStart(b.dataset.p); return true;
    case "authMode": authMode = b.dataset.m; render(); return true;
    case "cloudSync": cloudPull(true).then(() => toast(cloud.state === "ok" ? "Синхронизировано" : "Не удалось синхронизировать")); return true;
    case "signOut": sbClient().then(c => c.auth.signOut({ scope: "local" })).then(() => { me = null; toast("Вы вышли. Прогресс остался на этом устройстве"); render(); }); return true;
    case "delAcc": deleteAccount(); return true;
    case "backup": backupDownload(); return true;
    case "restore": { const i = $("#bk-file"); if (i) i.click(); return true; }
  }
  return false;
}
document.addEventListener("change", e => { if (e.target.id === "bk-file" && e.target.files[0]) { backupRestore(e.target.files[0]); e.target.value = ""; } });

if (DEV || window.AVA_SELFTEST) window.__ava = { get S() { return S; }, get Q() { return Q; }, save, render, startQuiz, openLesson, openCert, openCountry, openProblem, runJS, runPY, runSQL, leetFetch, runCode, wrapProgram, openPlay };
boot();

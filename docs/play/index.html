th}\"; else -> \"?\" })","ans":["str 2"]},{"t":"mc","q":"Чем <code>lateinit var</code> отличается от nullable?","e":"lateinit не поддерживает примитивные типы.","o":["Это не-null переменная, которую инициализируют позже, обращение до инициализации — исключение","Это то же самое, что String?","lateinit работает с Int","lateinit делает переменную val"],"a":0},{"t":"mc","q":"Что делает <code>by lazy { ... }</code>?","e":"По умолчанию потокобезопасно.","o":["Выполняет блок при создании объекта","Вычисляет значение при первом обращении и запоминает его","Делает переменную изменяемой","Запускает корутину"],"a":1},{"t":"out","q":"Что выведет код?","e":"also сначала выполняет print, затем println выводит 6.","c":"val s = \"kotlin\"\nprintln(s.let { it.length }.also { print(\"L\") })","ans":["L6"]},{"t":"fill","q":"Впишите scope-функцию, которая возвращает сам объект и даёт к нему доступ через this.","e":"apply удобен для настройки объекта.","c":"val user = User().___ { name = \"Ада\"; age = 36 }","ans":["apply"]},{"t":"mc","q":"Что произойдёт при отмене родительской корутины?","e":"Это структурная конкурентность.","o":["Все дочерние корутины тоже отменятся","Дочерние продолжат работу","Приложение упадёт","Ничего"],"a":0},{"t":"out","q":"Что выведет код?","e":"m[\"c\"] даёт null, элвис берёт значение b.","c":"val m = mapOf(\"a\" to 1, \"b\" to 2)\nprintln(m[\"c\"] ?: m.getValue(\"b\"))","ans":["2"]},{"t":"mc","q":"Какой оператор сравнивает ссылки в Kotlin?","e":"== вызывает equals.","o":["==","===","equals","is"],"a":1},{"t":"mc","q":"Что такое recomposition в Jetpack Compose?","e":"Compose перерисовывает только то, что зависит от изменившегося состояния.","o":["Повторный вызов composable-функций при изменении состояния","Пересборка проекта","Перезапуск Activity","Очистка кэша"],"a":0}]},{"id":"cs","name":"C#","land":"Королевство C#","color":"#8b5fb0","about":"Язык платформы .NET. Корпоративный бэкенд, десктоп, игры на Unity.","project":{"title":"Web API бронирования на ASP.NET Core","desc":"Сервис бронирования переговорных комнат.","req":["Сущности Room, Booking, User на Entity Framework Core с PostgreSQL","Проверка пересечения бронирований по времени в сервисном слое","Аутентификация через JWT, роли пользователь и администратор","Валидация через FluentValidation или DataAnnotations","Тесты на xUnit, включая интеграционные с WebApplicationFactory","Swagger-документация, Dockerfile, README"]},"lessons":[{"t":"Типы, переменные и строки","body":["C# строго типизирован. Значимые типы (<code>int</code>, <code>double</code>, <code>bool</code>, <code>struct</code>) хранят значение, ссылочные (<code>string</code>, классы, массивы) — ссылку на объект.","<code>var</code> выводит тип при компиляции — переменная не становится динамической. Интерполяция строк: <code>$\"Привет, {name}\"</code>. Строки неизменяемы; для сборки в цикле используйте <code>StringBuilder</code>.","Включённые nullable reference types (<code>&lt;Nullable&gt;enable</code>) отличают <code>string</code> от <code>string?</code> и предупреждают о возможном null."],"code":"int count = 5;\nvar price = 9.99m;            // decimal — для денег\nstring name = \"Ада\";\nstring? nickname = null;\n\nConsole.WriteLine($\"{name}: {count * price:F2}\");\nConsole.WriteLine(nickname ?? \"без ника\");\nConsole.WriteLine(7 / 2);     // 3\nConsole.WriteLine(7 / 2.0);   // 3.5\n\nvar sb = new StringBuilder();\nfor (int i = 0; i < 3; i++) sb.Append(i);\nConsole.WriteLine(sb.ToString()); // 012","tips":["decimal (суффикс m) — для денег, double — для научных расчётов","<code>??</code> подставляет значение для null, <code>?.</code> безопасно вызывает метод","Строки сравнивают через == — в C# это сравнение содержимого"],"q":[{"t":"mc","q":"Какой тип лучше для денежных сумм?","e":"decimal хранит десятичные дроби точно.","o":["double","float","decimal","int всегда"],"a":2},{"t":"out","q":"Что выведет код?","e":"Для string оператор == сравнивает содержимое.","c":"string a = \"hi\";\nstring b = \"h\" + \"i\";\nConsole.WriteLine(a == b);","ans":["True"]},{"t":"fill","q":"Впишите символ интерполяции строки.","e":"$ перед кавычками включает подстановки в {}.","c":"Console.WriteLine(___\"Итого: {sum}\");","ans":["$"]},{"t":"mc","q":"Чем является var x = 10?","e":"Для динамики есть dynamic.","o":["Переменной типа int, тип выведен при компиляции","Динамической переменной","object","Константой"],"a":0}]},{"t":"Управляющие конструкции и pattern matching","body":["<code>if</code>, <code>for</code>, <code>while</code>, <code>foreach</code> знакомы по другим языкам. <code>foreach</code> перебирает любую коллекцию, реализующую <code>IEnumerable</code>.","Switch-выражение возвращает значение и поддерживает шаблоны: по типу, по свойствам, по диапазонам. Это короче и надёжнее цепочки if-else.","Оператор <code>is</code> проверяет тип и сразу объявляет переменную: <code>if (obj is string s)</code>."],"code":"static string Grade(int score) => score switch\n{\n    >= 90 => \"A\",\n    >= 75 => \"B\",\n    >= 60 => \"C\",\n    _     => \"F\"\n};\n\nstatic decimal Discount(Customer c) => c switch\n{\n    { IsVip: true }               => 0.2m,\n    { Orders: > 10 }              => 0.1m,\n    _                             => 0m\n};\n\nobject value = \"text\";\nif (value is string s && s.Length > 2)\n    Console.WriteLine(s.ToUpper());","tips":["<code>_</code> в switch-выражении — ветка «всё остальное»","Шаблоны свойств <code>{ IsVip: true }</code> заменяют вложенные if","Без ветки <code>_</code> компилятор предупредит о необработанных значениях"],"q":[{"t":"out","q":"Что выведет код?","e":"7 не меньше 5, но меньше 10.","c":"int x = 7;\nvar r = x switch { < 5 => \"low\", < 10 => \"mid\", _ => \"high\" };\nConsole.WriteLine(r);","ans":["mid"]},{"t":"mc","q":"Что делает <code>if (o is int n)</code>?","e":"Это шаблон объявления.","o":["Проверяет, что o — int, и объявляет n с его значением","Приводит o к int с исключением при ошибке","Сравнивает o с переменной n","Создаёт новую переменную n = 0"],"a":0},{"t":"fill","q":"Впишите символ ветки «по умолчанию» в switch-выражении.","e":"Discard-шаблон совпадает с чем угодно.","c":"var t = code switch { 200 => \"ok\", ___ => \"error\" };","ans":["_"]},{"t":"out","q":"Что выведет код?","e":"2 + 4.","c":"var sum = 0;\nforeach (var n in new[] { 1, 2, 3, 4 })\n    if (n % 2 == 0) sum += n;\nConsole.WriteLine(sum);","ans":["6"]}],"run":false},{"t":"Классы, свойства и record","body":["Свойства с <code>get</code> и <code>set</code> — основной способ дать доступ к данным. <code>init</code> разрешает задать значение только при создании объекта. Основной конструктор класса пишут прямо в заголовке.","<code>record</code> — тип для неизменяемых данных: сравнение по значению, удобный <code>ToString</code> и выражение <code>with</code> для копии с изменениями.","<code>struct</code> — значимый тип: копируется при присваивании. Подходит для маленьких объектов вроде координат."],"code":"public class Player(string name)\n{\n    public string Name { get; } = name;\n    public int Level { get; private set; } = 1;\n    public void LevelUp() => Level++;\n}\n\npublic record Money(decimal Amount, string Currency);\n\nvar a = new Money(100, \"KZT\");\nvar b = a with { Amount = 200 };\nConsole.WriteLine(a == new Money(100, \"KZT\")); // True\nConsole.WriteLine(b);  // Money { Amount = 200, Currency = KZT }","tips":["record сравнивается по значениям полей, class — по ссылке","private set — читать могут все, менять только класс","with создаёт копию, исходный record не меняется"],"q":[{"t":"mc","q":"Как сравниваются два record с одинаковыми полями?","e":"Компилятор генерирует сравнение по полям.","o":["Равны по значению","Не равны, разные ссылки","Сравнение запрещено","Равны только если это один объект"],"a":0},{"t":"fill","q":"Впишите выражение для копии record с изменённым полем.","e":"Исходный объект не меняется.","c":"var updated = user ___ { Email = \"new@mail.kz\" };","ans":["with"]},{"t":"mc","q":"Что значит <code>{ get; init; }</code>?","e":"Например, new User { Name = \"Ада\" }.","o":["Свойство только для чтения навсегда","Значение можно задать только при создании объекта","Свойство вычисляется лениво","Свойство статическое"],"a":1},{"t":"out","q":"Что выведет код?","e":"struct копируется при присваивании.","c":"var p1 = new P { X = 1 };\nvar p2 = p1;\np2.X = 5;\nConsole.WriteLine(p1.X);\n\nstruct P { public int X; }","ans":["1"]}]},{"t":"Интерфейсы, наследование и DI","body":["Класс наследует один базовый класс и может реализовать много интерфейсов. Методы, которые можно переопределить, помечают <code>virtual</code>, а переопределение — <code>override</code>. <code>abstract</code> требует реализации в наследнике.","Интерфейсы описывают контракт: <code>IRepository</code>, <code>IEmailSender</code>. Код зависит от интерфейсов — тогда реализацию легко заменить.","ASP.NET Core имеет встроенный контейнер внедрения зависимостей. Сервисы регистрируют с временем жизни: <code>Singleton</code> — один на приложение, <code>Scoped</code> — один на HTTP-запрос, <code>Transient</code> — новый при каждом запросе."],"code":"public interface IEmailSender\n{\n    Task SendAsync(string to, string body);\n}\n\npublic class SmtpSender : IEmailSender\n{\n    public Task SendAsync(string to, string body) => Task.CompletedTask;\n}\n\npublic class BookingService(IEmailSender email)\n{\n    public async Task ConfirmAsync(Booking b) =>\n        await email.SendAsync(b.UserEmail, \"Бронь подтверждена\");\n}\n\n// Program.cs\nbuilder.Services.AddScoped<IEmailSender, SmtpSender>();\nbuilder.Services.AddScoped<BookingService>();","tips":["DbContext регистрируют как Scoped — один на запрос","Не внедряйте Scoped-сервис в Singleton","Без virtual метод нельзя переопределить"],"q":[{"t":"mc","q":"Какое время жизни у Scoped-сервиса в ASP.NET Core?","e":"Например, DbContext.","o":["Один на всё приложение","Один на HTTP-запрос","Новый при каждом внедрении","Один на пользователя"],"a":1},{"t":"fill","q":"Впишите модификатор, который разрешает переопределить метод.","e":"В наследнике пишут override.","c":"public ___ decimal Price() => 100;","ans":["virtual"]},{"t":"mc","q":"Почему BookingService принимает IEmailSender, а не SmtpSender?","e":"Это принцип инверсии зависимостей.","o":["Чтобы зависеть от контракта и подменять реализацию в тестах","Так быстрее работает","SmtpSender нельзя создать","Так требует C#"],"a":0},{"t":"mc","q":"Сколько базовых классов может быть у класса в C#?","e":"Интерфейсов — сколько угодно.","o":["Один","Два","Неограниченно","Ноль"],"a":0}],"run":false},{"t":"Обобщения и исключения","body":["Обобщения (generics) делают код универсальным без потери типов: <code>List&lt;T&gt;</code>, <code>Result&lt;T&gt;</code>, <code>Repository&lt;TEntity&gt;</code>. Ограничения <code>where T : class, new()</code> задают требования к типу.","Исключения обрабатывают через <code>try</code> / <code>catch</code> / <code>finally</code>. Ловите конкретные типы. Фильтр <code>catch (HttpRequestException e) when (e.StatusCode == ...)</code> уточняет условие. Повторный выброс — просто <code>throw;</code>, чтобы сохранить стек.","Для ожидаемых ошибок (не найдено, неверный ввод) многие команды используют результат-объект вместо исключений: исключения дороги и нарушают поток кода."],"code":"public record Result<T>(T? Value, string? Error)\n{\n    public bool Ok => Error is null;\n    public static Result<T> Success(T v) => new(v, null);\n    public static Result<T> Fail(string e) => new(default, e);\n}\n\npublic class Repo<T> where T : class, IEntity\n{\n    private readonly Dictionary<int, T> _items = new();\n    public Result<T> Find(int id) =>\n        _items.TryGetValue(id, out var e) ? Result<T>.Success(e) : Result<T>.Fail(\"не найдено\");\n}\n\ntry\n{\n    await client.GetStringAsync(url);\n}\ncatch (HttpRequestException e) when (e.StatusCode == HttpStatusCode.NotFound)\n{\n    logger.LogWarning(\"Нет ресурса {Url}\", url);\n}\ncatch (Exception)\n{\n    throw;   // сохраняет исходный стек\n}","tips":["<code>throw;</code> сохраняет стек, <code>throw e;</code> его теряет","Не используйте исключения для обычного потока логики","Ограничения where делают generic-код безопаснее"],"q":[{"t":"mc","q":"Чем <code>throw;</code> лучше <code>throw e;</code> в блоке catch?","e":"throw e; начинает стек заново.","o":["Сохраняет исходный стек вызовов","Работает быстрее","Ничем","Подавляет исключение"],"a":0},{"t":"fill","q":"Впишите ключевое слово ограничения generic-параметра.","e":"where T : class — только ссылочные типы.","c":"public class Cache<T> ___ T : class { }","ans":["where"]},{"t":"mc","q":"Что делает <code>catch (Exception e) when (условие)</code>?","e":"Это фильтр исключений.","o":["Ловит исключение только если условие истинно","Ловит все исключения всегда","Повторяет вызов","Логирует исключение"],"a":0},{"t":"out","q":"Что выведет код?","e":"string + int склеиваются в строку.","c":"static T Pick<T>(T a, T b, bool first) => first ? a : b;\nConsole.WriteLine(Pick(\"x\", \"y\", false) + Pick(1, 2, true));","ans":["y1"]}],"run":false},{"t":"Коллекции и LINQ","body":["<code>List&lt;T&gt;</code>, <code>Dictionary&lt;TKey, TValue&gt;</code>, <code>HashSet&lt;T&gt;</code> — основные коллекции. <code>IEnumerable&lt;T&gt;</code> — самый общий тип «то, что можно перебрать».","LINQ — запросы к коллекциям: <code>Where</code>, <code>Select</code>, <code>OrderBy</code>, <code>GroupBy</code>, <code>First</code>, <code>Any</code>, <code>Sum</code>. Запрос ленивый: он выполняется при переборе или вызове <code>ToList()</code>, <code>Count()</code>.","С Entity Framework тот же LINQ превращается в SQL. Важно не вызвать <code>ToList()</code> слишком рано, иначе фильтрация пойдёт в памяти, а не в базе."],"code":"var orders = new List<Order>\n{\n    new(\"Ада\", 120, true),\n    new(\"Алан\", 80, false),\n    new(\"Ада\", 200, true),\n};\n\nvar revenue = orders.Where(o => o.Paid).Sum(o => o.Total);     // 320\nvar byCustomer = orders\n    .GroupBy(o => o.Customer)\n    .Select(g => new { Name = g.Key, Total = g.Sum(o => o.Total) })\n    .OrderByDescending(x => x.Total)\n    .ToList();\nvar hasBig = orders.Any(o => o.Total > 150);                     // true\nvar first = orders.FirstOrDefault(o => o.Total > 999);           // null\n\nrecord Order(string Customer, decimal Total, bool Paid);","tips":["First бросает исключение на пустой выборке, FirstOrDefault вернёт default","Ленивый запрос выполняется каждый раз при переборе","В EF фильтруйте до ToList()"],"q":[{"t":"out","q":"Что выведет код?","e":"Отбор больше 2, затем сортировка.","c":"var r = new[] { 5, 3, 8, 1 }.Where(n => n > 2).OrderBy(n => n);\nConsole.WriteLine(string.Join(\",\", r));","ans":["3,5,8"]},{"t":"mc","q":"Когда выполняется LINQ-запрос без ToList()?","e":"Это отложенное выполнение.","o":["Сразу при объявлении","При переборе результата","Никогда","При компиляции"],"a":1},{"t":"fill","q":"Впишите метод: есть ли хотя бы один элемент с условием.","e":"All проверяет условие для всех.","c":"bool any = users.___(u => u.IsAdmin);","ans":["Any"]},{"t":"mc","q":"Что вернёт <code>FirstOrDefault</code> для пустой коллекции ссылочных объектов?","e":"default для ссылочного типа — null.","o":["null","Исключение","Пустой объект","-1"],"a":0}]},{"t":"async/await и Task","body":["<code>async</code> метод возвращает <code>Task</code> или <code>Task&lt;T&gt;</code>. <code>await</code> ждёт завершения задачи, не блокируя поток, — сервер в это время обслуживает другие запросы.","Независимые операции запускайте вместе и ждите через <code>Task.WhenAll</code>. Не блокируйте асинхронный код через <code>.Result</code> или <code>.Wait()</code> — это ведёт к взаимоблокировкам и истощению пула потоков.","<code>CancellationToken</code> позволяет отменить долгую операцию, например когда клиент закрыл соединение."],"code":"public async Task<Dashboard> LoadAsync(int userId, CancellationToken ct)\n{\n    var userTask   = _users.GetAsync(userId, ct);\n    var ordersTask = _orders.GetRecentAsync(userId, ct);\n    await Task.WhenAll(userTask, ordersTask);\n    return new Dashboard(userTask.Result, ordersTask.Result);\n}\n\n// плохо:\n// var user = _users.GetAsync(id).Result;","tips":["async void — только для обработчиков событий",".Result после await Task.WhenAll безопасен: задача уже завершена","Пробрасывайте CancellationToken во все async-вызовы"],"q":[{"t":"mc","q":"Почему опасно писать <code>.Result</code> у незавершённой задачи?","e":"Используйте await.","o":["Это медленно компилируется","Блокирует поток и может вызвать взаимоблокировку","Возвращает null","Отменяет задачу"],"a":1},{"t":"fill","q":"Впишите метод, который ждёт завершения всех задач.","e":"WhenAny ждёт первую завершившуюся.","c":"await Task.___(t1, t2, t3);","ans":["WhenAll"]},{"t":"mc","q":"Что возвращает <code>async Task&lt;int&gt; GetAsync()</code>?","e":"Результат получают через await.","o":["int","Task&lt;int&gt;","void","ValueTask всегда"],"a":1},{"t":"mc","q":"Для чего CancellationToken?","e":"Например, при закрытии соединения клиентом.","o":["Для отмены долгой операции","Для авторизации","Для логирования","Для повтора запроса"],"a":0}],"run":false},{"t":"ASP.NET Core и Entity Framework","body":["ASP.NET Core строит веб-API. Minimal API описывает эндпоинты в Program.cs: <code>app.MapGet</code>, <code>app.MapPost</code>. Контроллеры подходят для больших проектов.","Запрос проходит через конвейер middleware: логирование, обработка ошибок, аутентификация, маршрутизация. Порядок регистрации middleware важен.","Entity Framework Core связывает классы с таблицами. <code>DbContext</code> — единица работы, <code>DbSet&lt;T&gt;</code> — таблица. Изменения схемы фиксируются миграциями: <code>dotnet ef migrations add</code> и <code>dotnet ef database update</code>."],"code":"var builder = WebApplication.CreateBuilder(args);\nbuilder.Services.AddDbContext<AppDb>(o =>\n    o.UseNpgsql(builder.Configuration.GetConnectionString(\"Db\")));\nvar app = builder.Build();\n\napp.MapGet(\"/rooms\", async (AppDb db) =>\n    await db.Rooms.AsNoTracking().ToListAsync());\n\napp.MapPost(\"/rooms\", async (Room room, AppDb db) =>\n{\n    db.Rooms.Add(room);\n    await db.SaveChangesAsync();\n    return Results.Created($\"/rooms/{room.Id}\", room);\n});\n\napp.Run();\n\npublic class AppDb(DbContextOptions<AppDb> o) : DbContext(o)\n{\n    public DbSet<Room> Rooms => Set<Room>();\n}","tips":["Строку подключения держите в конфигурации, не в коде","AsNoTracking ускоряет запросы только для чтения","Без SaveChangesAsync изменения не попадут в базу"],"q":[{"t":"mc","q":"Что сохраняет изменения в базе в EF Core?","e":"Add только отмечает объект для вставки.","o":["db.Rooms.Add","SaveChangesAsync()","ToListAsync()","Migrate()"],"a":1},{"t":"mc","q":"Что такое middleware?","e":"Например, аутентификация или обработка ошибок.","o":["Звено конвейера, через которое проходит каждый запрос","Таблица базы данных","Клиентская библиотека","Шаблон страницы"],"a":0},{"t":"fill","q":"Впишите метод регистрации GET-эндпоинта в Minimal API.","e":"Для POST — MapPost.","c":"app.___(\"/health\", () => \"ok\");","ans":["MapGet"]},{"t":"mc","q":"Какой статус-код правильно вернуть после создания ресурса?","e":"201 Created с адресом нового ресурса.","o":["200","201","204","302"],"a":1}],"run":false}],"exam":[{"t":"out","q":"Что выведет код?","e":"Запрос ленивый и выполнился уже после добавления 4.","c":"var list = new List<int> { 1, 2, 3 };\nvar q = list.Where(x => x > 1);\nlist.Add(4);\nConsole.WriteLine(q.Count());","ans":["3"]},{"t":"out","q":"Что выведет код?","e":"?. дал null, ?? подставил -1.","c":"string? s = null;\nConsole.WriteLine(s?.Length ?? -1);","ans":["-1"]},{"t":"out","q":"Что выведет код?","e":"a++ вернёт 5 (a станет 6), затем ++a даст 7: 5 + 7.","c":"int a = 5;\nint b = a++ + ++a;\nConsole.WriteLine(b);","ans":["12"]},{"t":"mc","q":"Чем <code>IEnumerable</code> отличается от <code>IQueryable</code> в EF?","e":"После AsEnumerable фильтрация идёт на стороне приложения.","o":["IQueryable превращает выражение в SQL, IEnumerable фильтрует в памяти","Ничем","IEnumerable быстрее всегда","IQueryable только для массивов"],"a":0},{"t":"out","q":"Что выведет код?","e":"with создаёт новый объект с теми же значениями.","c":"var r1 = new R(1);\nvar r2 = r1 with { };\nConsole.WriteLine($\"{r1 == r2} {ReferenceEquals(r1, r2)}\");\n\nrecord R(int X);","ans":["True False"]},{"t":"mc","q":"Что такое boxing?","e":"Лишний boxing создаёт нагрузку на сборщик мусора.","o":["Шифрование значения","Упаковка значимого типа в object в куче","Приведение класса к интерфейсу","Сериализация в JSON"],"a":1},{"t":"fill","q":"Впишите ключевое слово, которое гарантирует вызов Dispose.","e":"using вызывает Dispose при выходе из области.","c":"___ var file = File.OpenRead(\"a.txt\");","ans":["using"]},{"t":"out","q":"Что выведет код?","e":"Ключа нет, TryGetValue вернул false.","c":"var d = new Dictionary<string, int> { [\"a\"] = 1 };\nConsole.WriteLine(d.TryGetValue(\"b\", out var v) ? v : 0);","ans":["0"]},{"t":"mc","q":"Какая проблема у Singleton-сервиса, который получает DbContext?","e":"В ASP.NET Core в разработке это ловит проверка областей.","o":["DbContext переживёт запрос и будет использоваться конкурентно","Ничего страшного","Сервис станет Transient","Приложение не запустится никогда"],"a":0},{"t":"mc","q":"Что делает <code>ConfigureAwait(false)</code> в библиотечном коде?","e":"Важно для UI-приложений и старого ASP.NET.","o":["Не возвращается в исходный контекст синхронизации после await","Отключает await","Делает метод синхронным","Отменяет задачу"],"a":0},{"t":"out","q":"Что выведет код?","e":"(1·10+2)·10+3.","c":"Console.WriteLine(new[] { 1, 2, 3 }.Aggregate((a, b) => a * 10 + b));","ans":["123"]},{"t":"mc","q":"Какой HTTP-метод идемпотентен?","e":"Повторный PUT с тем же телом даёт тот же результат.","o":["POST","PUT","PATCH всегда","CONNECT"],"a":1}]},{"id":"cpp","name":"C++","land":"Пики C++","color":"#6585b5","about":"Максимальная скорость и контроль памяти. Игры, движки, браузеры, встраиваемые системы, трейдинг.","project":{"title":"Консольный менеджер задач с сохранением","desc":"Утилита на современном C++ для управления задачами из терминала.","req":["Классы Task и TaskManager, RAII, никаких ручных new/delete","Хранение в файле (CSV или JSON через nlohmann/json)","Команды: add, done, list с фильтрами и сортировкой через &lt;algorithm&gt;","Обработка ошибок через исключения и std::optional","Сборка через CMake, юнит-тесты на GoogleTest или Catch2","Проверка утечек через AddressSanitizer, README с инструкцией сборки"]},"lessons":[{"t":"Основы: типы, ввод-вывод, компиляция","body":["C++ компилируется в машинный код: компилятор (g++, clang++) превращает исходники в исполняемый файл. Ошибки типов ловятся при компиляции.","Основные типы: <code>int</code>, <code>long long</code>, <code>double</code>, <code>bool</code>, <code>char</code>, а строки — <code>std::string</code>. <code>auto</code> выводит тип из инициализатора. Неинициализированная локальная переменная содержит мусор.","Ввод-вывод через потоки: <code>std::cin &gt;&gt; x</code>, <code>std::cout &lt;&lt; x</code>. <code>'\\n'</code> быстрее <code>std::endl</code>, потому что не сбрасывает буфер."],"code":"#include <iostream>\n#include <string>\n\nint main() {\n    std::string name;\n    int age = 0;                       // всегда инициализируйте\n    std::cin >> name >> age;\n    auto years = age + 1;              // int\n    std::cout << name << \": \" << years << '\\n';\n    std::cout << 7 / 2 << ' ' << 7 / 2.0 << '\\n';  // 3 3.5\n    return 0;\n}\n// g++ -std=c++20 -Wall -Wextra main.cpp -o app","tips":["Компилируйте с -Wall -Wextra: предупреждения находят баги","Неинициализированная переменная — неопределённое поведение","<code>using namespace std;</code> в заголовках — плохая практика"],"q":[{"t":"out","q":"Что выведет код?","e":"Целочисленное деление и остаток.","c":"std::cout << 7 / 2 << ' ' << 7 % 2;","ans":["3 1"]},{"t":"mc","q":"Что содержит <code>int x;</code> внутри функции до присваивания?","e":"Это неопределённое поведение при чтении.","o":["0","Неопределённое значение","-1","Ошибку компиляции"],"a":1},{"t":"fill","q":"Впишите ключевое слово автоматического вывода типа.","e":"Тип берётся из выражения.","c":"___ total = price * qty;","ans":["auto"]},{"t":"mc","q":"Чем <code>'\\n'</code> лучше <code>std::endl</code> в цикле?","e":"endl = '\\n' + flush.","o":["Не сбрасывает буфер на каждой строке и работает быстрее","Работает на всех ОС, а endl нет","Ничем","endl не переводит строку"],"a":0}]},{"t":"Условия, циклы и строки","body":["Условия <code>if</code> / <code>else if</code> / <code>else</code> и <code>switch</code> для целых и перечислений. В switch без <code>break</code> выполнение проваливается в следующий case. <code>if</code> с инициализатором (C++17): <code>if (auto it = m.find(k); it != m.end())</code>.","Циклы <code>for</code>, <code>while</code>, <code>do-while</code> и range-based for: <code>for (const auto&amp; x : v)</code>. Используйте <code>const auto&amp;</code>, чтобы не копировать элементы.","<code>std::string</code> — изменяемая строка: <code>size()</code>, <code>substr</code>, <code>find</code> (возвращает <code>npos</code>, если не нашлось), <code>+=</code>. Для числа из строки — <code>std::stoi</code>, обратно — <code>std::to_string</code>."],"code":"#include <string>\n\nstd::string s = \"hello, world\";\nauto pos = s.find(',');\nif (pos != std::string::npos) {\n    std::string first = s.substr(0, pos);     // \"hello\"\n    std::cout << first << '\\n';\n}\n\nfor (char& c : s) c = std::toupper(static_cast<unsigned char>(c));\n\nint sum = 0;\nfor (int i = 1; i <= 10; ++i) {\n    if (i % 2) continue;\n    sum += i;                                  // 30\n}\n\nswitch (sum / 10) {\n    case 3: std::cout << \"тридцать\\n\"; break;\n    default: std::cout << \"другое\\n\";\n}\nstd::cout << std::stoi(\"42\") + 1 << ' ' << std::to_string(3.5) << '\\n';","tips":["find возвращает std::string::npos, а не -1","<code>const auto&amp;</code> в range-for избегает копий","Не забывайте break в switch"],"q":[{"t":"out","q":"Что выведет код?","e":"С позиции 2 взять 3 символа.","c":"std::string s = \"abcdef\";\nstd::cout << s.substr(2, 3);","ans":["cde"]},{"t":"out","q":"Что выведет код?","e":"0 + 1 + 2.","c":"int n = 0;\nfor (int i = 0; i < 5; ++i) { if (i == 3) break; n += i; }\nstd::cout << n;","ans":["3"]},{"t":"fill","q":"Впишите константу «не найдено» для std::string::find.","e":"Это максимальное значение size_t.","c":"if (s.find(\"x\") == std::string::___) {}","ans":["npos"]},{"t":"mc","q":"Зачем писать <code>for (const auto&amp; item : items)</code>?","e":"Для изменения используйте auto&amp;.","o":["Чтобы не копировать элементы и не менять их","Чтобы цикл шёл в обратном порядке","Так быстрее компилируется","Чтобы можно было удалять элементы"],"a":0}]},{"t":"Функции, ссылки и указатели","body":["Аргументы по умолчанию передаются по значению — копируются. Большие объекты передают по константной ссылке <code>const T&amp;</code>: без копии и без права изменить.","Ссылка <code>T&amp;</code> — псевдоним существующего объекта, она не бывает пустой. Указатель <code>T*</code> хранит адрес, может быть <code>nullptr</code> и переназначаться. <code>&amp;x</code> берёт адрес, <code>*p</code> разыменовывает.","Нельзя возвращать ссылку или указатель на локальную переменную: после выхода из функции она уничтожена."],"code":"void increment(int& n) { ++n; }\nint sumAll(const std::vector<int>& v) {\n    int s = 0;\n    for (int x : v) s += x;\n    return s;\n}\n\nint main() {\n    int a = 5;\n    increment(a);                    // a = 6\n    int* p = &a;\n    *p = 10;                         // a = 10\n    int* none = nullptr;\n    if (none) { /* не выполнится */ }\n    std::cout << a << ' ' << sumAll({1, 2, 3}) << '\\n';  // 10 6\n}","tips":["Строки и векторы передавайте как const T&amp;","Используйте nullptr, а не NULL или 0","Висячая ссылка на локальную переменную — неопределённое поведение"],"q":[{"t":"out","q":"Что выведет код?","e":"Аргумент передан по значению — изменилась копия.","c":"void f(int x) { x = 100; }\nint main() { int a = 1; f(a); std::cout << a; }","ans":["1"]},{"t":"out","q":"Что выведет код?","e":"(3 + 2) * 2.","c":"int a = 3;\nint& r = a;\nr += 2;\nint* p = &a;\n*p *= 2;\nstd::cout << a;","ans":["10"]},{"t":"fill","q":"Впишите тип параметра: строка без копирования и без изменения.","e":"Константная ссылка.","c":"void print(___ s);","ans":["const std::string&","const string&"]},{"t":"mc","q":"Что не так с <code>int&amp; f() { int x = 5; return x; }</code>?","e":"Висячая ссылка.","o":["Ничего","Возвращается ссылка на уничтоженную локальную переменную","Нельзя возвращать int","Ошибка синтаксиса"],"a":1}]},{"t":"Классы и RAII","body":["Класс объединяет данные и методы. <code>public</code> члены доступны всем, <code>private</code> — только классу. Конструктор инициализирует объект, лучше через список инициализации.","RAII: ресурс захватывают в конструкторе и освобождают в деструкторе <code>~Class()</code>. Объект вышел из области видимости — ресурс освободился, даже при исключении.","Правило нуля: если класс хранит ресурсы через стандартные типы (<code>std::string</code>, <code>std::vector</code>, умные указатели), не пишите деструктор и копирование вручную."],"code":"class Account {\npublic:\n    explicit Account(std::string owner, double balance = 0)\n        : owner_(std::move(owner)), balance_(balance) {}\n\n    void deposit(double sum) {\n        if (sum <= 0) throw std::invalid_argument(\"sum <= 0\");\n        balance_ += sum;\n    }\n    double balance() const { return balance_; }\n\nprivate:\n    std::string owner_;\n    double balance_;\n};\n\nclass Timer {\npublic:\n    Timer()  { start_ = std::chrono::steady_clock::now(); }\n    ~Timer() { /* вывести затраченное время */ }\nprivate:\n    std::chrono::steady_clock::time_point start_;\n};","tips":["Методы, не меняющие объект, помечайте const","explicit запрещает неявные преобразования","Порядок инициализации полей — порядок объявления, а не списка"],"q":[{"t":"mc","q":"Когда вызывается деструктор объекта на стеке?","e":"Это основа RAII.","o":["При выходе из области видимости","При вызове delete","Никогда автоматически","При завершении программы"],"a":0},{"t":"mc","q":"Что означает const после метода: <code>double balance() const</code>?","e":"Его можно вызывать у константных объектов.","o":["Метод возвращает константу","Метод не изменяет поля объекта","Метод статический","Метод нельзя переопределить"],"a":1},{"t":"fill","q":"Впишите символ, с которого начинается имя деструктора.","e":"Тильда перед именем класса.","c":"___Account() {}","ans":["~"]},{"t":"mc","q":"Что такое правило нуля?","e":"Компилятор сгенерирует правильные версии.","o":["Не писать свои деструктор и копирование, если ресурсы управляются стандартными типами","Инициализировать всё нулями","Не использовать указатели","Не создавать глобальных переменных"],"a":0}]},{"t":"Динамическая память и умные указатели","body":["<code>new</code> выделяет память в куче, <code>delete</code> освобождает. Забыли delete — утечка, удалили дважды — неопределённое поведение. В современном C++ ручной new/delete почти не нужен.","<code>std::unique_ptr</code> единолично владеет объектом и удаляет его сам. Его нельзя копировать, только перемещать через <code>std::move</code>. Создают через <code>std::make_unique</code>.","<code>std::shared_ptr</code> — совместное владение со счётчиком ссылок. Циклические ссылки shared_ptr не освобождаются — разрывают их через <code>std::weak_ptr</code>."],"code":"#include <memory>\n\nstruct Node { int value; };\n\nauto a = std::make_unique<Node>(Node{42});\n// auto b = a;               // ошибка: копирование запрещено\nauto b = std::move(a);       // владение передано, a == nullptr\n\nauto s1 = std::make_shared<Node>(Node{7});\nauto s2 = s1;\nstd::cout << s1.use_count();  // 2\n\nstd::weak_ptr<Node> w = s1;\nif (auto locked = w.lock()) std::cout << locked->value;","tips":["По умолчанию — unique_ptr, shared_ptr только когда владение реально общее","После std::move старым объектом пользоваться нельзя","Обращение к удалённой памяти — неопределённое поведение"],"q":[{"t":"mc","q":"Что произойдёт с объектом unique_ptr при выходе из области видимости?","e":"unique_ptr вызывает delete в деструкторе.","o":["Объект автоматически удалится","Произойдёт утечка","Нужно вызвать delete","Объект останется в куче"],"a":0},{"t":"out","q":"Что выведет код?","e":"Внутри блока три владельца, после — два.","c":"auto p = std::make_shared<int>(5);\nauto q = p;\n{\n    auto r = p;\n    std::cout << p.use_count();\n}\nstd::cout << p.use_count();","ans":["32"]},{"t":"fill","q":"Впишите функцию передачи владения unique_ptr.","e":"unique_ptr можно только перемещать.","c":"auto owner2 = std::___(owner1);","ans":["move"]},{"t":"mc","q":"Как решить утечку при циклических shared_ptr?","e":"weak_ptr не увеличивает счётчик.","o":["Использовать unique_ptr везде","Сделать одну из связей weak_ptr","Вызвать delete вручную","Использовать raw-указатели в обе стороны"],"a":1}]},{"t":"STL: контейнеры","body":["<code>std::vector</code> — динамический массив и выбор по умолчанию. <code>std::map</code> — отсортированный словарь (дерево, O(log n)), <code>std::unordered_map</code> — хэш-таблица (O(1) в среднем). <code>std::set</code> хранит уникальные отсортированные значения.","<code>operator[]</code> у map создаёт элемент, если ключа нет. Для проверки используйте <code>find</code> или <code>contains</code> (C++20).","При вставке в vector итераторы и ссылки на элементы могут стать недействительными — вектор перевыделяет память. <code>reserve</code> заранее выделяет место."],"code":"std::vector<int> v;\nv.reserve(100);\nfor (int i = 0; i < 5; ++i) v.push_back(i * i);\n\nstd::unordered_map<std::string, int> count;\nfor (const auto& w : {\"a\", \"b\", \"a\"}) ++count[w];\nstd::cout << count[\"a\"] << '\\n';            // 2\nstd::cout << count.contains(\"z\") << '\\n';   // 0\n\nstd::map<std::string, int> sorted(count.begin(), count.end());\nfor (const auto& [key, val] : sorted)       // структурная привязка\n    std::cout << key << '=' << val << ' ';","tips":["map[key] при чтении создаёт пустой элемент","vector почти всегда быстрее list из-за кэша процессора","Структурные привязки <code>auto [k, v]</code> делают перебор map читаемым"],"q":[{"t":"mc","q":"Какая сложность поиска в std::map?","e":"map — сбалансированное дерево.","o":["O(1)","O(log n)","O(n)","O(n log n)"],"a":1},{"t":"out","q":"Что выведет код?","e":"operator[] создал элемент со значением 0.","c":"std::map<std::string, int> m;\nstd::cout << m[\"x\"] << m.size();","ans":["01"]},{"t":"fill","q":"Впишите метод, который заранее выделяет память в vector.","e":"resize изменил бы размер, а reserve — только ёмкость.","c":"v.___(1000);","ans":["reserve"]},{"t":"mc","q":"Что может случиться со ссылкой на элемент vector после push_back?","e":"При перевыделении элементы переезжают.","o":["Она может стать недействительной","Ничего","Она укажет на новый элемент","Будет ошибка компиляции"],"a":0}]},{"t":"STL: алгоритмы и лямбды","body":["Заголовок <code>&lt;algorithm&gt;</code> содержит готовые алгоритмы: <code>sort</code>, <code>find_if</code>, <code>count_if</code>, <code>transform</code>, <code>accumulate</code> (в <code>&lt;numeric&gt;</code>), <code>remove_if</code>. Используйте их вместо ручных циклов.","Лямбда <code>[захват](параметры) { тело }</code> создаёт функцию на месте. <code>[=]</code> захватывает по значению, <code>[&amp;]</code> — по ссылке, можно перечислить переменные явно.","<code>remove_if</code> не удаляет элементы, а сдвигает их и возвращает новый конец. Удаление — идиома erase-remove или <code>std::erase_if</code> в C++20. С C++20 есть ranges: <code>std::ranges::sort(v)</code>."],"code":"#include <algorithm>\n#include <numeric>\n\nstd::vector<int> v{5, 3, 8, 1, 9, 2};\nstd::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });\n\nint limit = 4;\nauto big = std::count_if(v.begin(), v.end(), [limit](int x) { return x > limit; });\nint sum = std::accumulate(v.begin(), v.end(), 0);\n\nstd::erase_if(v, [](int x) { return x % 2 == 0; });   // C++20\n\nauto it = std::find_if(v.begin(), v.end(), [](int x) { return x < 3; });\nif (it != v.end()) std::cout << *it;","tips":["Захват [&amp;] опасен, если лямбда переживёт переменные","remove_if без erase не уменьшает размер контейнера","find возвращает end(), если ничего не нашлось"],"q":[{"t":"out","q":"Что выведет код?","e":"После сортировки 1, 3, 4.","c":"std::vector<int> v{4, 1, 3};\nstd::sort(v.begin(), v.end());\nstd::cout << v[0] << v[2];","ans":["14"]},{"t":"mc","q":"Что вернёт std::find, если элемента нет?","e":"Всегда сравнивайте с end().","o":["nullptr","-1","Итератор end()","Исключение"],"a":2},{"t":"fill","q":"Впишите алгоритм суммы диапазона из &lt;numeric&gt;.","e":"Третий аргумент — начальное значение и тип результата.","c":"int s = std::___(v.begin(), v.end(), 0);","ans":["accumulate"]},{"t":"mc","q":"Что делает <code>[&amp;]</code> в лямбде?","e":"[=] захватывает копии.","o":["Захватывает используемые переменные по ссылке","Захватывает по значению","Ничего не захватывает","Делает лямбду константной"],"a":0}]},{"t":"Шаблоны, move-семантика и сборка","body":["Шаблоны пишут код один раз для разных типов: <code>template &lt;typename T&gt; T maxOf(T a, T b)</code>. Компилятор генерирует версию для каждого типа. Концепты C++20 (<code>std::integral</code>) ограничивают допустимые типы.","Move-семантика передаёт ресурсы вместо копирования. <code>std::move</code> превращает объект в rvalue, и вызывается конструктор перемещения — вектор из миллиона элементов «переедет» за O(1).","Проекты собирают через CMake. Код делят на заголовки (.h, объявления) и исходники (.cpp, реализация). Заголовок защищают от двойного включения <code>#pragma once</code>."],"code":"#include <concepts>\n\ntemplate <std::integral T>\nT gcd(T a, T b) {\n    while (b != 0) { T t = a % b; a = b; b = t; }\n    return a;\n}\n\nstd::vector<std::string> make() {\n    std::vector<std::string> v(1'000'000, \"x\");\n    return v;                    // перемещение или elision, не копия\n}\n\n// CMakeLists.txt\n// cmake_minimum_required(VERSION 3.20)\n// project(tasks CXX)\n// set(CMAKE_CXX_STANDARD 20)\n// add_executable(tasks main.cpp task.cpp)","tips":["Реализацию шаблонов обычно держат в заголовке","Не пишите <code>return std::move(local);</code> — это мешает оптимизации","Санитайзеры -fsanitize=address,undefined находят ошибки памяти"],"q":[{"t":"mc","q":"Что делает std::move?","e":"Само перемещение делает конструктор перемещения.","o":["Перемещает объект в памяти сам по себе","Приводит объект к rvalue, разрешая вызвать перемещение","Копирует объект","Удаляет объект"],"a":1},{"t":"fill","q":"Впишите директиву защиты заголовка от повторного включения.","e":"Альтернатива — include guards.","c":"#___ once","ans":["pragma"]},{"t":"mc","q":"Где обычно размещают реализацию шаблона функции?","e":"Компилятору нужна реализация в месте использования.","o":["В заголовочном файле","Только в .cpp","В CMakeLists.txt","В отдельной библиотеке обязательно"],"a":0},{"t":"out","q":"Что выведет код?","e":"Шаблон работает для int и string.","c":"template <typename T> T twice(T x) { return x + x; }\nstd::cout << twice(3) << twice(std::string(\"ab\"));","ans":["6abab"]}]}],"exam":[{"t":"out","q":"Что выведет код?","e":"Классический способ узнать длину массива на стеке.","c":"int a[] = {1, 2, 3, 4};\nstd::cout << sizeof(a) / sizeof(a[0]);","ans":["4"]},{"t":"out","q":"Что выведет код?","e":"Постфиксный инкремент вернул 5, затем x стал 6.","c":"int x = 5;\nint y = x++ * 2;\nstd::cout << x << y;","ans":["610"]},{"t":"mc","q":"Что из этого неопределённое поведение?","e":"Переполнение unsigned определено: оно заворачивается по модулю.","o":["Деление double на 0.0","Переполнение signed int","Переполнение unsigned int","Сравнение указателя с nullptr"],"a":1},{"t":"out","q":"Что выведет код?","e":"Беззнаковое число завернулось к максимальному значению.","c":"unsigned int u = 0;\nu--;\nstd::cout << (u > 0);","ans":["1"]},{"t":"out","q":"Что выведет код?","e":"Поля конструируются до тела конструктора, а разрушаются в обратном порядке.","c":"struct A { A() { std::cout << \"A\"; } ~A() { std::cout << \"a\"; } };\nstruct B { A a; B() { std::cout << \"B\"; } ~B() { std::cout << \"b\"; } };\nint main() { B b; }","ans":["ABba"]},{"t":"mc","q":"Зачем базовому классу виртуальный деструктор?","e":"Иначе ресурсы наследника утекут.","o":["Чтобы delete через указатель на базу вызвал деструктор наследника","Чтобы класс нельзя было создать","Для ускорения","Чтобы запретить наследование"],"a":0},{"t":"out","q":"Что выведет код?","e":"Остались 1 и 2.","c":"std::vector<int> v{1, 2, 3, 4, 5};\nv.erase(std::remove_if(v.begin(), v.end(), [](int x){ return x > 2; }), v.end());\nstd::cout << v.size();","ans":["2"]},{"t":"fill","q":"Впишите ключевое слово, запрещающее неявное преобразование через конструктор.","e":"Без explicit double молча превратится в Meters.","c":"___ Meters(double v);","ans":["explicit"]},{"t":"mc","q":"Чем <code>std::array&lt;int, 5&gt;</code> отличается от <code>std::vector&lt;int&gt;</code>?","e":"vector хранит данные в куче и меняет размер.","o":["Размер array фиксирован при компиляции, данные на стеке","array медленнее","vector нельзя индексировать","Ничем"],"a":0},{"t":"out","q":"Что выведет код?","e":"На практике перемещённая строка пуста, хотя стандарт гарантирует лишь валидное состояние.","c":"std::string s = \"hello\";\nstd::string t = std::move(s);\nstd::cout << t.size() << s.empty();","ans":["51"]},{"t":"mc","q":"Что такое data race?","e":"Это неопределённое поведение. Защищают std::mutex или std::atomic.","o":["Доступ из нескольких потоков к одной памяти, где хотя бы один пишет, без синхронизации","Медленная работа потока","Ошибка компиляции","Утечка памяти"],"a":0},{"t":"mc","q":"Что делает <code>std::lock_guard&lt;std::mutex&gt; lock(m);</code>?","e":"Это RAII для мьютексов.","o":["Захватывает мьютекс и освобождает его при выходе из области","Создаёт новый поток","Блокирует программу навсегда","Копирует мьютекс"],"a":0}]},{"id":"go","name":"Go","land":"Гоферия","color":"#45a3a6","about":"Простой и быстрый язык от Google. Микросервисы, облако, DevOps-инструменты.","project":{"title":"Сервис коротких ссылок","desc":"HTTP-сервис, который сокращает ссылки и считает переходы.","req":["Эндпоинты POST /shorten и GET /{code} с редиректом","Хранение в PostgreSQL через pgx, миграции","Кэш популярных ссылок в памяти с sync.RWMutex или в Redis","Graceful shutdown через context и сигналы ОС","Табличные тесты и тесты HTTP-хендлеров через httptest","Dockerfile в два этапа, Makefile и README"]},"lessons":[{"t":"Переменные, типы и функции","body":["Go компилируется в один исполняемый файл. <code>:=</code> объявляет переменную с выводом типа внутри функций, <code>var</code> — где угодно. Неиспользуемые переменные и импорты — ошибки компиляции.","У каждого типа есть нулевое значение: <code>0</code>, <code>\"\"</code>, <code>false</code>, <code>nil</code>. Неинициализированных переменных в Go не бывает.","Функция может вернуть несколько значений — так в Go возвращают результат и ошибку. Имена с большой буквы экспортируются из пакета, с маленькой — видны только внутри."],"code":"package main\n\nimport \"fmt\"\n\nfunc divide(a, b float64) (float64, error) {\n    if b == 0 {\n        return 0, fmt.Errorf(\"деление на ноль\")\n    }\n    return a / b, nil\n}\n\nfunc main() {\n    name := \"Ада\"\n    var count int          // 0\n    res, err := divide(7, 2)\n    if err != nil {\n        fmt.Println(err)\n        return\n    }\n    fmt.Println(name, count, res)  // Ада 0 3.5\n    fmt.Println(7 / 2)             // 3\n}","tips":["Ошибка — обычное значение, её проверяют сразу после вызова","Подчёркивание <code>_</code> игнорирует ненужное значение","gofmt форматирует код единообразно — не спорьте о стиле"],"q":[{"t":"out","q":"Что выведет код?","e":"Нулевые значения типов.","c":"var s string\nvar n int\nvar ok bool\nfmt.Println(len(s), n, ok)","ans":["0 0 false"]},{"t":"mc","q":"Что будет при неиспользуемом импорте?","e":"Go строг к мусору в коде.","o":["Предупреждение","Ошибка компиляции","Ничего","Паника при запуске"],"a":1},{"t":"fill","q":"Впишите, чем игнорируют ненужное возвращаемое значение.","e":"Пустой идентификатор.","c":"value, ___ := strconv.Atoi(\"42\")","ans":["_"]},{"t":"mc","q":"Как экспортировать функцию из пакета?","e":"Например, func Parse, а не func parse.","o":["Назвать её с заглавной буквы","Написать export","Написать public","Добавить в go.mod"],"a":0}]},{"t":"Управляющие конструкции","body":["В Go один цикл — <code>for</code>. Он заменяет while (<code>for cond {}</code>), бесконечный цикл (<code>for {}</code>) и перебор (<code>for i, v := range slice</code>).","<code>if</code> может содержать короткое объявление: <code>if v, err := f(); err != nil {}</code>. Переменная видна только внутри if/else.","<code>switch</code> не проваливается без явного <code>fallthrough</code>, case может содержать несколько значений или условия. <code>defer</code> откладывает вызов до выхода из функции — так закрывают файлы и освобождают блокировки."],"code":"for i := 0; i < 3; i++ { fmt.Print(i) }        // 012\n\nn := 10\nfor n > 0 { n -= 4 }                            // while\n\nfor i, ch := range \"го\" { fmt.Println(i, string(ch)) }\n\nswitch day := \"sat\"; day {\ncase \"sat\", \"sun\":\n    fmt.Println(\"выходной\")\ndefault:\n    fmt.Println(\"работа\")\n}\n\nf, err := os.Open(\"data.txt\")\nif err != nil {\n    fmt.Println(\"ошибка:\", err) // в функции, которая возвращает error, пишут return err\n    return\n}\ndefer f.Close()","tips":["range по строке идёт по рунам, индекс — в байтах","defer выполняются в обратном порядке (стек)","Аргументы defer вычисляются в момент объявления"],"q":[{"t":"out","q":"Что выведет код?","e":"Отложенные вызовы выполняются в обратном порядке.","c":"for i := 0; i < 3; i++ {\n    defer fmt.Print(i)\n}","ans":["210"]},{"t":"mc","q":"Сколько видов циклов в Go?","e":"for покрывает все сценарии.","o":["Один — for","Два — for и while","Три","Четыре"],"a":0},{"t":"fill","q":"Впишите ключевое слово отложенного вызова.","e":"Unlock выполнится при выходе из функции.","c":"mu.Lock()\n___ mu.Unlock()","ans":["defer"]},{"t":"out","q":"Что выведет код?","e":"Без fallthrough выполняется только совпавший case.","c":"x := 2\nswitch x {\ncase 1:\n    fmt.Print(\"A\")\ncase 2:\n    fmt.Print(\"B\")\ncase 3:\n    fmt.Print(\"C\")\n}","ans":["B"]}]},{"t":"Срезы и map","body":["Массив <code>[3]int</code> имеет фиксированную длину. Срез <code>[]int</code> — окно на массив: указатель, длина <code>len</code> и ёмкость <code>cap</code>. <code>append</code> добавляет элемент и при нехватке ёмкости создаёт новый массив.","Срезы одного массива делят память: изменение через один срез видно в другом. Независимую копию делают через <code>copy</code> или <code>slices.Clone</code>.","<code>map[K]V</code> — хэш-таблица. Чтение отсутствующего ключа вернёт нулевое значение, а форма <code>v, ok := m[k]</code> скажет, был ли ключ. Порядок перебора map случайный. Запись в nil-map вызывает панику."],"code":"nums := []int{1, 2, 3}\nnums = append(nums, 4)\npart := nums[1:3]            // [2 3]\npart[0] = 99\nfmt.Println(nums)            // [1 99 3 4]\n\nages := map[string]int{\"Ада\": 36}\nages[\"Алан\"] = 41\nif age, ok := ages[\"Боб\"]; !ok {\n    fmt.Println(\"нет\", age)  // нет 0\n}\ndelete(ages, \"Ада\")\n\nvar m map[string]int\n// m[\"x\"] = 1               // паника: nil map\nm = make(map[string]int)","tips":["Результат append всегда присваивайте обратно","Срез ссылается на общий массив — помните об этом при изменениях","Не полагайтесь на порядок перебора map"],"q":[{"t":"out","q":"Что выведет код?","e":"b и a делят один массив.","c":"a := []int{1, 2, 3, 4}\nb := a[:2]\nb[1] = 20\nfmt.Println(a[1])","ans":["20"]},{"t":"out","q":"Что выведет код?","e":"Отсутствующий ключ даёт нулевое значение.","c":"m := map[string]int{}\nm[\"a\"]++\nm[\"a\"]++\nfmt.Println(m[\"a\"], m[\"b\"])","ans":["2 0"]},{"t":"mc","q":"Что случится при записи в объявленный, но не созданный map (<code>var m map[string]int</code>)?","e":"Создавайте через make или литерал.","o":["Паника","Map создастся автоматически","Ошибка компиляции","Ничего не произойдёт"],"a":0},{"t":"fill","q":"Впишите функцию создания map.","e":"make создаёт срезы, map и каналы.","c":"counts := ___(map[string]int)","ans":["make"]}]},{"t":"Структуры, методы и интерфейсы","body":["<code>struct</code> объединяет поля. Методы объявляют с ресивером: <code>func (u *User) Rename(...)</code>. Ресивер-указатель нужен, чтобы метод менял исходную структуру, а не копию.","Наследования нет. Вместо него — встраивание (embedding): поля и методы встроенной структуры доступны напрямую.","Интерфейсы в Go реализуются неявно: тип удовлетворяет интерфейсу, если у него есть нужные методы. Маленькие интерфейсы (<code>io.Reader</code>, <code>fmt.Stringer</code>) — идиома языка. Определяйте интерфейс там, где он используется."],"code":"type User struct {\n    Name string\n    Age  int\n}\n\nfunc (u *User) Birthday()       { u.Age++ }\nfunc (u User) String() string  { return fmt.Sprintf(\"%s (%d)\", u.Name, u.Age) }\n\ntype Admin struct {\n    User                 // встраивание\n    Level int\n}\n\ntype Notifier interface {\n    Notify(to, msg string) error\n}\n\na := Admin{User: User{\"Ада\", 36}, Level: 1}\na.Birthday()             // метод встроенного User\nfmt.Println(a.Name, a)   // Ада Ада (37)","tips":["Если хоть один метод с указателем — делайте все ресиверы указателями","«Принимай интерфейсы, возвращай структуры»","Интерфейс с nil-указателем внутри не равен nil"],"q":[{"t":"mc","q":"Как тип реализует интерфейс в Go?","e":"Это структурная типизация.","o":["Через implements","Через наследование","Неявно, если у него есть все методы интерфейса","Через регистрацию в пакете"],"a":2},{"t":"out","q":"Что выведет код?","e":"Inc изменил копию, Add — оригинал.","c":"type C struct{ n int }\nfunc (c C) Inc()  { c.n++ }\nfunc (c *C) Add() { c.n++ }\n\nc := C{}\nc.Inc()\nc.Add()\nfmt.Println(c.n)","ans":["1"]},{"t":"fill","q":"Впишите метод, который делает тип fmt.Stringer.","e":"fmt.Println вызовет его автоматически.","c":"func (p Point) ___() string { return \"...\" }","ans":["String"]},{"t":"mc","q":"Что используют в Go вместо наследования?","e":"Композиция вместо наследования.","o":["Встраивание структур и интерфейсы","Абстрактные классы","Миксины","Прототипы"],"a":0}]},{"t":"Ошибки и паника","body":["Ошибки в Go — значения типа <code>error</code>. Их проверяют явно и возвращают наверх, добавляя контекст через <code>fmt.Errorf(\"...: %w\", err)</code>. Глагол <code>%w</code> оборачивает ошибку, сохраняя исходную.","<code>errors.Is</code> проверяет, есть ли в цепочке конкретная ошибка, <code>errors.As</code> достаёт ошибку нужного типа. Сравнение через <code>==</code> не видит обёрнутые ошибки.","<code>panic</code> — для действительно невозможных ситуаций, не для обычных ошибок. <code>recover</code> в defer перехватывает панику, например чтобы HTTP-сервер не упал целиком."],"code":"var ErrNotFound = errors.New(\"не найдено\")\n\nfunc FindUser(id int) (*User, error) {\n    u, ok := store[id]\n    if !ok {\n        return nil, ErrNotFound\n    }\n    return u, nil\n}\n\nfunc LoadProfile(id int) error {\n    if _, err := FindUser(id); err != nil {\n        return fmt.Errorf(\"профиль %d: %w\", id, err)\n    }\n    return nil\n}\n\nerr := LoadProfile(7)\nif errors.Is(err, ErrNotFound) {\n    fmt.Println(\"404:\", err)   // 404: профиль 7: не найдено\n}","tips":["Добавляйте контекст к ошибке, но не логируйте её на каждом уровне","%w — оборачивает, %v — только текст","Не используйте panic для ошибок ввода пользователя"],"q":[{"t":"mc","q":"Чем <code>%w</code> отличается от <code>%v</code> в fmt.Errorf?","e":"%v превращает ошибку в текст.","o":["%w сохраняет исходную ошибку для errors.Is и errors.As","%w выводит ошибку жирным","Ничем","%v быстрее и всегда лучше"],"a":0},{"t":"fill","q":"Впишите функцию проверки ошибки в цепочке.","e":"errors.Is разворачивает цепочку обёрток.","c":"if errors.___(err, ErrNotFound) { }","ans":["Is"]},{"t":"mc","q":"Когда уместна panic?","e":"Обычные ошибки возвращают как значения.","o":["При неверном вводе пользователя","При ошибке сети","При нарушении инварианта, которое означает баг в программе","Всегда вместо error"],"a":2},{"t":"out","q":"Что выведет код?","e":"Отложенная функция меняет именованный результат после return.","c":"func f() (r int) {\n    defer func() { r *= 2 }()\n    return 5\n}\nfmt.Println(f())","ans":["10"]}],"run":false},{"t":"Горутины и каналы","body":["Горутина — лёгкий поток, запускается словом <code>go</code>. Тысячи горутин — норма. Программа не ждёт горутины: при выходе из main они обрываются.","Каналы передают значения между горутинами: <code>ch &lt;- v</code> отправляет, <code>v := &lt;-ch</code> получает. Небуферизованный канал синхронизирует отправителя и получателя. <code>close(ch)</code> сообщает, что значений больше не будет, и <code>range ch</code> завершится.","<code>sync.WaitGroup</code> ждёт группу горутин. <code>select</code> ждёт сразу несколько каналов. Главный принцип: «не общайтесь через общую память — делитесь памятью через общение»."],"code":"func worker(id int, jobs <-chan int, results chan<- int, wg *sync.WaitGroup) {\n    defer wg.Done()\n    for j := range jobs {\n        results <- j * j\n    }\n}\n\njobs := make(chan int, 10)\nresults := make(chan int, 10)\nvar wg sync.WaitGroup\nfor w := 1; w <= 3; w++ {\n    wg.Add(1)\n    go worker(w, jobs, results, &wg)\n}\nfor i := 1; i <= 5; i++ { jobs <- i }\nclose(jobs)\nwg.Wait()\nclose(results)\nsum := 0\nfor r := range results { sum += r }\nfmt.Println(sum)   // 55","tips":["Закрывает канал только отправитель","Чтение из закрытого канала вернёт нулевое значение сразу","Запускайте тесты с -race: детектор гонок находит ошибки"],"q":[{"t":"mc","q":"Что произойдёт с горутинами при завершении main?","e":"Для ожидания нужен WaitGroup или каналы.","o":["Они будут прерваны","main дождётся их автоматически","Они продолжат работу в фоне","Программа упадёт"],"a":0},{"t":"mc","q":"Что вернёт чтение из закрытого пустого канала?","e":"Форма v, ok := &lt;-ch покажет ok = false.","o":["Панику","Нулевое значение сразу","Заблокируется навсегда","Ошибку компиляции"],"a":1},{"t":"fill","q":"Впишите тип для ожидания группы горутин.","e":"Add, Done, Wait.","c":"var wg sync.___","ans":["WaitGroup"]},{"t":"mc","q":"Что делает <code>select</code>?","e":"С default становится неблокирующим.","o":["Ждёт первую готовую операцию из нескольких каналов","Выбирает случайную горутину","Сортирует значения канала","Закрывает канал"],"a":0}]},{"t":"HTTP, context и тесты","body":["Пакет <code>net/http</code> позволяет написать сервер без фреймворков. Начиная с Go 1.22 маршрутизатор поддерживает методы и параметры пути: <code>mux.HandleFunc(\"GET /users/{id}\", h)</code>.","<code>context.Context</code> передаёт дедлайны, отмену и значения запроса по цепочке вызовов. Его передают первым аргументом во все функции, которые ходят в сеть или базу.","Тесты лежат в файлах <code>_test.go</code> и запускаются <code>go test ./...</code>. Табличные тесты — идиома Go: срез случаев и один цикл. <code>httptest</code> проверяет хендлеры без настоящего сервера."],"code":"func getUser(w http.ResponseWriter, r *http.Request) {\n    id := r.PathValue(\"id\")\n    ctx, cancel := context.WithTimeout(r.Context(), 2*time.Second)\n    defer cancel()\n    u, err := repo.Find(ctx, id)\n    if err != nil {\n        http.Error(w, \"not found\", http.StatusNotFound)\n        return\n    }\n    w.Header().Set(\"Content-Type\", \"application/json\")\n    json.NewEncoder(w).Encode(u)\n}\n\n// add_test.go\nfunc TestAdd(t *testing.T) {\n    cases := []struct{ a, b, want int }{\n        {1, 2, 3}, {0, 0, 0}, {-1, 1, 0},\n    }\n    for _, c := range cases {\n        if got := Add(c.a, c.b); got != c.want {\n            t.Errorf(\"Add(%d,%d)=%d, want %d\", c.a, c.b, got, c.want)\n        }\n    }\n}","tips":["context всегда первым параметром, и не храните его в структурах","Не забывайте defer cancel()","После http.Error делайте return"],"q":[{"t":"mc","q":"Зачем передавать context.Context в запрос к базе?","e":"Контекст распространяет отмену.","o":["Чтобы отменить операцию по таймауту или при отключении клиента","Чтобы ускорить запрос","Для логирования SQL","Так требует компилятор"],"a":0},{"t":"fill","q":"Впишите суффикс файла с тестами.","e":"go test находит такие файлы.","c":"// user___.go","ans":["_test"]},{"t":"mc","q":"Как называется идиома тестов со срезом входных данных и ожидаемых результатов?","e":"Один цикл проверяет много случаев.","o":["Табличные тесты","Мок-тесты","Фаззинг","Бенчмарки"],"a":0},{"t":"fill","q":"Впишите, как получить параметр {id} из пути в Go 1.22+.","e":"Метод появился вместе с новым маршрутизатором.","c":"id := r.___(\"id\")","ans":["PathValue"]}],"run":false},{"t":"Модули, generics и инструменты","body":["Проект — это модуль с файлом <code>go.mod</code>. Зависимости добавляет <code>go get</code>, а <code>go mod tidy</code> убирает лишние. Стандартная структура: <code>cmd/</code> для точек входа, <code>internal/</code> для закрытого кода.","Generics (с Go 1.18) пишут функции для разных типов: <code>func Map[T, R any](s []T, f func(T) R) []R</code>. Ограничения задают интерфейсами, например <code>cmp.Ordered</code>.","Инструменты встроены: <code>go fmt</code>, <code>go vet</code>, <code>go test -race</code>, <code>go build</code>. Статические бинарники легко упаковать в маленький Docker-образ."],"code":"func Map[T, R any](s []T, f func(T) R) []R {\n    out := make([]R, 0, len(s))\n    for _, v := range s {\n        out = append(out, f(v))\n    }\n    return out\n}\n\nfunc Max[T cmp.Ordered](a, b T) T {\n    if a > b { return a }\n    return b\n}\n\nlengths := Map([]string{\"go\", \"rust\"}, func(s string) int { return len(s) })\nfmt.Println(lengths, Max(3, 7), Max(\"a\", \"b\"))   // [2 4] 7 b\n\n// go mod init github.com/you/shortener\n// go get github.com/jackc/pgx/v5\n// go test -race ./...","tips":["Пакеты из internal/ нельзя импортировать из других модулей","go vet находит подозрительный код, который компилируется","Сборка CGO_ENABLED=0 даёт полностью статический бинарник"],"q":[{"t":"mc","q":"Какой файл описывает модуль и его зависимости?","e":"go.sum хранит контрольные суммы.","o":["package.json","go.mod","Makefile","main.go"],"a":1},{"t":"fill","q":"Впишите ограничение «любой тип».","e":"any — псевдоним interface{}.","c":"func First[T ___](s []T) T { return s[0] }","ans":["any"]},{"t":"mc","q":"Что делает <code>go mod tidy</code>?","e":"Держит go.mod в порядке.","o":["Добавляет недостающие и удаляет неиспользуемые зависимости","Форматирует код","Запускает тесты","Собирает бинарник"],"a":0},{"t":"mc","q":"Для чего папка internal/?","e":"Это ограничение компилятора.","o":["Код внутри нельзя импортировать за пределами модуля","Для тестов","Для временных файлов","Для документации"],"a":0}],"run":false}],"exam":[{"t":"out","q":"Что выведет код?","e":"Ёмкости хватило, массив не перевыделялся.","c":"s := make([]int, 3, 10)\ns = append(s, 1)\nfmt.Println(len(s), cap(s))","ans":["4 10"]},{"t":"out","q":"Что выведет код?","e":"Ёмкость a была 3, append создал новый массив, и b больше не делит память с a.","c":"a := []int{1, 2, 3}\nb := a\nb = append(b, 4)\nb[0] = 100\nfmt.Println(a[0])","ans":["1"]},{"t":"out","q":"Что выведет код?","e":"Нулевое значение указателя — nil.","c":"var p *int\nfmt.Println(p == nil)","ans":["true"]},{"t":"out","q":"Что выведет код?","e":"Интерфейс хранит тип *E, поэтому он не nil.","c":"type E struct{}\nfunc (E) Error() string { return \"e\" }\nfunc get() error { var e *E = nil; return e }\nfmt.Println(get() == nil)","ans":["false"]},{"t":"out","q":"Что выведет код?","e":":= внутри функции создал новую переменную.","c":"x := 1\nfunc() { x := 2; _ = x }()\nfmt.Println(x)","ans":["1"]},{"t":"mc","q":"Что произойдёт при одновременной записи в map из двух горутин без защиты?","e":"Используйте мьютекс или sync.Map.","o":["Возможна паника concurrent map writes","Ничего, map потокобезопасна","Ошибка компиляции","Значения склеятся"],"a":0},{"t":"out","q":"Что выведет код?","e":"range дочитывает буфер и выходит после закрытия.","c":"ch := make(chan int, 2)\nch <- 1\nch <- 2\nclose(ch)\nfor v := range ch { fmt.Print(v) }","ans":["12"]},{"t":"out","q":"Что выведет код?","e":"é занимает 2 байта в UTF-8.","c":"s := \"héllo\"\nfmt.Println(len(s), len([]rune(s)))","ans":["6 5"]},{"t":"mc","q":"Что случится при отправке в небуферизованный канал, если никто не читает?","e":"Если заблокируются все горутины — fatal error: deadlock.","o":["Горутина заблокируется","Значение потеряется","Канал закроется","Паника сразу"],"a":0},{"t":"fill","q":"Впишите тип мьютекса, разрешающего много читателей.","e":"RLock для чтения, Lock для записи.","c":"var mu sync.___","ans":["RWMutex"]},{"t":"mc","q":"Где лучше объявлять интерфейс в Go?","e":"Потребитель определяет нужный ему контракт.","o":["В пакете, который его использует","В пакете, который его реализует","В отдельном пакете interfaces","Только в main"],"a":0},{"t":"out","q":"Что выведет код?","e":"С Go 1.22 у каждой итерации своя переменная i, defer выполняются в обратном порядке.","c":"for i := range 3 {\n    defer func() { fmt.Print(i) }()\n}","ans":["210"]}]},{"id":"rs","name":"Rust","land":"Ржавые горы","color":"#c0643a","about":"Скорость C++ и безопасность памяти без сборщика мусора. Системное ПО, блокчейн, WebAssembly, CLI-утилиты.","project":{"title":"CLI-утилита поиска по файлам","desc":"Аналог grep: ищет строку или регулярное выражение в файлах директории.","req":["Аргументы через clap: шаблон, путь, флаги -i (без учёта регистра) и -n (номера строк)","Рекурсивный обход директорий через walkdir, параллельный поиск через rayon","Ошибки через Result и крейт anyhow, понятные сообщения пользователю","Подсветка совпадений в терминале","Юнит- и интеграционные тесты, cargo clippy без предупреждений","Публикация бинарников в GitHub Releases, README с примерами"]},"lessons":[{"t":"Переменные, типы и функции","body":["Переменные по умолчанию неизменяемы: <code>let x = 5</code>. Чтобы менять, нужен <code>let mut</code>. Повторный <code>let</code> с тем же именем создаёт новую переменную (shadowing) — можно даже сменить тип.","Целые типы указывают размер: <code>i32</code>, <code>u64</code>, <code>usize</code> для индексов. В отладочной сборке переполнение вызывает панику. Строковые литералы имеют тип <code>&amp;str</code>, а изменяемая строка — <code>String</code>.","Почти всё в Rust — выражения. Последнее выражение функции без точки с запятой — её результат. <code>if</code> тоже возвращает значение."],"code":"fn area(w: u32, h: u32) -> u32 {\n    w * h                       // без ; — это возвращаемое значение\n}\n\nfn main() {\n    let name = \"Ада\";\n    let mut score = 10;\n    score += 5;\n\n    let input = \"42\";\n    let input: i32 = input.parse().unwrap();   // shadowing со сменой типа\n\n    let status = if score > 10 { \"pro\" } else { \"new\" };\n    println!(\"{name}: {score}, {status}, {}\", area(2, input as u32));\n}","tips":["Неизменяемость по умолчанию — осознанный выбор языка","Точка с запятой превращает выражение в инструкцию с результатом ()","Макросы заканчиваются на ! — println!, vec!, format!"],"q":[{"t":"mc","q":"Что нужно, чтобы переменную можно было изменять?","e":"Без mut присваивание — ошибка компиляции.","o":["var","let mut","const","static"],"a":1},{"t":"out","q":"Что выведет код?","e":"Shadowing: второй x = 3 * 2 + 1.","c":"fn f(x: i32) -> i32 { x * 2 }\nfn main() {\n    let x = 3;\n    let x = f(x) + 1;\n    println!(\"{x}\");\n}","ans":["7"]},{"t":"fill","q":"Впишите тип беззнакового целого для индексов и длин.","e":"Его размер совпадает с разрядностью платформы.","c":"let len: ___ = v.len();","ans":["usize"]},{"t":"mc","q":"Что вернёт функция, если последняя строка <code>x + 1;</code> с точкой с запятой и тип возврата i32?","e":"Уберите точку с запятой.","o":["x + 1","Ошибку компиляции: вернётся (), а ожидается i32","0","Панику"],"a":1}]},{"t":"Управление потоком и match","body":["<code>if</code> — выражение, условие должно быть типа bool (никакого приведения чисел). Циклы: <code>loop</code> (бесконечный, может вернуть значение через <code>break значение</code>), <code>while</code> и <code>for x in коллекция</code>.","Диапазоны: <code>0..5</code> без верхней границы, <code>0..=5</code> включительно. Метки <code>'outer:</code> позволяют выйти из вложенного цикла.","<code>match</code> сравнивает с образцами: значения, диапазоны, кортежи, с условиями-охранниками <code>if</code>. Он обязан покрыть все варианты. <code>if let</code> — короткая форма для одного образца."],"code":"fn classify(n: i32) -> &'static str {\n    match n {\n        i32::MIN..=-1 => \"отрицательное\",\n        0 => \"ноль\",\n        x if x % 2 == 0 => \"чётное\",\n        _ => \"нечётное\",\n    }\n}\n\nfn main() {\n    let mut count = 0;\n    let result = loop {\n        count += 1;\n        if count == 3 { break count * 10; }\n    };\n    for i in (1..=3).rev() { print!(\"{i} \"); }     // 3 2 1\n    println!(\"{result} {}\", classify(7));          // 30 нечётное\n\n    let point = (0, 5);\n    match point {\n        (0, y) => println!(\"на оси Y: {y}\"),\n        (x, 0) => println!(\"на оси X: {x}\"),\n        _ => println!(\"где-то ещё\"),\n    }\n}","tips":["<code>if 1 {}</code> не скомпилируется — нужен bool","loop может вернуть значение через break","<code>_</code> в match ловит всё остальное"],"q":[{"t":"out","q":"Что выведет код?","e":"1 + 2 + 3 + 4.","c":"let mut s = 0;\nfor i in 1..=4 { s += i; }\nprintln!(\"{s}\");","ans":["10"]},{"t":"out","q":"Что выведет код?","e":"7 совпал с образцом 6 | 7.","c":"let n = 7;\nlet t = match n { 1..=5 => \"a\", 6 | 7 => \"b\", _ => \"c\" };\nprintln!(\"{t}\");","ans":["b"]},{"t":"fill","q":"Впишите оператор включительного диапазона.","e":"1..10 не включил бы 10.","c":"for i in 1___10 { }","ans":["..="]},{"t":"mc","q":"Что вернёт <code>loop { break 5; }</code>?","e":"break может передать значение из loop.","o":["5","()","Ошибку компиляции","Бесконечный цикл"],"a":0}]},{"t":"Владение и заимствование","body":["Владение — главная идея Rust. У каждого значения один владелец. Когда владелец выходит из области видимости, значение уничтожается. Присваивание <code>String</code> другой переменной перемещает владение — старая переменная становится недоступной.","Чтобы использовать значение без передачи владения, его заимствуют по ссылке: <code>&amp;T</code> — читать, <code>&amp;mut T</code> — менять. Правило: либо сколько угодно <code>&amp;T</code>, либо ровно одна <code>&amp;mut T</code> одновременно.","Эти правила проверяет borrow checker при компиляции. Поэтому в Rust нет висячих указателей и гонок данных в безопасном коде."],"code":"fn len(s: &String) -> usize { s.len() }        // заимствование\nfn shout(s: &mut String) { s.push('!'); }      // изменяемое заимствование\n\nfn main() {\n    let a = String::from(\"hi\");\n    let b = a;                 // владение перешло к b\n    // println!(\"{a}\");        // ошибка: a перемещена\n\n    let mut c = b.clone();     // явная глубокая копия\n    shout(&mut c);\n    println!(\"{} {}\", len(&b), c);   // 2 hi!\n\n    let n = 5;\n    let m = n;                 // i32 реализует Copy — n доступна\n    println!(\"{n} {m}\");\n}","tips":["Простые типы (числа, bool, char) копируются, String и Vec — перемещаются","clone() делает дорогую копию — используйте осознанно","Нельзя одновременно иметь &amp;mut и &amp; на одно значение"],"q":[{"t":"mc","q":"Что происходит при <code>let b = a;</code>, если a — String?","e":"Это move-семантика.","o":["Копируются данные строки","Владение перемещается, a больше нельзя использовать","b становится ссылкой на a","Ошибка компиляции"],"a":1},{"t":"mc","q":"Сколько изменяемых ссылок на значение может быть одновременно?","e":"Это предотвращает гонки данных.","o":["Одна","Две","Сколько угодно","Ни одной"],"a":0},{"t":"fill","q":"Впишите тип параметра для изменяемого заимствования строки.","e":"&amp;mut даёт право изменять.","c":"fn append(s: ___String) { s.push_str(\"!\"); }","ans":["&mut","&mut"]},{"t":"mc","q":"Почему <code>let y = x;</code> не делает x недоступным, если x: i32?","e":"Copy-типы дёшево копируются побитово.","o":["i32 реализует трейт Copy","i32 хранится в куче","Компилятор игнорирует числа","Это ошибка компиляции"],"a":0}]},{"t":"Структуры и перечисления","body":["<code>struct</code> объединяет данные, методы пишут в блоке <code>impl</code>. <code>&amp;self</code> — метод читает объект, <code>&amp;mut self</code> — меняет, <code>self</code> — забирает владение. Функции без self (например <code>new</code>) вызывают через <code>::</code>.","<code>enum</code> в Rust — алгебраический тип: каждый вариант может хранить свои данные. <code>match</code> разбирает варианты и обязан покрыть все — компилятор проверит.","<code>Option&lt;T&gt;</code> заменяет null: <code>Some(value)</code> или <code>None</code>. Работать с отсутствующим значением без проверки невозможно."],"code":"struct Account { owner: String, balance: i64 }\n\nimpl Account {\n    fn new(owner: &str) -> Self { Self { owner: owner.into(), balance: 0 } }\n    fn deposit(&mut self, sum: i64) { self.balance += sum; }\n}\n\nenum Command {\n    Quit,\n    Move { x: i32, y: i32 },\n    Say(String),\n}\n\nfn run(c: &Command) -> String {\n    match c {\n        Command::Quit => \"выход\".into(),\n        Command::Move { x, y } => format!(\"в {x},{y}\"),\n        Command::Say(text) => text.clone(),\n    }\n}\n\nlet nums = vec![1, 2];\nlet first: Option<&i32> = nums.first();\nif let Some(v) = first { println!(\"{v}\"); }","tips":["match должен быть исчерпывающим, <code>_</code> ловит остальное","Option вместо null — ошибки «забыл проверить» ловит компилятор","#[derive(Debug, Clone, PartialEq)] добавляет стандартные трейты"],"q":[{"t":"mc","q":"Что заменяет null в Rust?","e":"Some(v) или None.","o":["Option&lt;T&gt;","nil","Result&lt;T&gt;","void"],"a":0},{"t":"mc","q":"Что делает компилятор, если match не покрывает все варианты enum?","e":"match исчерпывающий.","o":["Ничего","Выдаёт ошибку компиляции","Паникует в рантайме","Добавляет ветку по умолчанию"],"a":1},{"t":"fill","q":"Впишите параметр метода, который может изменять поля.","e":"&amp;self только читает.","c":"fn reset(___) { self.balance = 0; }","ans":["&mut self"]},{"t":"out","q":"Что выведет код?","e":"7 + 1: map для None вернёт None.","c":"let v: Option<i32> = None;\nprintln!(\"{}\", v.unwrap_or(7) + v.map(|x| x * 2).unwrap_or(1));","ans":["8"]}]},{"t":"Ошибки: Result и оператор ?","body":["Восстановимые ошибки возвращают через <code>Result&lt;T, E&gt;</code>: <code>Ok(value)</code> или <code>Err(error)</code>. Исключений в Rust нет.","Оператор <code>?</code> разворачивает Ok или сразу возвращает Err из функции. Он делает обработку ошибок короткой и явной.","<code>unwrap()</code> и <code>expect()</code> паникуют при ошибке — допустимы в прототипах и тестах, но не в продакшене. В приложениях удобен крейт <code>anyhow</code>, в библиотеках — свои типы ошибок через <code>thiserror</code>."],"code":"use std::fs;\nuse std::num::ParseIntError;\n\nfn parse_sum(a: &str, b: &str) -> Result<i32, ParseIntError> {\n    let x: i32 = a.trim().parse()?;\n    let y: i32 = b.trim().parse()?;\n    Ok(x + y)\n}\n\nfn read_config(path: &str) -> anyhow::Result<String> {\n    let text = fs::read_to_string(path)\n        .map_err(|e| anyhow::anyhow!(\"не удалось прочитать {path}: {e}\"))?;\n    Ok(text)\n}\n\nmatch parse_sum(\"2\", \"x\") {\n    Ok(s) => println!(\"{s}\"),\n    Err(e) => eprintln!(\"ошибка: {e}\"),\n}","tips":["<code>?</code> работает только в функциях, возвращающих Result или Option","panic! — для багов, Result — для ожидаемых ошибок","eprintln! пишет в поток ошибок"],"q":[{"t":"mc","q":"Что делает оператор <code>?</code> при Err?","e":"При Ok он отдаёт значение.","o":["Паникует","Возвращает ошибку из текущей функции","Игнорирует ошибку","Повторяет вызов"],"a":1},{"t":"fill","q":"Впишите вариант Result для успешного значения.","e":"Err — вариант ошибки.","c":"return ___(42);","ans":["Ok"]},{"t":"mc","q":"Когда допустим unwrap()?","e":"В продакшене обрабатывайте ошибку явно.","o":["Всегда","В прототипах и тестах, когда ошибка невозможна или неважна","Только с Option","Никогда, он запрещён компилятором"],"a":1},{"t":"out","q":"Что выведет код?","e":"\"z\" не парсится, функция вернула Err.","c":"fn f(s: &str) -> Result<i32, std::num::ParseIntError> { Ok(s.parse::<i32>()? * 10) }\nprintln!(\"{:?} {}\", f(\"4\"), f(\"z\").is_err());","ans":["Ok(40) true"]}],"run":false},{"t":"Коллекции и итераторы","body":["<code>Vec&lt;T&gt;</code> — растущий массив, <code>HashMap&lt;K, V&gt;</code> — словарь, <code>HashSet&lt;T&gt;</code> — множество. Срез <code>&amp;[T]</code> — заимствованный вид на часть массива или вектора.","Итераторы ленивые: <code>iter()</code> даёт ссылки, <code>into_iter()</code> забирает элементы, <code>iter_mut()</code> даёт изменяемые ссылки. Цепочки <code>map</code>, <code>filter</code>, <code>sum</code>, <code>collect</code> компилируются в такой же быстрый код, как ручной цикл.","<code>entry</code> API у HashMap удобно для подсчётов: <code>*map.entry(k).or_insert(0) += 1</code>."],"code":"use std::collections::HashMap;\n\nlet nums = vec![1, 2, 3, 4, 5];\nlet evens: Vec<i32> = nums.iter().filter(|&&n| n % 2 == 0).copied().collect();\nlet total: i32 = nums.iter().map(|n| n * n).sum();       // 55\n\nlet text = \"a b a c a\";\nlet mut counts: HashMap<&str, usize> = HashMap::new();\nfor w in text.split_whitespace() {\n    *counts.entry(w).or_insert(0) += 1;\n}\nprintln!(\"{:?} {} {}\", evens, total, counts[\"a\"]);  // [2, 4] 55 3\n\nlet first_two = &nums[..2];                          // срез [1, 2]","tips":["Без collect или sum итератор ничего не делает","Индекс за пределами вектора — паника, get(i) вернёт Option","collect нужен тип: Vec&lt;_&gt; или аннотация переменной"],"q":[{"t":"out","q":"Что выведет код?","e":"3 + 2.","c":"let v = vec![3, 1, 2];\nlet s: i32 = v.iter().filter(|&&x| x > 1).sum();\nprintln!(\"{s}\");","ans":["5"]},{"t":"mc","q":"Что вернёт <code>v.get(10)</code> для вектора из 3 элементов?","e":"А v[10] вызовет панику.","o":["Панику","None","0","Ошибку компиляции"],"a":1},{"t":"fill","q":"Впишите метод, который собирает итератор в коллекцию.","e":"Тип коллекции берётся из аннотации.","c":"let names: Vec<String> = users.iter().map(|u| u.name.clone()).___();","ans":["collect"]},{"t":"mc","q":"Чем <code>iter()</code> отличается от <code>into_iter()</code> для Vec?","e":"После into_iter вектор использовать нельзя.","o":["iter даёт ссылки, into_iter забирает элементы и владение вектором","Ничем","into_iter быстрее всегда","iter изменяет элементы"],"a":0}]},{"t":"Трейты и generics","body":["Трейт описывает поведение, как интерфейс: <code>trait Summary { fn summary(&amp;self) -&gt; String; }</code>. Тип реализует трейт через <code>impl Trait for Type</code>. Можно задать реализацию по умолчанию.","Generics с ограничениями трейтами: <code>fn print_all&lt;T: Display&gt;(items: &amp;[T])</code>. Компилятор создаёт отдельную быструю версию для каждого типа (мономорфизация).","<code>dyn Trait</code> — динамическая диспетчеризация, когда нужен список объектов разных типов: <code>Vec&lt;Box&lt;dyn Shape&gt;&gt;</code>. Стандартные трейты: <code>Debug</code>, <code>Clone</code>, <code>PartialEq</code>, <code>Display</code>, <code>From</code>, <code>Iterator</code>."],"code":"use std::fmt;\n\ntrait Shape { fn area(&self) -> f64; }\n\nstruct Circle(f64);\nstruct Square(f64);\n\nimpl Shape for Circle { fn area(&self) -> f64 { 3.14 * self.0 * self.0 } }\nimpl Shape for Square { fn area(&self) -> f64 { self.0 * self.0 } }\n\nimpl fmt::Display for Square {\n    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {\n        write!(f, \"Квадрат {}\", self.0)\n    }\n}\n\nfn largest<T: PartialOrd + Copy>(items: &[T]) -> T {\n    let mut max = items[0];\n    for &i in items { if i > max { max = i; } }\n    max\n}\n\nlet shapes: Vec<Box<dyn Shape>> = vec![Box::new(Circle(1.0)), Box::new(Square(2.0))];\nlet total: f64 = shapes.iter().map(|s| s.area()).sum();\nprintln!(\"{} {}\", largest(&[3, 9, 2]), Square(2.0));   // 9 Квадрат 2","tips":["Generics — статическая диспетчеризация, dyn — динамическая","Реализуйте Display для вывода пользователю, Debug — для отладки","impl Trait в аргументе — короткая запись generic"],"q":[{"t":"mc","q":"Что такое трейт?","e":"Аналог интерфейса.","o":["Описание общего поведения, которое могут реализовать типы","Класс с наследованием","Макрос","Модуль"],"a":0},{"t":"fill","q":"Впишите ключевое слово для коллекции объектов разных типов с одним трейтом.","e":"Вызов метода идёт через таблицу виртуальных функций.","c":"let items: Vec<Box<___ Shape>> = vec![];","ans":["dyn"]},{"t":"mc","q":"Какой трейт нужен для <code>println!(\"{}\", x)</code>?","e":"Для {:?} нужен Debug.","o":["Debug","Display","Clone","Copy"],"a":1},{"t":"mc","q":"Что такое мономорфизация?","e":"Поэтому generics в Rust не замедляют код.","o":["Генерация отдельной версии generic-функции для каждого типа","Удаление generic-типов в рантайме","Наследование трейтов","Сборка мусора"],"a":0}]},{"t":"Время жизни, конкурентность и Cargo","body":["Время жизни (lifetime) показывает компилятору, как долго действительна ссылка. Чаще всего оно выводится само; явно пишут, когда функция возвращает ссылку из одного из аргументов: <code>fn longest&lt;'a&gt;(a: &amp;'a str, b: &amp;'a str) -&gt; &amp;'a str</code>.","Конкурентность безопасна благодаря трейтам <code>Send</code> и <code>Sync</code>. Общие данные между потоками держат в <code>Arc&lt;Mutex&lt;T&gt;&gt;</code>: Arc — счётчик ссылок для потоков, Mutex — блокировка. Асинхронный код пишут через <code>async</code>/<code>.await</code> и рантайм <code>tokio</code>.","Cargo — менеджер пакетов и система сборки: <code>cargo new</code>, <code>cargo build --release</code>, <code>cargo test</code>, <code>cargo clippy</code>, <code>cargo fmt</code>. Зависимости (крейты) указывают в Cargo.toml."],"code":"use std::sync::{Arc, Mutex};\nuse std::thread;\n\nfn longest<'a>(a: &'a str, b: &'a str) -> &'a str {\n    if a.len() >= b.len() { a } else { b }\n}\n\nfn main() {\n    let counter = Arc::new(Mutex::new(0));\n    let handles: Vec<_> = (0..4).map(|_| {\n        let c = Arc::clone(&counter);\n        thread::spawn(move || { *c.lock().unwrap() += 1; })\n    }).collect();\n    for h in handles { h.join().unwrap(); }\n    println!(\"{} {}\", *counter.lock().unwrap(), longest(\"rust\", \"go\"));  // 4 rust\n}\n\n// Cargo.toml\n// [dependencies]\n// clap = { version = \"4\", features = [\"derive\"] }\n// anyhow = \"1\"","tips":["Rc — для одного потока, Arc — для многих","move в замыкании переносит владение в поток","cargo clippy подсказывает идиоматичный код"],"q":[{"t":"mc","q":"Как разделить изменяемые данные между потоками?","e":"Rc не потокобезопасен, компилятор не даст передать его в поток.","o":["Rc&lt;RefCell&lt;T&gt;&gt;","Arc&lt;Mutex&lt;T&gt;&gt;","&amp;mut T","Box&lt;T&gt;"],"a":1},{"t":"fill","q":"Впишите команду сборки оптимизированного бинарника.","e":"Отладочная сборка медленнее.","c":"// cargo build ___","ans":["--release"]},{"t":"mc","q":"Зачем <code>'a</code> в <code>fn longest&lt;'a&gt;(a: &amp;'a str, b: &amp;'a str) -&gt; &amp;'a str</code>?","e":"Компилятор проверит, что ссылка не переживёт данные.","o":["Показывает, что результат живёт не дольше обоих аргументов","Делает строки статическими","Ускоряет функцию","Копирует строки"],"a":0},{"t":"mc","q":"Что делает move в <code>thread::spawn(move || ...)</code>?","e":"Поток может пережить текущую функцию.","o":["Переносит владение захваченными переменными в замыкание","Перемещае

добавленным позже. <code>event.preventDefault()</code> отменяет действие по умолчанию, например отправку формы."],"code":"const list = document.querySelector(\"#todos\");\nconst form = document.querySelector(\"#add\");\n\nform.addEventListener(\"submit\", (e) => {\n  e.preventDefault();\n  const li = document.createElement(\"li\");\n  li.textContent = form.title.value;     // безопасно\n  list.append(li);\n  form.reset();\n});\n\nlist.addEventListener(\"click\", (e) => {\n  const item = e.target.closest(\"li\");\n  if (item) item.classList.toggle(\"done\");\n});","tips":["innerHTML с данными пользователя — дыра XSS","Скрипт с type=\"module\" выполняется после разбора HTML","Делегирование экономит обработчики и работает для новых элементов"],"q":[{"t":"mc","q":"Почему нельзя вставлять ввод пользователя через innerHTML?","e":"textContent вставляет текст как есть.","o":["Это медленно","Можно внедрить вредоносный HTML и скрипты (XSS)","innerHTML не работает с формами","Текст потеряет пробелы"],"a":1},{"t":"mc","q":"Что делает <code>event.preventDefault()</code> в обработчике submit?","e":"Всплытие останавливает stopPropagation.","o":["Отменяет отправку формы и перезагрузку страницы","Останавливает всплытие события","Удаляет форму","Очищает поля"],"a":0},{"t":"fill","q":"Впишите метод, который ищет ближайшего предка по селектору.","e":"closest проверяет сам элемент и его предков.","c":"const card = event.target.___(\".card\");","ans":["closest"]},{"t":"mc","q":"Как называется приём, когда один обработчик на родителе обслуживает клики по детям?","e":"Делегирование опирается на всплытие событий.","o":["Всплытие","Делегирование событий","Захват","Мемоизация"],"a":1}],"run":false}],"exam":[{"t":"out","q":"Что выведет код?","e":"Пустой массив становится пустой строкой.","c":"console.log([] + [], [] + {});","ans":["[object Object]"," [object Object]"]},{"t":"out","q":"Что выведет код?","e":"let имеет блочную область видимости.","c":"let x = 1;\n{\n  let x = 2;\n}\nconsole.log(x);","ans":["1"]},{"t":"out","q":"Что выведет код?","e":"Массив — объект, отличить его помогает Array.isArray.","c":"console.log(typeof [], Array.isArray([]));","ans":["object true"]},{"t":"out","q":"Что выведет код?","e":"Обе переменные ссылаются на один объект.","c":"const obj = { a: 1 };\nconst copy = obj;\ncopy.a = 5;\nconsole.log(obj.a);","ans":["5"]},{"t":"out","q":"Что выведет код?","e":"then выполнится после синхронного кода.","c":"async function f() { return 1; }\nf().then(v => console.log(v + 1));\nconsole.log(0);","ans":["0 2"]},{"t":"out","q":"Что выведет код?","e":"Уменьшение length обрезает массив.","c":"const arr = [1, 2, 3];\narr.length = 1;\nconsole.log(arr);","ans":["[1]"]},{"t":"out","q":"Что выведет код?","e":"map передаёт индекс вторым аргументом, а parseInt понимает его как основание системы счисления.","c":"console.log([1, 2, 3].map(parseInt));","ans":["[1, NaN, NaN]"]},{"t":"out","q":"Что выведет код?","e":"call явно задаёт this.","c":"const user = { name: \"Ада\", greet() { return this.name; } };\nconst fn = user.greet;\nconsole.log(fn?.call(user));","ans":["Ада"]},{"t":"mc","q":"Что из этого не меняет исходный массив?","e":"slice возвращает новую часть массива.","o":["sort","splice","slice","reverse"],"a":2},{"t":"out","q":"Что выведет код?","e":"Нельзя смешивать ?? и || без скобок.","c":"console.log(null ?? 0 || 5);","ans":["SyntaxError","Ошибка"]},{"t":"out","q":"Что выведет код?","e":"Функция-исполнитель промиса выполняется сразу и синхронно.","c":"const p = new Promise(r => { console.log(\"A\"); r(); });\np.then(() => console.log(\"B\"));\nconsole.log(\"C\");","ans":["A C B"]},{"t":"fill","q":"Впишите метод для глубокой копии объекта в современном JS.","e":"Spread и Object.assign делают только поверхностную копию.","c":"const deep = ___(original);","ans":["structuredClone"]},{"t":"out","q":"Что выведет код?","e":"Значение по умолчанию работает только для undefined.","c":"const { a = 1, b = 2 } = { a: undefined, b: null };\nconsole.log(a, b);","ans":["1 null"]},{"t":"mc","q":"Какой статус-код означает «не авторизован»?","e":"403 — доступ запрещён, даже если авторизован.","o":["403","401","404","500"],"a":1}]},{"id":"ts","name":"TypeScript","land":"Крепость TS","color":"#3f7fbf","about":"JavaScript со статическими типами. Стандарт для больших фронтенд- и Node.js-проектов.","project":{"title":"REST API на Node.js и TypeScript","desc":"Сервис заметок с авторизацией на Express или Fastify, полностью на TypeScript.","req":["Строгий режим \"strict\": true, ни одного any в коде","Эндпоинты CRUD для заметок, валидация входных данных через zod","Регистрация и вход с хэшированием пароля (bcrypt) и JWT","Хранение в SQLite или PostgreSQL через Prisma","Тесты на vitest для сервисного слоя","README с примерами запросов и docker-compose для запуска"]},"lessons":[{"t":"Зачем TypeScript и базовые типы","body":["TypeScript — надстройка над JavaScript: компилятор <code>tsc</code> проверяет типы и выдаёт обычный JS. Ошибки вроде опечатки в имени поля ловятся до запуска программы.","Тип указывают после двоеточия: <code>let age: number</code>. Часто тип выводится сам: <code>let name = \"Ада\"</code> уже <code>string</code>. Базовые типы: <code>string</code>, <code>number</code>, <code>boolean</code>, массивы <code>number[]</code>, кортежи <code>[string, number]</code>.","<code>any</code> отключает проверку и сводит пользу TS к нулю. Для неизвестных данных используйте <code>unknown</code>: его нужно сузить проверкой перед использованием."],"code":"let count: number = 0;\nconst tags: string[] = [\"ts\", \"node\"];\nconst pair: [string, number] = [\"Ада\", 36];\n\nfunction parse(input: unknown): number {\n  if (typeof input === \"number\") return input;\n  if (typeof input === \"string\") return Number(input);\n  throw new Error(\"Не число\");\n}\n\n// count = \"10\";  // Ошибка: string не присваивается number","tips":["Включайте <code>\"strict\": true</code> в tsconfig.json с первого дня","unknown безопаснее any: его нельзя использовать без проверки","Типы существуют только при компиляции, в рантайме их нет"],"q":[{"t":"mc","q":"Что делает компилятор tsc?","e":"Браузер исполняет уже скомпилированный JS.","o":["Запускает TypeScript в браузере напрямую","Проверяет типы и превращает код в JavaScript","Оптимизирует код для скорости","Подключает библиотеки"],"a":1},{"t":"mc","q":"Чем unknown отличается от any?","e":"Это безопасная альтернатива any.","o":["unknown нельзя использовать без проверки типа","Ничем","any строже","unknown разрешён только в функциях"],"a":0},{"t":"fill","q":"Впишите тип массива строк.","e":"Обе записи равнозначны.","c":"const names: ___ = [\"Ада\", \"Алан\"];","ans":["string[]","Array<string>"]},{"t":"mc","q":"Существуют ли типы TypeScript во время выполнения программы?","e":"Проверка типов в рантайме требует отдельных инструментов, например zod.","o":["Да, всегда","Нет, они стираются при компиляции","Только в Node.js","Только интерфейсы"],"a":1}]},{"t":"Интерфейсы и type","body":["<code>interface</code> и <code>type</code> описывают форму объекта. Поле со знаком <code>?</code> необязательное, <code>readonly</code> запрещает изменение.","<code>type</code> умеет больше: объединения <code>\"a\" | \"b\"</code>, пересечения <code>A &amp; B</code>, псевдонимы для любых типов. <code>interface</code> можно расширять через <code>extends</code> и дополнять повторным объявлением.","TypeScript использует структурную типизацию: объект подходит под тип, если у него есть нужные поля, независимо от того, как он создан."],"code":"interface User {\n  readonly id: number;\n  name: string;\n  email?: string;\n}\n\ninterface Admin extends User {\n  permissions: string[];\n}\n\ntype Status = \"draft\" | \"published\" | \"archived\";\ntype WithTimestamps<T> = T & { createdAt: Date };\n\nconst u: User = { id: 1, name: \"Ада\" };\n// u.id = 2;  // Ошибка: readonly","tips":["Объединение строковых литералов заменяет enum во многих случаях","Лишнее поле в объектном литерале — ошибка, а в переменной — нет","Для публичных моделей обычно выбирают interface"],"q":[{"t":"mc","q":"Что означает <code>email?: string</code>?","e":"Знак вопроса делает поле необязательным.","o":["Поле может быть null","Поле может отсутствовать (тип string | undefined)","Поле только для чтения","Поле приватное"],"a":1},{"t":"mc","q":"Какая типизация в TypeScript?","e":"Совместимость определяется формой объекта.","o":["Номинальная","Структурная","Динамическая","Утиная только в рантайме"],"a":1},{"t":"fill","q":"Впишите модификатор, запрещающий менять поле.","e":"readonly проверяется при компиляции.","c":"interface Point { ___ x: number; }","ans":["readonly"]},{"t":"fill","q":"Впишите тип, разрешающий только три значения.","e":"Объединение строковых литералов.","c":"type Size = \"s\" ___ \"m\" ___ \"l\";","ans":["|"]}]},{"t":"Функции и сужение типов","body":["Параметры и результат функции типизируют явно: <code>function f(a: number): string</code>. Тип <code>void</code> значит «ничего не возвращает», <code>never</code> — «никогда не завершается нормально».","Сужение (narrowing): после проверок <code>typeof</code>, <code>instanceof</code>, <code>in</code> или сравнения с литералом TypeScript понимает более точный тип внутри ветки.","Размеченное объединение — объекты с общим полем-меткой (<code>kind</code>). Проверка метки в <code>switch</code> сужает тип, а <code>never</code> в default гарантирует, что обработаны все варианты."],"code":"type Shape =\n  | { kind: \"circle\"; r: number }\n  | { kind: \"rect\"; w: number; h: number };\n\nfunction area(s: Shape): number {\n  switch (s.kind) {\n    case \"circle\": return Math.PI * s.r ** 2;\n    case \"rect\":   return s.w * s.h;\n    default: {\n      const check: never = s;   // ошибка, если забыли вариант\n      return check;\n    }\n  }\n}","tips":["Проверка через never ловит забытые case при добавлении нового варианта","Опциональный параметр <code>x?: number</code> ставится после обязательных","Пользовательский type guard: <code>function isUser(x): x is User</code>"],"q":[{"t":"mc","q":"Какой тип у функции, которая всегда бросает исключение?","e":"never означает, что нормального возврата нет.","o":["void","never","undefined","any"],"a":1},{"t":"mc","q":"Что такое сужение типа?","e":"Например, после typeof x === \"string\" x считается строкой.","o":["Уточнение типа внутри ветки после проверки","Сокращение имени типа","Удаление необязательных полей","Приведение через as"],"a":0},{"t":"fill","q":"Впишите возвращаемый тип функции, которая ничего не возвращает.","e":"void — отсутствие значения.","c":"function log(msg: string): ___ { console.log(msg); }","ans":["void"]},{"t":"fill","q":"Впишите оператор проверки наличия свойства для сужения.","e":"Оператор in сужает объединение по наличию поля.","c":"if (\"permissions\" ___ user) { /* Admin */ }","ans":["in"]}]},{"t":"Дженерики","body":["Дженерик — тип-параметр, который делает функцию или класс универсальными без потери типов. <code>function first&lt;T&gt;(arr: T[]): T | undefined</code> вернёт число для массива чисел и строку для массива строк.","Ограничение <code>T extends ...</code> требует, чтобы тип имел нужные поля. <code>keyof T</code> — объединение ключей типа, а <code>T[K]</code> — тип значения по ключу.","Дженерики используются везде: <code>Array&lt;T&gt;</code>, <code>Promise&lt;T&gt;</code>, <code>Map&lt;K, V&gt;</code>, ответы API <code>ApiResponse&lt;T&gt;</code>."],"code":"function first<T>(arr: T[]): T | undefined {\n  return arr[0];\n}\nconst n = first([1, 2, 3]);     // number | undefined\n\nfunction pluck<T, K extends keyof T>(items: T[], key: K): T[K][] {\n  return items.map(i => i[key]);\n}\nconst names = pluck([{ name: \"Ада\", age: 36 }], \"name\"); // string[]\n\ninterface ApiResponse<T> { data: T; error?: string; }\nasync function getJSON<T>(url: string): Promise<ApiResponse<T>> {\n  const res = await fetch(url);\n  return { data: (await res.json()) as T };\n}","tips":["Не плодите дженерики там, где хватит конкретного типа","<code>as T</code> — это обещание компилятору, а не проверка","keyof с extends защищает от опечаток в именах полей"],"q":[{"t":"mc","q":"Что такое <code>keyof User</code> для <code>interface User { id: number; name: string }</code>?","e":"keyof даёт объединение имён ключей.","o":["number | string","\"id\" | \"name\"","User[]","string"],"a":1},{"t":"fill","q":"Впишите ограничение: K должен быть ключом T.","e":"extends ограничивает тип-параметр.","c":"function get<T, K ___ keyof T>(o: T, k: K) { return o[k]; }","ans":["extends"]},{"t":"mc","q":"Какой тип вернёт <code>first([\"a\", \"b\"])</code> для <code>first&lt;T&gt;(arr: T[]): T | undefined</code>?","e":"T выводится как string.","o":["string | undefined","string","any","unknown"],"a":0},{"t":"mc","q":"Что проверяет <code>as T</code> во время выполнения?","e":"Для проверки данных нужен валидатор.","o":["Соответствие объекта типу","Ничего, это только указание компилятору","Наличие обязательных полей","Тип каждого поля"],"a":1}]},{"t":"Утилитарные типы","body":["TypeScript содержит готовые преобразования типов. <code>Partial&lt;T&gt;</code> делает все поля необязательными, <code>Required&lt;T&gt;</code> — обязательными, <code>Readonly&lt;T&gt;</code> — только для чтения.","<code>Pick&lt;T, K&gt;</code> оставляет выбранные поля, <code>Omit&lt;T, K&gt;</code> убирает. <code>Record&lt;K, V&gt;</code> описывает объект с ключами K и значениями V. <code>ReturnType&lt;F&gt;</code> достаёт тип результата функции.","С ними модели для форм, обновлений и ответов API выводятся из одной сущности, и при изменении сущности всё обновляется автоматически."],"code":"interface User { id: number; name: string; email: string; password: string; }\n\ntype PublicUser = Omit<User, \"password\">;\ntype UserUpdate = Partial<Pick<User, \"name\" | \"email\">>;\ntype RoleMap = Record<\"admin\" | \"user\", string[]>;\n\nfunction update(id: number, patch: UserUpdate) { /* ... */ }\nupdate(1, { name: \"Ада\" });           // ок: email не обязателен\n\nfunction makeUser() { return { id: 1, ok: true }; }\ntype Made = ReturnType<typeof makeUser>; // { id: number; ok: boolean }","tips":["Выводите типы из одной модели, а не копируйте поля","Omit удобен, чтобы не отдать пароль в ответе API","Readonly поверхностный: вложенные объекты можно менять"],"q":[{"t":"mc","q":"Какой утилитарный тип сделает все поля необязательными?","e":"Partial&lt;T&gt; добавляет ? ко всем полям.","o":["Partial","Optional","Pick","Required"],"a":0},{"t":"fill","q":"Впишите тип, который уберёт поле password.","e":"Omit исключает перечисленные ключи.","c":"type Safe = ___<User, \"password\">;","ans":["Omit"]},{"t":"mc","q":"Что описывает <code>Record&lt;string, number&gt;</code>?","e":"Например, { a: 1, b: 2 }.","o":["Массив чисел","Объект со строковыми ключами и числовыми значениями","Кортеж","Map"],"a":1},{"t":"fill","q":"Впишите утилиту, которая достаёт тип результата функции.","e":"ReturnType принимает тип функции.","c":"type R = ___<typeof fn>;","ans":["ReturnType"]}]},{"t":"Классы и модификаторы доступа","body":["В классах TypeScript есть модификаторы <code>public</code>, <code>private</code>, <code>protected</code> и <code>readonly</code>. Параметр конструктора с модификатором сразу становится полем.","<code>abstract</code> класс нельзя создать напрямую: он задаёт каркас и абстрактные методы для наследников. <code>implements</code> проверяет, что класс выполняет контракт интерфейса.","<code>private</code> в TS проверяется только при компиляции. Для настоящей приватности в рантайме используйте поля <code>#</code>."],"code":"interface Repo<T> {\n  find(id: number): T | undefined;\n  save(item: T): void;\n}\n\nabstract class Base {\n  constructor(protected readonly name: string) {}\n  abstract describe(): string;\n}\n\nclass MemoryRepo<T extends { id: number }> extends Base implements Repo<T> {\n  private items = new Map<number, T>();\n  find(id: number) { return this.items.get(id); }\n  save(item: T) { this.items.set(item.id, item); }\n  describe() { return `${this.name}: ${this.items.size}`; }\n}","tips":["Сокращённая запись полей в конструкторе экономит много строк","protected доступен в наследниках, private — только в самом классе","Программируйте против интерфейсов, а не конкретных классов"],"q":[{"t":"mc","q":"Что значит abstract класс?","e":"Он служит основой для наследников.","o":["Класс без методов","Класс, экземпляр которого нельзя создать напрямую","Класс только со статическими методами","Приватный класс"],"a":1},{"t":"mc","q":"Где доступно поле protected?","e":"private не видно даже наследникам.","o":["Везде","Только в самом классе","В классе и его наследниках","Только в том же файле"],"a":2},{"t":"fill","q":"Впишите слово, которое проверяет соответствие класса интерфейсу.","e":"extends — для наследования классов.","c":"class UserRepo ___ Repo<User> { }","ans":["implements"]},{"t":"mc","q":"Скрыто ли поле private в скомпилированном JavaScript?","e":"Для рантайм-приватности нужен #.","o":["Да, полностью","Нет, проверка только при компиляции","Только в строгом режиме","Только в браузере"],"a":1}]},{"t":"Модули, tsconfig и сборка","body":["Каждый файл с <code>import</code> или <code>export</code> — модуль. <code>export type</code> и <code>import type</code> подключают только типы, они полностью исчезают из итогового JS.","<code>tsconfig.json</code> управляет компиляцией: <code>strict</code> включает строгие проверки, <code>target</code> — версию JS на выходе, <code>module</code> — формат модулей, <code>outDir</code> — папку сборки.","Типы для JS-библиотек ставят отдельными пакетами <code>@types/имя</code>, если библиотека не поставляет их сама. Во фронтенде TS собирают Vite или Next.js, в Node.js — <code>tsc</code> или <code>tsx</code> для разработки."],"code":"// models.ts\nexport interface Note { id: string; text: string; }\nexport const MAX_LEN = 500;\n\n// service.ts\nimport type { Note } from \"./models\";\nimport { MAX_LEN } from \"./models\";\n\nexport function validate(n: Note): boolean {\n  return n.text.length <= MAX_LEN;\n}\n\n// tsconfig.json\n// { \"compilerOptions\": { \"strict\": true, \"target\": \"ES2022\",\n//   \"module\": \"NodeNext\", \"outDir\": \"dist\" } }","tips":["Не коммитьте папку dist — её создаёт сборка","<code>noUncheckedIndexedAccess</code> делает arr[i] типом T | undefined","Ошибки компиляции нужно чинить, а не глушить через // @ts-ignore"],"q":[{"t":"mc","q":"Что делает <code>import type</code>?","e":"Это помогает избежать лишних зависимостей в рантайме.","o":["Импортирует только тип, который исчезнет из JS","Импортирует модуль быстрее","Подключает @types пакет","Делает импорт динамическим"],"a":0},{"t":"fill","q":"Впишите опцию tsconfig, которая включает все строгие проверки.","e":"strict включает целый набор проверок.","c":"{ \"compilerOptions\": { \"___\": true } }","ans":["strict"]},{"t":"mc","q":"Откуда берутся типы для библиотеки без встроенных типов?","e":"Например, @types/express.","o":["Генерируются автоматически","Из пакета @types/имя","Из tsconfig.json","Их нельзя получить"],"a":1},{"t":"mc","q":"Что лучше сделать с ошибкой типов?","e":"Подавление ошибок прячет реальные баги.","o":["Добавить // @ts-ignore","Поставить any","Исправить тип или код","Отключить strict"],"a":2}],"run":false},{"t":"Валидация данных и типизация API","body":["Типы TypeScript исчезают при компиляции, поэтому данные из сети, форм и файлов нужно проверять в рантайме. Библиотека zod описывает схему один раз и даёт и проверку, и тип через <code>z.infer</code>.","<code>schema.parse(data)</code> бросает ошибку при несоответствии, <code>safeParse</code> возвращает объект с <code>success</code> — удобно для ответов API без исключений.","Хорошая практика — проверять данные на границе системы (входящий HTTP-запрос, ответ внешнего API), а внутри приложения работать уже с проверенными типами."],"code":"import { z } from \"zod\";\n\nconst NoteSchema = z.object({\n  id: z.string().uuid(),\n  text: z.string().min(1).max(500),\n  tags: z.array(z.string()).default([]),\n});\ntype Note = z.infer<typeof NoteSchema>;\n\nasync function loadNote(id: string): Promise<Note> {\n  const res = await fetch(`/api/notes/${id}`);\n  if (!res.ok) throw new Error(`HTTP ${res.status}`);\n  return NoteSchema.parse(await res.json());\n}\n\nconst result = NoteSchema.safeParse({ id: \"x\", text: \"\" });\nif (!result.success) console.log(result.error.issues.length); // 2","tips":["Проверяйте данные на границах: запросы, ответы, localStorage","z.infer избавляет от дублирования интерфейса и схемы","safeParse не бросает исключение"],"q":[{"t":"mc","q":"Зачем проверять ответ API, если есть тип?","e":"Типы — только проверка при компиляции.","o":["Тип не существует в рантайме, а сервер может прислать что угодно","Чтобы ускорить запрос","Так требует fetch","Для сжатия данных"],"a":0},{"t":"fill","q":"Впишите способ получить TypeScript-тип из zod-схемы.","e":"Тип выводится из схемы.","c":"type User = z.___<typeof UserSchema>;","ans":["infer"]},{"t":"mc","q":"Что вернёт safeParse при неверных данных?","e":"parse в этом случае бросил бы ошибку.","o":["Объект с success: false и описанием ошибок","Исключение","null","Исходные данные"],"a":0},{"t":"mc","q":"Где лучше всего валидировать входящие данные?","e":"Внутри приложение работает с проверенными типами.","o":["На границе системы: при получении запроса или ответа","В каждой функции заново","Только в базе данных","Только в интерфейсе"],"a":0}]}],"exam":[{"t":"mc","q":"Какой тип у <code>x</code> после <code>const x = [1, \"a\"]</code>?","e":"Без as const выводится массив объединения.","o":["[number, string]","(string | number)[]","any[]","unknown[]"],"a":1},{"t":"mc","q":"Какой тип у <code>x</code> после <code>const x = [1, \"a\"] as const</code>?","e":"as const делает литеральный кортеж только для чтения.","o":["readonly [1, \"a\"]","(string | number)[]","[number, string]","any"],"a":0},{"t":"mc","q":"Что вернёт <code>typeof</code> в позиции типа: <code>type T = typeof config</code>?","e":"В позиции типа typeof берёт тип значения.","o":["Строку \"object\"","Тип переменной config","Ошибку","unknown"],"a":1},{"t":"fill","q":"Впишите тип: все поля T только для чтения.","e":"Readonly&lt;T&gt; добавляет readonly ко всем полям.","c":"type Frozen<T> = ___<T>;","ans":["Readonly"]},{"t":"mc","q":"Что выведет TS-ошибку?","e":"\"c\" не входит в объединение.","o":["const a: number | string = 5;","const b: \"a\" | \"b\" = \"c\";","const c: unknown = 5;","let d: any = \"x\";"],"a":1},{"t":"mc","q":"Что такое <code>T extends string ? \"yes\" : \"no\"</code>?","e":"Условные типы вычисляются при компиляции.","o":["Ограничение дженерика","Условный тип","Тернарный оператор в рантайме","Ошибка синтаксиса"],"a":1},{"t":"out","q":"Что выведет скомпилированный код?","e":"Числовой enum имеет обратное отображение.","c":"enum Color { Red, Green, Blue }\nconsole.log(Color.Blue, Color[0]);","ans":["2 Red"]},{"t":"mc","q":"Какой тип у <code>Parameters&lt;(a: number, b: string) =&gt; void&gt;</code>?","e":"Parameters возвращает кортеж типов параметров.","o":["[a: number, b: string]","number | string","void","(number | string)[]"],"a":0},{"t":"fill","q":"Впишите оператор non-null assertion.","e":"Восклицательный знак убирает null из типа. Используйте осторожно.","c":"const el = document.getElementById(\"app\")___;","ans":["!"]},{"t":"mc","q":"Зачем <code>satisfies</code>: <code>const cfg = {...} satisfies Config</code>?","e":"В отличие от аннотации, satisfies не расширяет тип.","o":["Проверить соответствие типу, сохранив точный выведенный тип","Привести объект к типу Config","Сделать объект readonly","Проверить объект в рантайме"],"a":0},{"t":"mc","q":"Какой тип у <code>arr[0]</code> при <code>noUncheckedIndexedAccess</code>, если arr: string[]?","e":"Опция учитывает, что элемента может не быть.","o":["string","string | undefined","unknown","never"],"a":1},{"t":"mc","q":"Почему данные из fetch лучше валидировать (например zod), даже с типами?","e":"Типизация JSON через as — это допущение, а не проверка.","o":["TypeScript медленный","Типы не проверяют данные в рантайме, сервер может вернуть что угодно","fetch возвращает any только в Node.js","Так требует strict"],"a":1}]},{"id":"sql","name":"SQL","land":"Долина данных","color":"#4c9a8a","about":"Язык баз данных. Нужен почти каждому разработчику: бэкенд, аналитика, отчёты.","project":{"title":"База интернет-магазина","desc":"Спроектировать и наполнить базу PostgreSQL для небольшого магазина и написать аналитические запросы.","req":["Таблицы customers, products, orders, order_items с первичными и внешними ключами","Ограничения NOT NULL, UNIQUE, CHECK (цена больше нуля)","Скрипт с тестовыми данными: минимум 50 заказов","10 запросов: выручка по месяцам, топ-5 товаров, клиенты без заказов, средний чек и другие","Индексы под самые частые запросы и объяснение через EXPLAIN","Всё в репозитории: schema.sql, seed.sql, queries.sql и README"]},"lessons":[{"t":"SELECT, WHERE и сортировка","body":["SQL описывает, какие данные нужны, а не как их достать. <code>SELECT</code> выбирает столбцы, <code>FROM</code> — таблицу, <code>WHERE</code> фильтрует строки, <code>ORDER BY</code> сортирует, <code>LIMIT</code> ограничивает количество.","Условия объединяют через <code>AND</code>, <code>OR</code>, <code>NOT</code>. Удобные операторы: <code>BETWEEN</code>, <code>IN (...)</code>, <code>LIKE 'A%'</code> для поиска по шаблону.","<code>NULL</code> означает «значение неизвестно». Сравнение с NULL через <code>=</code> всегда даёт неизвестность, поэтому проверяют <code>IS NULL</code> и <code>IS NOT NULL</code>."],"code":"SELECT name, price\nFROM products\nWHERE price BETWEEN 1000 AND 5000\n  AND category IN ('watches', 'bags')\n  AND name LIKE 'P%'\nORDER BY price DESC\nLIMIT 10;\n\nSELECT * FROM customers WHERE phone IS NULL;","tips":["<code>WHERE phone = NULL</code> никогда ничего не найдёт","Не пишите SELECT * в продакшен-коде: перечисляйте столбцы","Строки в SQL — в одинарных кавычках"],"q":[{"t":"mc","q":"Как найти строки, где email не заполнен?","e":"Сравнение с NULL через = даёт UNKNOWN.","o":["WHERE email = NULL","WHERE email IS NULL","WHERE email == ''","WHERE NOT email"],"a":1},{"t":"mc","q":"Что найдёт <code>LIKE '%son'</code>?","e":"% — любое количество любых символов.","o":["Строки, начинающиеся на son","Строки, заканчивающиеся на son","Строки ровно из трёх букв","Только слово son"],"a":1},{"t":"fill","q":"Впишите ключевое слово сортировки по убыванию.","e":"ASC — по возрастанию, это значение по умолчанию.","c":"SELECT * FROM orders ORDER BY total ___;","ans":["DESC","desc"]},{"t":"mc","q":"Включает ли <code>BETWEEN 10 AND 20</code> границы?","e":"BETWEEN эквивалентен &gt;= 10 AND &lt;= 20.","o":["Да, обе","Нет","Только 10","Только 20"],"a":0}],"run":false},{"t":"Агрегации и GROUP BY","body":["Агрегатные функции считают по группе строк: <code>COUNT</code>, <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code>. <code>COUNT(*)</code> считает строки, <code>COUNT(column)</code> — только непустые значения.","<code>GROUP BY</code> разбивает строки на группы. В SELECT можно выводить только столбцы группировки и агрегаты.","<code>WHERE</code> фильтрует строки до группировки, <code>HAVING</code> — группы после неё. Порядок выполнения: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT."],"code":"SELECT customer_id,\n       COUNT(*)        AS orders_count,\n       SUM(total)      AS revenue,\n       ROUND(AVG(total), 2) AS avg_check\nFROM orders\nWHERE status = 'paid'\nGROUP BY customer_id\nHAVING SUM(total) > 50000\nORDER BY revenue DESC;","tips":["Условие на агрегат пишут в HAVING, а не в WHERE","COUNT(column) игнорирует NULL","Псевдоним из SELECT нельзя использовать в WHERE того же запроса"],"q":[{"t":"mc","q":"Где фильтровать группы по <code>SUM(total) &gt; 1000</code>?","e":"WHERE работает до агрегации.","o":["WHERE","HAVING","ORDER BY","GROUP BY"],"a":1},{"t":"out","q":"Таблица t(x) содержит значения 1, NULL, 3. Что вернёт запрос?","e":"COUNT(x) не считает NULL.","c":"SELECT COUNT(*), COUNT(x) FROM t;","ans":["3 2","3, 2","3|2"]},{"t":"mc","q":"Что выполняется раньше: WHERE или GROUP BY?","e":"Сначала фильтруются строки, потом группируются.","o":["WHERE","GROUP BY","Одновременно","Зависит от СУБД"],"a":0},{"t":"fill","q":"Впишите функцию среднего значения.","e":"AVG считает среднее, игнорируя NULL.","c":"SELECT ___(price) FROM products;","ans":["AVG","avg"]}],"run":false},{"t":"JOIN","body":["Данные хранят в разных таблицах и связывают ключами. <code>JOIN</code> объединяет строки по условию <code>ON</code>.","<code>INNER JOIN</code> оставляет только совпавшие строки. <code>LEFT JOIN</code> — все строки левой таблицы, а у несовпавших поля правой будут NULL. Так ищут, например, клиентов без заказов.","Таблицам дают короткие псевдонимы. Если условие JOIN не указано или неверно, получится декартово произведение — каждая строка с каждой."],"code":"SELECT c.name, o.id, o.total\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nWHERE o.created_at >= '2026-01-01';\n\n-- клиенты без заказов\nSELECT c.name\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL;","tips":["LEFT JOIN + WHERE право.id IS NULL — классический поиск «без пары»","Условие на правую таблицу в WHERE превращает LEFT JOIN в INNER","JOIN по неиндексированному столбцу медленный на больших таблицах"],"q":[{"t":"mc","q":"Какой JOIN вернёт всех клиентов, включая тех, у кого нет заказов?","e":"LEFT сохраняет все строки левой таблицы.","o":["INNER JOIN","LEFT JOIN customers → orders","CROSS JOIN","RIGHT JOIN customers → orders"],"a":1},{"t":"out","q":"В A 3 строки, в B 4 строки. Сколько строк вернёт запрос?","e":"Каждая строка с каждой: 3 × 4.","c":"SELECT * FROM A CROSS JOIN B;","ans":["12"]},{"t":"fill","q":"Впишите ключевое слово условия соединения.","e":"ON задаёт условие соединения.","c":"SELECT * FROM orders o JOIN customers c ___ c.id = o.customer_id;","ans":["ON","on"]},{"t":"mc","q":"Что будет в полях правой таблицы у строк без пары при LEFT JOIN?","e":"Отсутствующие значения заполняются NULL.","o":["0","Пустая строка","NULL","Строка не попадёт в результат"],"a":2}],"run":false},{"t":"Изменение данных и транзакции","body":["<code>INSERT</code> добавляет строки, <code>UPDATE</code> меняет, <code>DELETE</code> удаляет. UPDATE и DELETE без WHERE затронут всю таблицу — перед запуском проверьте условие через SELECT.","Транзакция объединяет несколько операций в одно целое: либо выполняются все (<code>COMMIT</code>), либо ни одна (<code>ROLLBACK</code>). Это свойства ACID: атомарность, согласованность, изоляция, долговечность.","Перевод денег — классический пример: списание и зачисление должны пройти вместе."],"code":"INSERT INTO products (name, price) VALUES ('Poedagar 615', 18990);\n\nUPDATE products SET price = price * 0.9 WHERE category = 'sale';\n\nBEGIN;\nUPDATE accounts SET balance = balance - 5000 WHERE id = 1;\nUPDATE accounts SET balance = balance + 5000 WHERE id = 2;\nCOMMIT;","tips":["Сначала SELECT с тем же WHERE, потом UPDATE или DELETE","Значения из пользовательского ввода передавайте параметрами, а не склейкой строк","Буква A в ACID — атомарность: всё или ничего"],"q":[{"t":"mc","q":"Что сделает <code>DELETE FROM users;</code>?","e":"Таблица останется пустой. Удаление самой таблицы — DROP TABLE.","o":["Удалит таблицу","Удалит все строки таблицы","Выдаст ошибку без WHERE","Ничего"],"a":1},{"t":"mc","q":"Что означает атомарность транзакции?","e":"Это буква A в ACID.","o":["Все операции выполняются целиком или не выполняется ни одна","Транзакция выполняется быстро","Транзакция видна всем сразу","Данные сохраняются на диск"],"a":0},{"t":"fill","q":"Впишите команду отмены транзакции.","e":"ROLLBACK откатывает все изменения транзакции.","c":"BEGIN;\nDELETE FROM orders WHERE id = 7;\n___;","ans":["ROLLBACK","rollback"]},{"t":"mc","q":"Как защититься от SQL-инъекций?","e":"Параметры передаются отдельно от текста запроса.","o":["Экранировать кавычки вручную","Использовать параметризованные запросы","Запрещать пробелы во вводе","Хранить запросы в файле"],"a":1}],"run":false},{"t":"Проектирование таблиц","body":["Первичный ключ <code>PRIMARY KEY</code> уникально определяет строку. Внешний ключ <code>FOREIGN KEY</code> ссылается на строку другой таблицы и не даёт создать «висящую» ссылку.","Ограничения защищают данные: <code>NOT NULL</code>, <code>UNIQUE</code>, <code>CHECK (price &gt; 0)</code>, <code>DEFAULT</code>. Лучше, чтобы неверные данные не попали в базу совсем.","Нормализация убирает дублирование: данные клиента хранятся в одной таблице, а заказ ссылается на неё по id. Связь «многие ко многим» (заказы и товары) делают через промежуточную таблицу."],"code":"CREATE TABLE customers (\n  id         SERIAL PRIMARY KEY,\n  email      TEXT NOT NULL UNIQUE,\n  created_at TIMESTAMP NOT NULL DEFAULT now()\n);\n\nCREATE TABLE orders (\n  id          SERIAL PRIMARY KEY,\n  customer_id INT NOT NULL REFERENCES customers(id),\n  total       NUMERIC(10, 2) NOT NULL CHECK (total >= 0)\n);\n\nCREATE TABLE order_items (\n  order_id   INT REFERENCES orders(id) ON DELETE CASCADE,\n  product_id INT REFERENCES products(id),\n  qty        INT NOT NULL CHECK (qty > 0),\n  PRIMARY KEY (order_id, product_id)\n);","tips":["Деньги храните в NUMERIC, а не во FLOAT","Связь многие-ко-многим всегда через промежуточную таблицу","ON DELETE CASCADE удалит связанные строки вместе с родителем"],"q":[{"t":"mc","q":"Как реализовать связь «многие ко многим» между заказами и товарами?","e":"Каждая строка связывает один заказ с одним товаром.","o":["Массив id товаров в заказе","Внешний ключ в products на orders","Промежуточная таблица order_items","Дублировать товары в заказах"],"a":2},{"t":"mc","q":"Какой тип лучше для денег?","e":"Плавающая точка даёт ошибки округления.","o":["FLOAT","NUMERIC(10, 2)","TEXT","REAL"],"a":1},{"t":"fill","q":"Впишите ограничение, запрещающее повторяющиеся значения.","e":"UNIQUE создаёт уникальный индекс.","c":"email TEXT NOT NULL ___","ans":["UNIQUE","unique"]},{"t":"mc","q":"Что делает FOREIGN KEY?","e":"Это ссылочная целостность.","o":["Не даёт сослаться на несуществующую строку другой таблицы","Ускоряет любые запросы","Шифрует столбец","Делает столбец уникальным"],"a":0}],"run":false},{"t":"Подзапросы и CTE","body":["Подзапрос — запрос внутри запроса. Его используют в <code>WHERE ... IN (SELECT ...)</code>, в <code>FROM</code> как временную таблицу или как одно значение.","<code>EXISTS</code> проверяет, есть ли хоть одна строка, и останавливается на первой находке. Часто это быстрее, чем <code>IN</code> по большой выборке.","CTE (<code>WITH имя AS (...)</code>) даёт подзапросу имя и делает сложный запрос читаемым по шагам."],"code":"SELECT name FROM products\nWHERE price > (SELECT AVG(price) FROM products);\n\nWITH monthly AS (\n  SELECT date_trunc('month', created_at) AS month,\n         SUM(total) AS revenue\n  FROM orders\n  GROUP BY 1\n)\nSELECT month, revenue\nFROM monthly\nWHERE revenue > 1000000\nORDER BY month;\n\nSELECT c.name FROM customers c\nWHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);","tips":["NOT IN с подзапросом, где есть NULL, вернёт пустой результат","CTE разбивает сложную логику на понятные шаги","Коррелированный подзапрос выполняется для каждой строки внешнего запроса"],"q":[{"t":"mc","q":"Какое ключевое слово задаёт CTE?","e":"WITH имя AS (запрос).","o":["CTE","WITH","AS","TEMP"],"a":1},{"t":"mc","q":"Что проверяет EXISTS?","e":"Возвращает true или false.","o":["Что столбец не NULL","Что подзапрос вернул хотя бы одну строку","Что таблица существует","Что значение уникально"],"a":1},{"t":"fill","q":"Впишите оператор: цена выше средней.","e":"Скалярный подзапрос возвращает одно значение.","c":"WHERE price ___ (SELECT AVG(price) FROM products)","ans":[">"]},{"t":"mc","q":"Почему <code>NOT IN (подзапрос)</code> опасен, если подзапрос возвращает NULL?","e":"Используйте NOT EXISTS.","o":["Условие станет неизвестным и запрос не вернёт строк","Запрос упадёт с ошибкой","NULL будет проигнорирован","Запрос станет медленнее"],"a":0}],"run":false},{"t":"Оконные функции","body":["Оконная функция считает значение по набору строк, но не схлопывает их, как GROUP BY. Синтаксис: <code>функция() OVER (PARTITION BY ... ORDER BY ...)</code>.","<code>ROW_NUMBER</code> нумерует строки, <code>RANK</code> даёт одинаковый ранг равным значениям с пропусками, <code>DENSE_RANK</code> — без пропусков. <code>LAG</code> и <code>LEAD</code> берут значение из предыдущей или следующей строки.","Агрегат с ORDER BY в окне даёт нарастающий итог. Типичные задачи: топ-N в каждой категории, рост выручки к прошлому месяцу, накопительная сумма."],"code":"SELECT name, category, price,\n       ROW_NUMBER() OVER (PARTITION BY category ORDER BY price DESC) AS rn\nFROM products;\n\nWITH m AS (\n  SELECT date_trunc('month', created_at) AS month, SUM(total) AS rev\n  FROM orders GROUP BY 1\n)\nSELECT month, rev,\n       rev - LAG(rev) OVER (ORDER BY month) AS growth,\n       SUM(rev) OVER (ORDER BY month)       AS running_total\nFROM m;","tips":["Отфильтровать по rn = 1 можно только во внешнем запросе или CTE","PARTITION BY — это «группа» для окна","LAG у первой строки вернёт NULL"],"q":[{"t":"mc","q":"Чем оконная функция отличается от GROUP BY?","e":"Каждая строка получает своё вычисленное значение.","o":["Не уменьшает количество строк","Работает только с числами","Не поддерживает сортировку","Быстрее всегда"],"a":0},{"t":"out","q":"Значения цен: 100, 100, 90. Какие ранги даст RANK() OVER (ORDER BY price DESC)?","e":"RANK пропускает номер после одинаковых значений.","ans":["1 1 3","1, 1, 3"]},{"t":"fill","q":"Впишите функцию, которая берёт значение предыдущей строки.","e":"LEAD берёт следующую строку.","c":"SELECT rev - ___(rev) OVER (ORDER BY month) FROM m;","ans":["LAG","lag"]},{"t":"mc","q":"Как получить самый дорогой товар в каждой категории?","e":"Это классическая задача топ-N.","o":["GROUP BY category с ORDER BY price","ROW_NUMBER() по категории и фильтр rn = 1 во внешнем запросе","DISTINCT category","HAVING MAX(price)"],"a":1}],"run":false},{"t":"Индексы и производительность","body":["Индекс — отдельная структура (обычно B-дерево), которая ускоряет поиск по столбцу так же, как алфавитный указатель в книге. Без индекса база читает всю таблицу.","Индексы ускоряют SELECT, но замедляют INSERT и UPDATE и занимают место. Создавайте их под реальные запросы: столбцы в WHERE, JOIN и ORDER BY.","<code>EXPLAIN ANALYZE</code> показывает план выполнения. Seq Scan на большой таблице в частом запросе — повод подумать об индексе. Составной индекс <code>(a, b)</code> работает для условий по a и по a+b, но не по одному b."],"code":"CREATE INDEX idx_orders_customer ON orders (customer_id);\nCREATE INDEX idx_orders_cust_date ON orders (customer_id, created_at);\n\nEXPLAIN ANALYZE\nSELECT * FROM orders\nWHERE customer_id = 42\nORDER BY created_at DESC\nLIMIT 20;\n\n-- функция над столбцом мешает индексу:\n-- WHERE lower(email) = 'a@b.kz'  → нужен индекс по lower(email)","tips":["Первичный ключ и UNIQUE индексируются автоматически","Внешние ключи в PostgreSQL сами не индексируются","Функция над столбцом в WHERE отключает обычный индекс"],"q":[{"t":"mc","q":"Что замедляет каждый лишний индекс?","e":"При записи нужно обновлять все индексы.","o":["SELECT","INSERT и UPDATE","Только DELETE","Ничего"],"a":1},{"t":"mc","q":"Поможет ли индекс (a, b) запросу <code>WHERE b = 5</code>?","e":"Составной индекс работает по префиксу.","o":["Да, всегда","Обычно нет: используется левая часть индекса","Только если b уникален","Только с LIMIT"],"a":1},{"t":"fill","q":"Впишите команду, которая показывает план выполнения запроса.","e":"EXPLAIN ANALYZE ещё и выполняет запрос.","c":"___ SELECT * FROM orders WHERE id = 1;","ans":["EXPLAIN","EXPLAIN ANALYZE","explain"]},{"t":"mc","q":"Что значит Seq Scan в плане?","e":"На больших таблицах это медленно.","o":["Полное чтение таблицы","Поиск по индексу","Сортировка","Соединение таблиц"],"a":0}],"run":false}],"exam":[{"t":"out","q":"Таблица t(x): 1, 2, NULL. Что вернёт запрос?","e":"Агрегаты игнорируют NULL: среднее по двум значениям.","c":"SELECT SUM(x), AVG(x) FROM t;","ans":["3 1.5","3, 1.5"]},{"t":"out","q":"Таблица t(x): 1, 2, 2, 3. Что вернёт запрос?","e":"Уникальные значения: 1, 2, 3.","c":"SELECT COUNT(DISTINCT x) FROM t;","ans":["3"]},{"t":"mc","q":"Что вернёт <code>SELECT NULL = NULL</code>?","e":"Сравнение с неизвестным даёт неизвестность.","o":["true","false","NULL","Ошибку"],"a":2},{"t":"out","q":"В A 3 строки с id 1, 2, 3. В B 2 строки с a_id 1 и 1. Сколько строк даст запрос?","e":"id 1 совпадает дважды, id 2 и 3 — по одной строке с NULL.","c":"SELECT * FROM A LEFT JOIN B ON B.a_id = A.id;","ans":["4"]},{"t":"mc","q":"В каком порядке логически выполняются части запроса?","e":"Поэтому псевдоним из SELECT нельзя использовать в WHERE.","o":["SELECT → FROM → WHERE → GROUP BY","FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY","FROM → SELECT → WHERE → ORDER BY","WHERE → FROM → SELECT → GROUP BY"],"a":1},{"t":"out","q":"Цены 50, 50, 40. Какие значения даст DENSE_RANK() OVER (ORDER BY price DESC)?","e":"DENSE_RANK не делает пропусков.","ans":["1 1 2","1, 1, 2"]},{"t":"fill","q":"Впишите ключевое слово, удаляющее дубликаты строк из результата.","e":"DISTINCT оставляет уникальные строки.","c":"SELECT ___ city FROM customers;","ans":["DISTINCT","distinct"]},{"t":"mc","q":"Чем UNION отличается от UNION ALL?","e":"UNION ALL быстрее, если дубликаты не мешают.","o":["UNION убирает дубликаты, UNION ALL — нет","UNION ALL сортирует результат","Ничем","UNION работает только с двумя таблицами"],"a":0},{"t":"mc","q":"Какой уровень изоляции в PostgreSQL по умолчанию?","e":"Транзакция видит только зафиксированные изменения других.","o":["Read Uncommitted","Read Committed","Repeatable Read","Serializable"],"a":1},{"t":"mc","q":"Почему запрос <code>WHERE created_at::date = '2026-10-01'</code> может не использовать индекс по created_at?","e":"Лучше: created_at &gt;= '2026-10-01' AND created_at &lt; '2026-10-02'.","o":["Преобразование над столбцом мешает использовать обычный индекс","Даты нельзя индексировать","Нужен LIMIT","Индексы не работают с равенством"],"a":0},{"t":"out","q":"Что вернёт запрос?","e":"COALESCE возвращает первое не NULL значение.","c":"SELECT COALESCE(NULL, NULL, 'x', 'y');","ans":["x"]},{"t":"mc","q":"Что такое N+1 проблема?","e":"Решается JOIN или пакетной загрузкой.","o":["Таблица без первичного ключа","Один запрос за списком и ещё по запросу на каждый элемент","Лишний индекс","Ошибка нумерации строк"],"a":1}]},{"id":"java","name":"Java","land":"Джаваленд","color":"#b8673f","about":"Строгая типизация и JVM. Банки, корпоративные системы, бэкенд на Spring, Android.","project":{"title":"REST-сервис библиотеки на Spring Boot","desc":"Бэкенд для учёта книг и выдачи читателям.","req":["Сущности Book, Reader, Loan с JPA и PostgreSQL","CRUD-эндпоинты и выдача/возврат книги с проверкой бизнес-правил","Валидация запросов (@Valid) и единый обработчик ошибок (@ControllerAdvice)","Слои controller → service → repository, DTO вместо сущностей в ответах","Юнит-тесты на JUnit 5 и Mockito для сервисов","Сборка через Maven или Gradle, Dockerfile и README"]},"lessons":[{"t":"Синтаксис, типы и main","body":["Программа на Java состоит из классов. Точка входа — <code>public static void main(String[] args)</code>. Код компилируется в байт-код и выполняется на JVM, поэтому работает на любой ОС.","Примитивные типы: <code>int</code>, <code>long</code>, <code>double</code>, <code>boolean</code>, <code>char</code> и другие. У каждого примитива есть класс-обёртка (<code>Integer</code>, <code>Double</code>), а <code>String</code> — объект.","Целочисленное деление отбрасывает дробную часть. Переполнение <code>int</code> не вызывает ошибку, а молча «перекручивает» значение. Начиная с Java 10 тип локальной переменной можно вывести через <code>var</code>."],"code":"public class Main {\n    public static void main(String[] args) {\n        int a = 7, b = 2;\n        System.out.println(a / b);        // 3\n        System.out.println(a / (double) b); // 3.5\n        long big = Integer.MAX_VALUE + 1L;\n        int overflow = Integer.MAX_VALUE + 1; // -2147483648\n        var name = \"Ада\";                   // String\n        System.out.printf(\"%s: %d%n\", name, a);\n    }\n}","tips":["Для больших чисел используйте long, а для денег — BigDecimal","<code>char</code> — одиночные кавычки, <code>String</code> — двойные","var работает только для локальных переменных с инициализацией"],"q":[{"t":"out","q":"Что выведет код?","e":"7 / 2 = 3, 7 % 2 = 1.","c":"System.out.println(7 / 2 + 7 % 2);","ans":["4"]},{"t":"mc","q":"Что произойдёт при <code>Integer.MAX_VALUE + 1</code> в типе int?","e":"Java не проверяет переполнение int.","o":["ArithmeticException","Значение станет отрицательным (переполнение)","Тип автоматически станет long","Ошибка компиляции"],"a":1},{"t":"fill","q":"Впишите тип для целого числа больше 2 миллиардов.","e":"Суффикс L обозначает литерал long.","c":"___ population = 8_000_000_000L;","ans":["long"]},{"t":"out","q":"Что выведет код?","e":"Сначала 1 + 2 = 3, затем всё склеивается как строки.","c":"System.out.println(1 + 2 + \"3\" + 4 + 5);","ans":["3345"]}]},{"t":"Условия, циклы и switch","body":["<code>if</code>/<code>else</code>, <code>for</code>, <code>while</code> и <code>do-while</code> работают как в C. Цикл for-each <code>for (String s : list)</code> перебирает массивы и коллекции.","Современный <code>switch</code> со стрелками не проваливается в следующий case и может возвращать значение. Тернарный оператор <code>cond ? a : b</code> удобен для коротких выборов.","Строки сравнивают через <code>equals()</code>: <code>==</code> сравнивает ссылки, и две одинаковые по тексту строки могут оказаться разными объектами."],"code":"int[] scores = {90, 45, 77};\nfor (int s : scores) {\n    String grade = s >= 80 ? \"A\" : s >= 60 ? \"B\" : \"C\";\n    System.out.println(s + \" → \" + grade);\n}\n\nString day = \"SAT\";\nint hours = switch (day) {\n    case \"SAT\", \"SUN\" -> 0;\n    case \"FRI\" -> 6;\n    default -> 8;\n};\n\nString a = new String(\"hi\");\nSystem.out.println(a == \"hi\");      // false\nSystem.out.println(a.equals(\"hi\")); // true","tips":["Сравнение строк только через equals","Старый switch с двоеточием проваливается без break","<code>\"текст\".equals(x)</code> безопасен, даже если x — null"],"q":[{"t":"out","q":"Что выведет код?","e":"0 + 3 + 6 + 9.","c":"int s = 0;\nfor (int i = 0; i < 10; i += 3) s += i;\nSystem.out.println(s);","ans":["18"]},{"t":"out","q":"Что выведет код?","e":"Без break выполнение проваливается дальше.","c":"int x = 2;\nswitch (x) {\n    case 1: System.out.print(\"A\");\n    case 2: System.out.print(\"B\");\n    case 3: System.out.print(\"C\");\n}","ans":["BC"]},{"t":"mc","q":"Как правильно сравнить строки по содержимому?","e":"== сравнивает ссылки.","o":["a == b","a.equals(b)","a.compareTo(b) == true","a === b"],"a":1},{"t":"fill","q":"Впишите синтаксис ветки нового switch, которая не проваливается.","e":"Стрелочный case выполняет только свою ветку.","c":"case \"SAT\" ___ 0;","ans":["->"]}]},{"t":"ООП: классы, инкапсуляция, наследование","body":["Класс описывает состояние (поля) и поведение (методы). Поля делают <code>private</code>, а доступ дают через методы — это инкапсуляция: объект сам следит за корректностью своих данных.","<code>extends</code> наследует класс, <code>@Override</code> помечает переопределённый метод, <code>super</code> обращается к родителю. Java поддерживает одиночное наследование классов.","Полиморфизм: переменная типа родителя может хранить объект наследника, и вызов метода выполнит версию наследника. Для неизменяемых моделей данных удобны <code>record</code>."],"code":"public abstract class Shape {\n    public abstract double area();\n}\n\npublic class Circle extends Shape {\n    private final double r;\n    public Circle(double r) {\n        if (r <= 0) throw new IllegalArgumentException(\"r > 0\");\n        this.r = r;\n    }\n    @Override\n    public double area() { return Math.PI * r * r; }\n}\n\npublic record Point(int x, int y) {}\n\nShape s = new Circle(2);\nSystem.out.println(s.area());              // 12.56...\nSystem.out.println(new Point(1, 2));       // Point[x=1, y=2]","tips":["@Override защищает от опечатки в имени метода","record сам создаёт конструктор, геттеры, equals, hashCode и toString","Валидируйте данные в конструкторе — объект не должен быть «сломанным»"],"q":[{"t":"mc","q":"Сколько классов может наследовать класс в Java напрямую?","e":"Множественное наследование есть только у интерфейсов.","o":["Один","Два","Сколько угодно","Ни одного"],"a":0},{"t":"mc","q":"Что такое полиморфизм?","e":"Shape s = new Circle(); s.area() вызовет Circle.area().","o":["Наличие нескольких конструкторов","Вызов метода выполняет версию реального класса объекта","Приватные поля","Статические методы"],"a":1},{"t":"fill","q":"Впишите тип, который сам генерирует equals, hashCode и toString.","e":"Записи появились в Java 16.","c":"public ___ User(String name, int age) {}","ans":["record"]},{"t":"out","q":"Что выведет код?","e":"Вызывается метод реального класса объекта.","c":"class A { String who() { return \"A\"; } }\nclass B extends A { String who() { return \"B\"; } }\nA obj = new B();\nSystem.out.println(obj.who());","ans":["B"]}]},{"t":"Интерфейсы и абстракции","body":["Интерфейс — контракт: список методов, которые класс обязуется реализовать. Класс может реализовать много интерфейсов через <code>implements</code>.","В интерфейсах бывают <code>default</code>-методы с реализацией. Интерфейс с одним абстрактным методом называют функциональным: его можно передать лямбдой.","Код зависит от интерфейсов, а не от конкретных классов. Так реализацию легко подменить, например на заглушку в тестах."],"code":"public interface Notifier {\n    void send(String to, String text);\n    default void sendAll(List<String> to, String text) {\n        to.forEach(t -> send(t, text));\n    }\n}\n\npublic class EmailNotifier implements Notifier {\n    public void send(String to, String text) { /* SMTP */ }\n}\n\npublic class OrderService {\n    private final Notifier notifier;\n    public OrderService(Notifier notifier) { this.notifier = notifier; }\n}\n\nComparator<String> byLen = (a, b) -> a.length() - b.length();","tips":["Передача зависимостей через конструктор — основа тестируемого кода","Comparator, Runnable, Function — функциональные интерфейсы","Абстрактный класс хранит состояние, интерфейс задаёт контракт"],"q":[{"t":"mc","q":"Сколько интерфейсов может реализовать класс?","e":"class A extends B implements C, D, E.","o":["Один","Два","Сколько угодно","Ни одного, если есть extends"],"a":2},{"t":"mc","q":"Что такое функциональный интерфейс?","e":"Его реализацию можно записать лямбдой.","o":["Интерфейс с одним абстрактным методом","Интерфейс без методов","Интерфейс только со static методами","Любой интерфейс в java.util"],"a":0},{"t":"fill","q":"Впишите слово для метода с реализацией внутри интерфейса.","e":"default-методы появились в Java 8.","c":"___ void log(String s) { System.out.println(s); }","ans":["default"]},{"t":"mc","q":"Зачем OrderService получает Notifier через конструктор?","e":"Это внедрение зависимостей.","o":["Так быстрее","Чтобы зависеть от интерфейса и подменять реализацию, например в тестах","Так требует компилятор","Чтобы сделать поле публичным"],"a":1}]},{"t":"Коллекции и generics","body":["<code>List</code> хранит элементы по порядку (<code>ArrayList</code>), <code>Set</code> — уникальные (<code>HashSet</code>), <code>Map</code> — пары ключ–значение (<code>HashMap</code>). Объявляйте переменную типом интерфейса: <code>List&lt;String&gt; list = new ArrayList&lt;&gt;()</code>.","Generics задают тип элементов в угловых скобках и работают только с объектами: <code>List&lt;Integer&gt;</code>, а не <code>List&lt;int&gt;</code>. Автоупаковка превращает int в Integer автоматически.","Объекты в <code>HashSet</code> и ключи <code>HashMap</code> должны правильно реализовывать <code>equals</code> и <code>hashCode</code> вместе. Изменять коллекцию во время перебора for-each нельзя — будет ConcurrentModificationException."],"code":"List<String> langs = new ArrayList<>(List.of(\"Java\", \"Go\"));\nlangs.add(\"Kotlin\");\n\nMap<String, Integer> count = new HashMap<>();\nfor (String w : \"a b a c a\".split(\" \")) {\n    count.merge(w, 1, Integer::sum);\n}\nSystem.out.println(count.get(\"a\"));         // 3\nSystem.out.println(count.getOrDefault(\"z\", 0)); // 0\n\nSet<Integer> uniq = new HashSet<>(List.of(1, 2, 2, 3));\nSystem.out.println(uniq.size());            // 3\n\nlangs.removeIf(l -> l.startsWith(\"G\"));     // безопасное удаление","tips":["List.of создаёт неизменяемый список","Переопределили equals — переопределите и hashCode","Для удаления при переборе — removeIf или Iterator"],"q":[{"t":"out","q":"Что выведет код?","e":"Сначала удаляется значение 1, потом элемент с индексом 0 (это 2).","c":"List<Integer> list = new ArrayList<>(List.of(1, 2, 3));\nlist.remove(Integer.valueOf(1));\nlist.remove(0);\nSystem.out.println(list);","ans":["[3]"]},{"t":"mc","q":"Что случится при <code>List.of(1, 2).add(3)</code>?","e":"List.of возвращает неизменяемый список.","o":["Список станет [1, 2, 3]","UnsupportedOperationException","Ошибка компиляции","Ничего"],"a":1},{"t":"fill","q":"Впишите метод Map, который вернёт значение по умолчанию при отсутствии ключа.","e":"get вернул бы null.","c":"int n = map.___(\"key\", 0);","ans":["getOrDefault"]},{"t":"mc","q":"Что нужно переопределить вместе с equals для работы в HashMap?","e":"Равные объекты обязаны иметь одинаковый hashCode.","o":["hashCode","toString","compareTo","clone"],"a":0}]},{"t":"Исключения","body":["Проверяемые исключения (checked, например <code>IOException</code>) компилятор заставляет обработать или объявить через <code>throws</code>. Непроверяемые (<code>RuntimeException</code> и наследники) обычно сигнализируют об ошибке в коде.","<code>try-with-resources</code> автоматически закрывает ресурсы (файлы, соединения), реализующие <code>AutoCloseable</code>. <code>finally</code> выполняется всегда.","Не глотайте исключения пустым catch: залогируйте или пробросьте дальше с понятным сообщением. Свои исключения наследуют от <code>RuntimeException</code> или <code>Exception</code>."],"code":"public class NotFoundException extends RuntimeException {\n    public NotFoundException(String msg) { super(msg); }\n}\n\npublic Book find(long id) {\n    return repo.findById(id)\n        .orElseThrow(() -> new NotFoundException(\"Книга \" + id + \" не найдена\"));\n}\n\ntry (BufferedReader r = Files.newBufferedReader(Path.of(\"data.txt\"))) {\n    System.out.println(r.readLine());\n} catch (IOException e) {\n    throw new UncheckedIOException(\"Не удалось прочитать файл\", e);\n}","tips":["Пустой catch прячет баги","Передавайте исходное исключение как cause","NullPointerException почти всегда говорит об ошибке в логике"],"q":[{"t":"mc","q":"Какое исключение компилятор требует обработать или объявить?","e":"IOException — проверяемое.","o":["IOException","NullPointerException","IllegalArgumentException","ArithmeticException"],"a":0},{"t":"out","q":"Что выведет код?","e":"Исключение поймано, finally выполняется всегда.","c":"try {\n    System.out.print(\"A\");\n    throw new RuntimeException();\n} catch (RuntimeException e) {\n    System.out.print(\"B\");\n} finally {\n    System.out.print(\"C\");\n}","ans":["ABC"]},{"t":"fill","q":"Впишите конструкцию, которая сама закроет файл.","e":"try-with-resources закрывает AutoCloseable ресурсы.","c":"___ (var in = new FileInputStream(\"a.txt\")) { }","ans":["try"]},{"t":"mc","q":"Что не так с <code>catch (Exception e) {}</code>?","e":"Минимум — логировать.","o":["Ничего","Ошибка молча исчезает и баг невозможно найти","Код не скомпилируется","Исключение пробросится дальше"],"a":1}],"run":false},{"t":"Stream API и Optional","body":["Stream описывает обработку коллекции цепочкой: <code>filter</code> отбирает, <code>map</code> преобразует, <code>sorted</code> сортирует, <code>collect</code> собирает результат. Поток ленивый: ничего не выполняется до терминальной операции.","<code>Collectors.groupingBy</code> группирует элементы, <code>Collectors.toMap</code> строит словарь, <code>joining</code> склеивает строки. Поток одноразовый — повторно его не использовать.","<code>Optional</code> явно говорит «значения может не быть» и заставляет обработать этот случай через <code>orElse</code>, <code>orElseThrow</code>, <code>map</code>. Не возвращайте null там, где подходит Optional."],"code":"record Order(String customer, double total, boolean paid) {}\n\nList<Order> orders = List.of(\n    new Order(\"Ада\", 120, true),\n    new Order(\"Алан\", 80, false),\n    new Order(\"Ада\", 200, true));\n\ndouble revenue = orders.stream()\n    .filter(Order::paid)\n    .mapToDouble(Order::total)\n    .sum();                                   // 320.0\n\nMap<String, Long> byCustomer = orders.stream()\n    .collect(Collectors.groupingBy(Order::customer, Collectors.counting()));\n\nOptional<Order> big = orders.stream().filter(o -> o.total() > 150).findFirst();\nSystem.out.println(big.map(Order::customer).orElse(\"нет\")); // Ада","tips":["Без терминальной операции стрим ничего не делает","<code>Optional.get()</code> без проверки — тот же NullPointerException","Ссылки на методы <code>Order::paid</code> короче лямбд"],"q":[{"t":"out","q":"Что выведет код?","e":"Чётные 2 и 4 в квадрате.","c":"System.out.println(Stream.of(1, 2, 3, 4)\n    .filter(n -> n % 2 == 0)\n    .map(n -> n * n)\n    .toList());","ans":["[4, 16]"]},{"t":"mc","q":"Что вернёт findFirst()?","e":"Пустой поток даст Optional.empty().","o":["Элемент или null","Optional с элементом или пустой Optional","Список из одного элемента","Исключение, если пусто"],"a":1},{"t":"fill","q":"Впишите коллектор для группировки.","e":"Результат — Map&lt;город, List&lt;User&gt;&gt;.","c":".collect(Collectors.___(User::city))","ans":["groupingBy"]},{"t":"mc","q":"Что случится при повторном использовании того же Stream?","e":"Поток можно пройти только один раз.","o":["IllegalStateException","Он пройдёт заново","Вернёт пустой результат","Ошибка компиляции"],"a":0}]},{"t":"Многопоточность и основы JVM","body":["Поток (<code>Thread</code>) выполняет код параллельно. Создавать потоки вручную редко нужно: используют пулы <code>ExecutorService</code> и <code>CompletableFuture</code>. В Java 21 появились виртуальные потоки для тысяч одновременных задач.","Если несколько потоков меняют общие данные, возможна гонка. Защищаются через <code>synchronized</code>, атомарные классы (<code>AtomicInteger</code>) и потокобезопасные коллекции (<code>ConcurrentHashMap</code>).","Память JVM делится на стек (локальные переменные и вызовы) и кучу (объекты). Сборщик мусора сам удаляет объекты без ссылок, но утечки памяти всё равно возможны, если ссылки остаются, например в статических коллекциях."],"code":"AtomicInteger counter = new AtomicInteger();\ntry (ExecutorService pool = Executors.newVirtualThreadPerTaskExecutor()) {\n    for (int i = 0; i < 1000; i++) {\n        pool.submit(counter::incrementAndGet);\n    }\n}\nSystem.out.println(counter.get());     // 1000\n\nCompletableFuture<String> user = CompletableFuture.supplyAsync(() -> loadUser());\nCompletableFuture<String> stats = CompletableFuture.supplyAsync(() -> loadStats());\nString page = user.thenCombine(stats, (u, s) -> u + s).join();","tips":["<code>count++</code> не атомарен: при гонке часть увеличений потеряется","ConcurrentHashMap вместо HashMap для общих данных","Объекты в куче, ссылки на них и примитивы методов — в стеке"],"q":[{"t":"mc","q":"Почему <code>count++</code> из разных потоков даёт неверный результат?","e":"Используйте AtomicInteger или синхронизацию.","o":["Java не поддерживает потоки","Это три операции (прочитать, прибавить, записать), они перемешиваются","int слишком мал","Нужно использовать long"],"a":1},{"t":"mc","q":"Где хранятся объекты, созданные через new?","e":"Сборщик мусора управляет кучей.","o":["В стеке","В куче","В байт-коде","В регистре"],"a":1},{"t":"fill","q":"Впишите класс атомарного счётчика.","e":"Методы incrementAndGet и getAndIncrement атомарны.","c":"___ hits = new AtomicInteger();","ans":["AtomicInteger"]},{"t":"mc","q":"Какую коллекцию выбрать для словаря, который меняют разные потоки?","e":"Она рассчитана на конкурентный доступ.","o":["HashMap","TreeMap","ConcurrentHashMap","LinkedHashMap"],"a":2}],"run":false}],"exam":[{"t":"out","q":"Что выведет код?","e":"Integer кэширует значения от -128 до 127, сравнение через == сравнивает ссылки.","c":"Integer a = 127, b = 127, c = 128, d = 128;\nSystem.out.println((a == b) + \" \" + (c == d));","ans":["true false"]},{"t":"out","q":"Что выведет код?","e":"Строки неизменяемы, результат toUpperCase не сохранён.","c":"String s = \"java\";\ns.toUpperCase();\nSystem.out.println(s);","ans":["java"]},{"t":"out","q":"Что выведет код?","e":"Двоичная плавающая точка неточна.","c":"System.out.println(0.1 + 0.2 == 0.3);","ans":["false"]},{"t":"out","q":"Что выведет код?","e":"Массив — объект, обе переменные ссылаются на него.","c":"int[] arr = {1, 2, 3};\nint[] copy = arr;\ncopy[0] = 9;\nSystem.out.println(arr[0]);","ans":["9"]},{"t":"out","q":"Что выведет код?","e":"finally выполняется перед фактическим возвратом.","c":"static int f() {\n    try { return 1; }\n    finally { System.out.print(\"F\"); }\n}\n// в main:\nSystem.out.println(f());","ans":["F1"]},{"t":"mc","q":"Что будет, если поле в HashSet-объекте изменили после добавления, и оно влияет на hashCode?","e":"Объект лежит в «корзине» по старому хэшу.","o":["Ничего","contains может не найти объект","Исключение","Объект удалится"],"a":1},{"t":"mc","q":"Какая сложность get в HashMap в среднем?","e":"При хорошем хэшировании.","o":["O(1)","O(log n)","O(n)","O(n²)"],"a":0},{"t":"mc","q":"Что выведет <code>List.of(1, null)</code>?","e":"List.of не допускает null.","o":["[1, null]","NullPointerException","[1]","Ошибку компиляции"],"a":1},{"t":"fill","q":"Впишите модификатор, который запрещает наследование класса.","e":"String тоже final.","c":"public ___ class Money { }","ans":["final"]},{"t":"mc","q":"Чем <code>ArrayList</code> отличается от <code>LinkedList</code> при доступе по индексу?","e":"ArrayList хранит элементы в массиве.","o":["ArrayList — O(1), LinkedList — O(n)","Оба O(1)","ArrayList — O(n), LinkedList — O(1)","Оба O(log n)"],"a":0},{"t":"out","q":"Что выведет код?","e":"TreeMap хранит ключи отсортированными.","c":"var map = new TreeMap<String, Integer>();\nmap.put(\"b\", 2); map.put(\"a\", 1); map.put(\"c\", 3);\nSystem.out.println(map.firstKey() + map.lastKey());","ans":["ac"]},{"t":"mc","q":"Что делает <code>@Transactional</code> в Spring?","e":"По умолчанию откат на непроверяемых исключениях.","o":["Кэширует метод","Выполняет метод в транзакции БД и откатывает при RuntimeException","Делает метод асинхронным","Логирует вызовы"],"a":1}]},{"id":"kt","name":"Kotlin","land":"Котлинские фьорды","color":"#8f6ad6","about":"Современный язык JVM. Основной язык Android и популярный выбор для бэкенда.","project":{"title":"Android-приложение «Трекер привычек»","desc":"Приложение на Jetpack Compose для отметки ежедневных привычек.","req":["Экраны списка, создания и статистики с навигацией Compose Navigation","Архитектура MVVM: ViewModel со StateFlow, репозиторий","Хранение в Room с Flow-запросами","Напоминания через WorkManager","Юнит-тесты ViewModel с корутинами (kotlinx-coroutines-test)","APK в релизах GitHub, скриншоты и описание архитектуры в README"]},"lessons":[{"t":"Переменные, типы и строки","body":["<code>val</code> — значение только для чтения, <code>var</code> — изменяемая переменная. Предпочитайте <code>val</code>: код с неизменяемыми данными проще понимать.","Тип выводится автоматически, но его можно указать: <code>val age: Int = 36</code>. Всё в Kotlin — объекты, при этом компилятор сам использует примитивы JVM там, где можно.","Строковые шаблоны подставляют значения: <code>\"$name\"</code> или <code>\"${user.name}\"</code>. Тройные кавычки создают многострочную строку. <code>if</code> и <code>when</code> — выражения и возвращают значение."],"code":"val name = \"Ада\"\nvar score = 10\nscore += 5\nval level: Int = 3\n\nprintln(\"$name: ${score * level}\")   // Ада: 45\nval status = if (score > 10) \"pro\" else \"new\"\nval text = \"\"\"\n    Многострочный\n    текст\n\"\"\".trimIndent()\nprintln(7 / 2)        // 3\nprintln(7 / 2.0)      // 3.5","tips":["val по умолчанию, var только когда нужно менять","if — выражение, тернарного оператора в Kotlin нет","<code>${}</code> нужен для выражений, <code>$x</code> — для простых имён"],"q":[{"t":"mc","q":"Чем val отличается от var?","e":"val — ссылка только для чтения.","o":["val нельзя переприсвоить","val хранится быстрее","var только для чисел","Ничем"],"a":0},{"t":"out","q":"Что выведет код?","e":"Выражение в ${} вычисляется.","c":"val a = 5\nprintln(\"a = ${a * 2}\")","ans":["a = 10"]},{"t":"fill","q":"Впишите, чем в Kotlin заменяют тернарный оператор.","e":"if возвращает значение.","c":"val label = ___ (x > 0) \"плюс\" else \"минус\"","ans":["if"]},{"t":"out","q":"Что выведет код?","e":"Деление целых отбрасывает дробную часть.","c":"println(10 / 4)","ans":["2"]}]},{"t":"Условия, циклы и when","body":["<code>when</code> — мощная замена switch: сравнивает со значениями, диапазонами (<code>in 1..9</code>), типами (<code>is String</code>) или работает без аргумента как цепочка условий. Как и if, это выражение.","Циклы: <code>for (x in collection)</code>, диапазоны <code>1..10</code>, <code>until</code>, <code>downTo</code>, <code>step</code>. <code>while</code> и <code>do-while</code> тоже есть. <code>forEachIndexed</code> и <code>withIndex()</code> дают индекс.","Метки <code>break@outer</code> выходят из вложенного цикла. В лямбдах <code>return@forEach</code> пропускает текущий элемент."],"code":"fun grade(score: Int) = when (score) {\n    in 90..100 -> \"A\"\n    in 75 until 90 -> \"B\"\n    else -> \"C\"\n}\n\nfun describe(x: Any) = when (x) {\n    is Int -> \"число $x\"\n    is String -> \"строка длиной ${x.length}\"\n    else -> \"что-то ещё\"\n}\n\nfor (i in 10 downTo 0 step 5) print(\"$i \")   // 10 5 0\nfor ((i, v) in listOf(\"a\", \"b\").withIndex()) println(\"$i:$v\")\nprintln(grade(80))   // B","tips":["when без else должен покрывать все варианты, если используется как выражение","<code>until</code> не включает верхнюю границу","is в when сразу делает smart cast"],"q":[{"t":"out","q":"Что выведет код?","e":"1, 5, 9.","c":"for (i in 1..9 step 4) print(i)","ans":["159"]},{"t":"out","q":"Что выведет код?","e":"Первая подходящая ветка.","c":"val x = 15\nprintln(when { x % 15 == 0 -> \"FizzBuzz\"; x % 3 == 0 -> \"Fizz\"; else -> x })","ans":["FizzBuzz"]},{"t":"fill","q":"Впишите функцию для обратного диапазона от 5 до 1.","e":"5 4 3 2 1.","c":"for (i in 5 ___ 1) print(i)","ans":["downTo"]},{"t":"mc","q":"Что делает <code>is String</code> в ветке when?","e":"Можно сразу обращаться к x.length.","o":["Проверяет тип и делает smart cast к String внутри ветки","Приводит значение к строке","Сравнивает с пустой строкой","Объявляет переменную"],"a":0}]},{"t":"Null-безопасность","body":["Типы делятся на не-nullable (<code>String</code>) и nullable (<code>String?</code>). В обычную переменную нельзя положить null — компилятор не даст.","Безопасный вызов <code>?.</code> вернёт null вместо падения. Элвис-оператор <code>?:</code> подставляет значение по умолчанию. <code>!!</code> утверждает, что значения не null, и бросает исключение, если вы ошиблись.","После проверки <code>if (x != null)</code> компилятор сам считает x не-null (smart cast). Функция <code>let</code> выполняет блок только для не-null значения."],"code":"var email: String? = null\nval length = email?.length ?: 0        // 0\nemail?.let { sendTo(it) }              // не выполнится\n\nfun greet(name: String?) {\n    if (name == null) return\n    println(name.uppercase())          // smart cast к String\n}\n\nval port = System.getenv(\"PORT\")?.toIntOrNull() ?: 8080","tips":["<code>!!</code> — почти всегда признак плохого кода","<code>?:</code> удобно сочетать с return и throw: <code>val u = find(id) ?: return</code>","Java-методы возвращают «платформенные» типы — проверяйте их"],"q":[{"t":"mc","q":"Что вернёт <code>s?.length</code>, если s = null?","e":"Безопасный вызов не падает.","o":["0","null","NullPointerException","-1"],"a":1},{"t":"out","q":"Что выведет код?","e":"Элвис подставил значение по умолчанию.","c":"val s: String? = null\nprintln(s?.length ?: -1)","ans":["-1"]},{"t":"fill","q":"Впишите оператор значения по умолчанию.","e":"Элвис-оператор.","c":"val name = user?.name ___ \"Гость\"","ans":["?:"]},{"t":"mc","q":"Что делает <code>x!!</code>?","e":"Используйте только когда null действительно невозможен.","o":["Проверяет x на null и возвращает false","Возвращает x или бросает NullPointerException, если x — null","Делает x неизменяемым","Копирует x"],"a":1}],"run":false},{"t":"Функции и лямбды","body":["Функции объявляют через <code>fun</code>. Однострочная функция пишется через <code>=</code>. Параметры могут иметь значения по умолчанию, а аргументы — передаваться по имени.","Функции высшего порядка принимают или возвращают функции. Лямбду пишут в фигурных скобках, единственный параметр доступен как <code>it</code>. Если лямбда — последний аргумент, её выносят за скобки.","Функции-расширения добавляют методы к существующим классам без наследования: <code>fun String.isEmail(): Boolean</code>."],"code":"fun area(w: Int, h: Int = w) = w * h\n\nfun String.initials() = split(\" \").joinToString(\"\") { it.first().uppercase() }\n\nfun repeatTimes(n: Int, action: (Int) -> Unit) {\n    for (i in 1..n) action(i)\n}\n\nprintln(area(3))              // 9\nprintln(area(w = 2, h = 5))   // 10\nprintln(\"ада лавлейс\".initials())  // АЛ\nrepeatTimes(2) { println(\"Шаг $it\") }","tips":["Именованные аргументы делают вызовы понятнее","it удобен только в коротких лямбдах","Расширения не меняют класс — это синтаксический сахар над статической функцией"],"q":[{"t":"out","q":"Что выведет код?","e":"11 + 2.","c":"fun f(a: Int, b: Int = 10) = a + b\nprintln(f(1) + f(1, 1))","ans":["13"]},{"t":"mc","q":"Как зовут неявный параметр лямбды с одним аргументом?","e":"Например: list.map { it * 2 }.","o":["this","it","arg","_"],"a":1},{"t":"fill","q":"Впишите синтаксис диапазона от 1 до 5 включительно.","e":"Для невключительного верхнего конца есть until или ..&lt;.","c":"for (i in 1___5) println(i)","ans":[".."]},{"t":"mc","q":"Что такое функция-расширение?","e":"Например, fun Int.isEven() = this % 2 == 0.","o":["Функция, которая вызывается как метод существующего класса","Функция внутри класса","Функция с параметрами по умолчанию","Переопределённый метод"],"a":0}]},{"t":"Коллекции","body":["Коллекции бывают только для чтения (<code>List</code>, <code>Set</code>, <code>Map</code>) и изменяемые (<code>MutableList</code> и др.). Создают их через <code>listOf</code>, <code>mutableListOf</code>, <code>mapOf(\"a\" to 1)</code>.","Богатая стандартная библиотека: <code>filter</code>, <code>map</code>, <code>groupBy</code>, <code>associateBy</code>, <code>sumOf</code>, <code>sortedBy</code>, <code>firstOrNull</code>, <code>partition</code>.","<code>Sequence</code> вычисляет цепочку лениво, по элементу, — полезно для больших коллекций и длинных цепочек операций."],"code":"data class Order(val customer: String, val total: Int, val paid: Boolean)\n\nval orders = listOf(\n    Order(\"Ада\", 120, true),\n    Order(\"Алан\", 80, false),\n    Order(\"Ада\", 200, true),\n)\n\nval revenue = orders.filter { it.paid }.sumOf { it.total }       // 320\nval byCustomer = orders.groupBy { it.customer }                   // Map<String, List<Order>>\nval (paid, unpaid) = orders.partition { it.paid }\nval top = orders.maxByOrNull { it.total }?.customer               // Ада\nval ages = mapOf(\"Ада\" to 36, \"Алан\" to 41)","tips":["listOf возвращает список только для чтения","firstOrNull безопаснее first","<code>to</code> создаёт пару для mapOf"],"q":[{"t":"out","q":"Что выведет код?","e":"Отобраны 3 и 4.","c":"println(listOf(1, 2, 3, 4).filter { it > 2 }.map { it * 10 })","ans":["[30, 40]"]},{"t":"mc","q":"Можно ли вызвать add у результата listOf?","e":"Нужен mutableListOf.","o":["Да","Нет, это список только для чтения","Только для чисел","Только внутри функции"],"a":1},{"t":"fill","q":"Впишите функцию, которая вернёт null вместо исключения для пустого списка.","e":"first() на пустом списке бросит NoSuchElementException.","c":"val first = users.___()","ans":["firstOrNull"]},{"t":"out","q":"Что выведет код?","e":"partition делит на два списка.","c":"val (even, odd) = (1..6).partition { it % 2 == 0 }\nprintln(odd)","ans":["[1, 3, 5]"]}]},{"t":"Классы, data class, sealed","body":["Основной конструктор пишут в заголовке класса: <code>class User(val name: String)</code>. Классы по умолчанию <code>final</code>, для наследования их помечают <code>open</code>.","<code>data class</code> автоматически получает <code>equals</code>, <code>hashCode</code>, <code>toString</code>, <code>copy</code> и деструктуризацию. Это стандарт для моделей данных.","<code>sealed</code> класс или интерфейс ограничивает набор наследников. <code>when</code> по sealed-типу проверяется компилятором на полноту — удобно для состояний экрана. <code>object</code> — синглтон."],"code":"data class User(val id: Int, val name: String)\n\nval u = User(1, \"Ада\")\nval renamed = u.copy(name = \"Ада Л.\")\nprintln(u == User(1, \"Ада\"))      // true\n\nsealed interface UiState {\n    object Loading : UiState\n    data class Success(val items: List<String>) : UiState\n    data class Error(val message: String) : UiState\n}\n\nfun render(s: UiState) = when (s) {\n    UiState.Loading -> \"Загрузка\"\n    is UiState.Success -> \"Элементов: ${s.items.size}\"\n    is UiState.Error -> \"Ошибка: ${s.message}\"\n}","tips":["Классы final по умолчанию — для наследования нужен open","copy создаёт новый объект, исходный не меняется","when по sealed без else ловит забытые состояния при компиляции"],"q":[{"t":"mc","q":"Что нужно, чтобы класс можно было наследовать?","e":"По умолчанию классы final.","o":["Ничего","Пометить его open","Сделать data class","Сделать abstract обязательно"],"a":1},{"t":"out","q":"Что выведет код?","e":"data class поддерживает деструктуризацию.","c":"data class P(val x: Int, val y: Int)\nval (a, b) = P(3, 4)\nprintln(a + b)","ans":["7"]},{"t":"fill","q":"Впишите ключевое слово синглтона.","e":"object создаёт единственный экземпляр.","c":"___ Config { val url = \"https://api\" }","ans":["object"]},{"t":"mc","q":"Зачем sealed для состояний экрана?","e":"Набор наследников известен заранее.","o":["Компилятор проверит, что when обработал все варианты","Чтобы состояния были быстрее","Чтобы нельзя было создать объект","Для сериализации"],"a":0}]},{"t":"Корутины","body":["Корутины — лёгкие задачи, которые приостанавливаются без блокировки потока. Функция с <code>suspend</code> может вызывать другие suspend-функции, например сетевые запросы.","Корутины запускают в области (scope): <code>launch</code> — без результата, <code>async</code> — с результатом через <code>await()</code>. Структурная конкурентность: при отмене scope отменяются все его корутины.","Диспетчеры выбирают поток: <code>Dispatchers.Main</code> для UI, <code>IO</code> для сети и диска, <code>Default</code> для вычислений. В Android используют <code>viewModelScope</code>."],"code":"suspend fun loadUser(id: Int): User = withContext(Dispatchers.IO) {\n    api.getUser(id)\n}\n\nclass ProfileViewModel : ViewModel() {\n    fun load() = viewModelScope.launch {\n        try {\n            val user = async { loadUser(1) }\n            val stats = async { loadStats(1) }\n            show(user.await(), stats.await())   // параллельно\n        } catch (e: IOException) {\n            showError(e.message)\n        }\n    }\n}","tips":["suspend-функцию можно вызвать только из корутины или другой suspend-функции","Не используйте GlobalScope: корутина переживёт экран и утечёт","Два async подряд выполняются параллельно, два обычных вызова — по очереди"],"q":[{"t":"mc","q":"Что значит модификатор suspend?","e":"Приостановка не занимает поток.","o":["Функция выполняется в отдельном потоке","Функция может приостанавливаться, не блокируя поток","Функция запускается позже","Функция не возвращает значение"],"a":1},{"t":"mc","q":"Чем async отличается от launch?","e":"launch возвращает Job без результата.","o":["async возвращает результат через await()","launch быстрее","async блокирует поток","Ничем"],"a":0},{"t":"fill","q":"Впишите диспетчер для сетевых запросов и работы с диском.","e":"Default — для вычислений, Main — для UI.","c":"withContext(Dispatchers.___) { api.load() }","ans":["IO"]},{"t":"mc","q":"Почему GlobalScope — плохая идея?","e":"Используйте scope экрана или ViewModel.","o":["Он медленнее","Корутина не привязана к жизненному циклу и может утечь","Он не поддерживает async","Он работает только в тестах"],"a":1}],"run":false},{"t":"Flow и архитектура приложения","body":["<code>Flow</code> — асинхронный поток значений. Он холодный: начинает работать при сборе через <code>collect</code>. Операторы <code>map</code>, <code>filter</code>, <code>combine</code>, <code>debounce</code> преобразуют поток.","<code>StateFlow</code> хранит текущее состояние и сразу отдаёт его новым подписчикам — идеально для состояния экрана в ViewModel. Room и DataStore умеют возвращать Flow.","Архитектура MVVM: экран (Compose) только рисует состояние и передаёт события, ViewModel держит логику и StateFlow, репозиторий решает, откуда брать данные."],"code":"class SearchViewModel(private val repo: Repo) : ViewModel() {\n    private val query = MutableStateFlow(\"\")\n\n    val results: StateFlow<List<Item>> = query\n        .debounce(300)\n        .map { q -> repo.search(q) }\n        .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())\n\n    fun onQueryChange(q: String) { query.value = q }\n}\n\n@Composable\nfun SearchScreen(vm: SearchViewModel) {\n    val items by vm.results.collectAsStateWithLifecycle()\n    LazyColumn { items(items) { Text(it.title) } }\n}","tips":["Экран не должен ходить в сеть или базу напрямую","Наружу отдавайте StateFlow, а MutableStateFlow держите приватным","debounce экономит запросы при наборе текста"],"q":[{"t":"mc","q":"Что значит «холодный» Flow?","e":"Каждый collect запускает поток заново.","o":["Он начинает выдавать значения только при сборе","Он работает медленно","Он не меняется","Он хранит последнее значение"],"a":0},{"t":"mc","q":"Что отличает StateFlow?","e":"Это держатель состояния.","o":["Он холодный","Всегда имеет текущее значение и сразу отдаёт его подписчикам","Он только для UI-потока","Он не поддерживает map"],"a":1},{"t":"fill","q":"Впишите оператор, который пропускает значения, пока ввод не затихнет 300 мс.","e":"Удобен для поиска по мере ввода.","c":"query.___(300)","ans":["debounce"]},{"t":"mc","q":"Кто в MVVM отвечает за загрузку данных из сети?","e":"Экран только отображает состояние.","o":["Composable-экран","Activity","Репозиторий, вызываемый из ViewModel","Тема приложения"],"a":2}],"run":false}],"exam":[{"t":"out","q":"Что выведет код?","e":"Обе переменные ссылаются на один список.","c":"val list = mutableListOf(1, 2, 3)\nval copy = list\ncopy.add(4)\nprintln(list.size)","ans":["4"]},{"t":"out","q":"Что выведет код?","e":"equals data class учитывает только свойства из основного конструктора.","c":"data class A(val x: Int) { var y = 0 }\nval a1 = A(1).apply { y = 5 }\nval a2 = A(1)\nprintln(a1 == a2)","ans":["true"]},{"t":"out","q":"Что выведет код?","e":"Шаг 3 от 1 до 10 включительно.","c":"println((1..10).step(3).toList())","ans":["[1, 4, 7, 10]"]},{"t":"out","q":"Что выведет код?","e":"Smart cast к String внутри ветки.","c":"val x: Any = \"hi\"\nprintln(when (x) { is Int -> \"int\"; is String -> \"str ${x.leng

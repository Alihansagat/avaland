т поток на другое ядро","Копирует все переменные","Запрещает изменения"],"a":0}]}],"exam":[{"t":"mc","q":"Скомпилируется ли код: <code>let s = String::from(\"a\"); let r1 = &amp;s; let r2 = &amp;mut s;</code>?","e":"Нарушены правила заимствования.","o":["Да","Нет: s не mut, и нельзя брать &amp;mut при живой &amp;","Да, но с предупреждением","Только в release"],"a":1},{"t":"out","q":"Что выведет код?","e":"iter() не забирает вектор.","c":"let v = vec![1, 2, 3];\nlet doubled: Vec<i32> = v.iter().map(|x| x * 2).collect();\nprintln!(\"{:?} {}\", doubled, v.len());","ans":["[2, 4, 6] 3"]},{"t":"out","q":"Что выведет код?","e":"Блок — выражение, внутренний x затеняет внешний только внутри.","c":"let x = 5;\nlet y = { let x = x * 2; x + 1 };\nprintln!(\"{x} {y}\");","ans":["5 11"]},{"t":"out","q":"Что выведет код?","e":"len считает байты UTF-8, chars — символы.","c":"let s = \"привет\";\nprintln!(\"{} {}\", s.len(), s.chars().count());","ans":["12 6"]},{"t":"mc","q":"Что произойдёт при <code>let v: Vec&lt;i32&gt; = vec![]; v[0];</code>?","e":"Rust проверяет границы.","o":["Вернётся 0","Паника в рантайме","Ошибка компиляции","Неопределённое поведение"],"a":1},{"t":"fill","q":"Впишите метод Option, который возвращает значение или вычисляет запасное лениво.","e":"unwrap_or вычислил бы аргумент сразу.","c":"let name = opt.___(|| default_name());","ans":["unwrap_or_else"]},{"t":"out","q":"Что выведет код?","e":"map не применяется к Err.","c":"let r: Result<i32, String> = Err(\"x\".into());\nprintln!(\"{}\", r.map(|v| v + 1).unwrap_or(-1));","ans":["-1"]},{"t":"mc","q":"Почему Rc нельзя передать в другой поток?","e":"Для потоков используется Arc.","o":["Он не реализует Send: счётчик ссылок не атомарный","Он слишком большой","Потоки не поддерживают указатели","Можно, ограничений нет"],"a":0},{"t":"out","q":"Что выведет код?","e":"P реализует Copy, a остаётся доступной.","c":"#[derive(Debug, Clone, Copy, PartialEq)]\nstruct P(i32);\nlet a = P(1);\nlet b = a;\nprintln!(\"{}\", a == b);","ans":["true"]},{"t":"mc","q":"Что такое unsafe в Rust?","e":"Например, разыменование сырых указателей или FFI.","o":["Блок, где программист берёт на себя гарантии, которые компилятор не может проверить","Режим без проверки типов","Отключение всех правил языка","Устаревший синтаксис"],"a":0},{"t":"mc","q":"Что делает <code>impl From&lt;io::Error&gt; for MyError</code>?","e":"? вызывает From::from.","o":["Позволяет оператору ? автоматически превращать io::Error в MyError","Наследует MyError от io::Error","Логирует ошибки","Делает ошибку Copy"],"a":0},{"t":"out","q":"Что выведет код?","e":"Сравнение по длине.","c":"let words = vec![\"a\", \"bb\", \"ccc\"];\nlet longest = words.iter().max_by_key(|w| w.len()).unwrap();\nprintln!(\"{longest}\");","ans":["ccc"]}]},{"id":"swift","name":"Swift","land":"Архипелаг Swift","color":"#d27b4b","about":"Язык Apple. Приложения для iPhone, iPad, Mac и Apple Watch.","project":{"title":"iOS-приложение «Дневник тренировок» на SwiftUI","desc":"Приложение для записи тренировок и просмотра прогресса.","req":["Экраны списка, добавления и детальной статистики с NavigationStack","Хранение через SwiftData","Графики прогресса через Swift Charts","Архитектура MVVM с @Observable моделями","Загрузка упражнений из публичного API через async/await и Codable","Юнит-тесты на XCTest или Swift Testing, скриншоты и видео в README"]},"lessons":[{"t":"Константы, переменные и опционалы","body":["<code>let</code> объявляет константу, <code>var</code> — переменную. Swift советует <code>let</code> везде, где значение не меняется. Тип выводится автоматически, но можно указать явно.","Опционал <code>String?</code> хранит значение или <code>nil</code>. Достать значение безопасно можно через <code>if let</code>, <code>guard let</code> или подставить значение по умолчанию через <code>??</code>.","Принудительное разворачивание <code>!</code> падает при nil — избегайте его. Интерполяция строк: <code>\"Привет, \\(name)\"</code>."],"code":"let name = \"Ада\"\nvar score = 0\nscore += 10\n\nvar nickname: String? = nil\nprint(nickname ?? \"Гость\")             // Гость\n\nfunc greet(_ user: String?) {\n    guard let user else {\n        print(\"Нет пользователя\")\n        return\n    }\n    print(\"Привет, \\(user)\")\n}\n\nif let age = Int(\"36\") {\n    print(age + 1)                      // 37\n}","tips":["guard let выходит из функции рано и оставляет основной код без вложенности","Int(\"abc\") вернёт nil, а не 0","<code>!</code> только когда nil действительно невозможен"],"q":[{"t":"mc","q":"Что вернёт <code>Int(\"12a\")</code>?","e":"Конвертация строки в число возвращает опционал.","o":["12","0","nil","Ошибку компиляции"],"a":2},{"t":"out","q":"Что выведет код?","e":"1 + 5.","c":"let a: Int? = nil\nlet b: Int? = 5\nprint((a ?? 1) + (b ?? 1))","ans":["6"]},{"t":"fill","q":"Впишите конструкцию раннего выхода, если опционал пуст.","e":"После guard переменная доступна до конца функции.","c":"___ let token else { return }","ans":["guard"]},{"t":"mc","q":"Что произойдёт при <code>let x: Int? = nil; print(x!)</code>?","e":"Принудительное разворачивание nil — фатальная ошибка.","o":["Аварийное завершение программы","Выведет nil","Выведет 0","Ошибка компиляции"],"a":0}]},{"t":"Управление потоком и коллекции","body":["<code>for-in</code> перебирает диапазоны (<code>1...5</code> включительно, <code>1..&lt;5</code> без последнего) и коллекции. <code>switch</code> должен быть исчерпывающим и не проваливается в следующий case.","Коллекции: <code>Array</code>, <code>Set</code>, <code>Dictionary</code>. Они значимые типы: присваивание копирует (оптимизировано через copy-on-write).","Функции высшего порядка: <code>map</code>, <code>filter</code>, <code>reduce</code>, <code>compactMap</code> (убирает nil), <code>sorted(by:)</code>."],"code":"for i in 1...3 { print(i) }\n\nlet scores = [\"Ада\": 90, \"Алан\": 72]\nfor (name, score) in scores.sorted(by: { $0.value > $1.value }) {\n    print(name, score)\n}\n\nlet raw = [\"1\", \"x\", \"3\"]\nlet numbers = raw.compactMap { Int($0) }            // [1, 3]\nlet total = numbers.reduce(0, +)                    // 4\n\nlet grade = switch total {\n    case 0..<3: \"low\"\n    case 3...10: \"mid\"\n    default: \"high\"\n}\nprint(grade)                                        // mid","tips":["Словарь не упорядочен — сортируйте перед выводом","compactMap удобно отбрасывает неудачные преобразования","Массив копируется при присваивании, в отличие от NSArray"],"q":[{"t":"out","q":"Что выведет код?","e":"Массивы — значимые типы.","c":"var a = [1, 2]\nvar b = a\nb.append(3)\nprint(a.count)","ans":["2"]},{"t":"out","q":"Что выведет код?","e":"\"a\" отброшен, 4 + 6.","c":"print([\"4\", \"a\", \"6\"].compactMap { Int($0) }.reduce(0, +))","ans":["10"]},{"t":"fill","q":"Впишите оператор диапазона без верхней границы.","e":"0, 1, 2, 3, 4.","c":"for i in 0___5 { }","ans":["..<"]},{"t":"mc","q":"Должен ли switch в Swift покрывать все значения?","e":"switch исчерпывающий.","o":["Да, иначе нужна ветка default","Нет","Только для enum","Только для строк"],"a":0}]},{"t":"Функции и замыкания","body":["У параметров есть внешние метки для читаемых вызовов: <code>move(from: a, to: b)</code>. <code>_</code> убирает метку. Параметры по умолчанию и variadic <code>Int...</code> поддерживаются.","Замыкание — функция без имени в фигурных скобках. Короткие аргументы <code>$0</code>, <code>$1</code>. Если замыкание — последний аргумент, его пишут после скобок (trailing closure).","Замыкание, которое вызовется позже (после возврата функции), помечается <code>@escaping</code>. Захват <code>self</code> в таких замыканиях может создать цикл ссылок — используйте <code>[weak self]</code>."],"code":"func send(_ text: String, to user: String, urgent: Bool = false) -> String {\n    \"\\(urgent ? \"СРОЧНО: \" : \"\")\\(user) ← \\(text)\"\n}\nprint(send(\"Привет\", to: \"Ада\"))\n\nfunc sum(_ nums: Int...) -> Int { nums.reduce(0, +) }\nprint(sum(1, 2, 3))                       // 6\n\nlet sorted = [\"bb\", \"a\", \"ccc\"].sorted { $0.count < $1.count }\n\nclass Loader {\n    var onDone: (() -> Void)?\n    func load(completion: @escaping (String) -> Void) {\n        DispatchQueue.global().async { completion(\"данные\") }\n    }\n}","tips":["Однострочная функция возвращает выражение без return","[weak self] в escaping-замыканиях предотвращает утечки","Метки аргументов — часть имени функции"],"q":[{"t":"out","q":"Что выведет код?","e":"6 + 5.","c":"func f(_ a: Int, times b: Int = 2) -> Int { a * b }\nprint(f(3) + f(1, times: 5))","ans":["11"]},{"t":"mc","q":"Что значит @escaping?","e":"Например, обработчик завершения сетевого запроса.","o":["Замыкание может быть вызвано после возврата из функции","Замыкание выполняется в фоне","Замыкание нельзя вызвать","Замыкание без параметров"],"a":0},{"t":"fill","q":"Впишите список захвата, чтобы не держать сильную ссылку на self.","e":"Слабая ссылка разрывает цикл.","c":"loader.load { ___ result in self?.show(result) }","ans":["[weak self]"]},{"t":"mc","q":"Что значит <code>_</code> перед именем параметра?","e":"Например, sum(1, 2) вместо sum(nums: 1, 2).","o":["При вызове метка аргумента не пишется","Параметр игнорируется","Параметр приватный","Параметр опциональный"],"a":0}]},{"t":"struct, class и enum","body":["<code>struct</code> — значимый тип: копируется при передаче. Методы, меняющие структуру, помечаются <code>mutating</code>. Apple рекомендует начинать со struct.","<code>class</code> — ссылочный тип с наследованием и подсчётом ссылок (ARC). Используйте класс, когда нужна общая изменяемая сущность или идентичность.","<code>enum</code> с ассоциированными значениями описывает варианты состояния. Через <code>switch</code> их разбирают полностью."],"code":"struct Counter {\n    var value = 0\n    mutating func increment() { value += 1 }\n}\n\nfinal class Session {\n    let user: String\n    init(user: String) { self.user = user }\n}\n\nenum LoadState {\n    case idle\n    case loading\n    case loaded([String])\n    case failed(Error)\n}\n\nfunc describe(_ s: LoadState) -> String {\n    switch s {\n    case .idle: \"Ожидание\"\n    case .loading: \"Загрузка\"\n    case .loaded(let items): \"Загружено: \\(items.count)\"\n    case .failed(let error): \"Ошибка: \\(error.localizedDescription)\"\n    }\n}","tips":["mutating нужен методам struct, которые меняют поля","final запрещает наследование и ускоряет вызовы","enum с данными — лучший способ описать состояние экрана"],"q":[{"t":"out","q":"Что выведет код?","e":"Класс — ссылочный тип.","c":"class Box { var v = 1 }\nlet a = Box()\nlet b = a\nb.v = 9\nprint(a.v)","ans":["9"]},{"t":"fill","q":"Впишите модификатор метода struct, который меняет её поля.","e":"Без него компилятор запретит изменение.","c":"___ func reset() { value = 0 }","ans":["mutating"]},{"t":"mc","q":"Когда лучше выбрать class вместо struct?","e":"В остальных случаях struct проще и безопаснее.","o":["Когда нужна общая изменяемая сущность с идентичностью","Всегда","Для маленьких моделей данных","Для enum"],"a":0},{"t":"mc","q":"Что хранит <code>case loaded([String])</code>?","e":"Ассоциированные значения задаются при создании варианта.","o":["Ассоциированное значение — массив строк","Строку по умолчанию","Сырое значение enum","Ничего"],"a":0}]},{"t":"Протоколы и расширения","body":["Протокол — контракт с требованиями к методам и свойствам. Его реализуют struct, class и enum. Протоколы — основа Swift: <code>Equatable</code>, <code>Hashable</code>, <code>Codable</code>, <code>Identifiable</code>.","<code>extension</code> добавляет методы существующим типам и реализации по умолчанию протоколам. Так строят протокольно-ориентированный код.","<code>some Protocol</code> — непрозрачный тип: функция возвращает конкретный тип, но скрывает его. <code>any Protocol</code> — коробка с любым типом, реализующим протокол."],"code":"protocol Shape {\n    var area: Double { get }\n}\n\nextension Shape {\n    func describe() -> String { \"Площадь \\(area)\" }\n}\n\nstruct Square: Shape { let side: Double; var area: Double { side * side } }\nstruct Circle: Shape { let r: Double; var area: Double { .pi * r * r } }\n\nextension Int {\n    var isEven: Bool { self % 2 == 0 }\n}\n\nlet shapes: [any Shape] = [Square(side: 2), Circle(r: 1)]\nprint(shapes.map { $0.describe() })\nprint(4.isEven)                         // true\n\nstruct User: Codable, Hashable, Identifiable {\n    let id: Int\n    let name: String\n}","tips":["Codable даёт кодирование в JSON без ручного кода","Identifiable нужен спискам в SwiftUI","some — один конкретный тип, any — любой подходящий"],"q":[{"t":"mc","q":"Что добавляет extension?","e":"Хранимые свойства в extension добавить нельзя.","o":["Новую функциональность существующему типу","Наследование","Новое хранимое свойство","Приватность"],"a":0},{"t":"fill","q":"Впишите протокол для кодирования в JSON и обратно.","e":"Codable = Encodable &amp; Decodable.","c":"struct Post: ___ { let title: String }","ans":["Codable"]},{"t":"out","q":"Что выведет код?","e":"Вычисляемое свойство из расширения.","c":"extension String { var shout: String { uppercased() + \"!\" } }\nprint(\"hi\".shout)","ans":["HI!"]},{"t":"mc","q":"Зачем протокол Identifiable в SwiftUI?","e":"ForEach использует id для обновлений.","o":["Чтобы списки могли различать элементы по id","Для сохранения в базу","Для сравнения строк","Для анимаций обязательно"],"a":0}]},{"t":"Ошибки и async/await","body":["Функция, которая может вернуть ошибку, помечается <code>throws</code>. Вызов пишут через <code>try</code> внутри <code>do</code>/<code>catch</code>. <code>try?</code> превращает ошибку в nil.","Асинхронные функции помечаются <code>async</code> и вызываются через <code>await</code>. <code>async let</code> запускает несколько операций параллельно. <code>Task { }</code> запускает асинхронную работу из синхронного кода.","<code>@MainActor</code> гарантирует выполнение на главном потоке — обновлять UI можно только там. Акторы (<code>actor</code>) защищают своё состояние от гонок данных."],"code":"enum APIError: Error { case badStatus(Int) }\n\nstruct Exercise: Decodable { let name: String }\n\nfunc loadExercises() async throws -> [Exercise] {\n    let url = URL(string: \"https://example.com/exercises.json\")!\n    let (data, response) = try await URLSession.shared.data(from: url)\n    guard let http = response as? HTTPURLResponse, http.statusCode == 200 else {\n        throw APIError.badStatus((response as? HTTPURLResponse)?.statusCode ?? 0)\n    }\n    return try JSONDecoder().decode([Exercise].self, from: data)\n}\n\n@MainActor\nfunc refresh() async {\n    async let a = loadExercises()\n    async let b = loadExercises()\n    do {\n        let all = try await a + b\n        print(all.count)\n    } catch {\n        print(\"Ошибка: \\(error)\")\n    }\n}","tips":["Обновление UI — только на MainActor","try? удобен, когда причина ошибки не важна","async let запускает задачи параллельно, обычные await — по очереди"],"q":[{"t":"mc","q":"Как вызвать функцию с throws?","e":"try помечает место возможной ошибки.","o":["Просто по имени","Через try внутри do/catch или в другой throws-функции","Через await","Через catch без try"],"a":1},{"t":"fill","q":"Впишите конструкцию параллельного запуска асинхронной операции.","e":"Результат забирают через await позже.","c":"___ let user = api.loadUser()","ans":["async"]},{"t":"mc","q":"Что вернёт <code>try? JSONDecoder().decode(User.self, from: badData)</code>?","e":"try? превращает ошибку в nil.","o":["nil","Пустой User","Исключение","false"],"a":0},{"t":"mc","q":"Где можно обновлять интерфейс?","e":"Иначе возможны сбои и предупреждения.","o":["Только на главном потоке (MainActor)","В любом потоке","Только в фоне","Только в Task.detached"],"a":0}],"run":false},{"t":"SwiftUI: состояние и архитектура","body":["SwiftUI описывает интерфейс декларативно: <code>View</code> — функция от состояния. Изменилось состояние — SwiftUI сам перерисует нужные части.","<code>@State</code> хранит локальное состояние экрана, <code>@Binding</code> передаёт его дочернему View для изменения. Модели с макросом <code>@Observable</code> отслеживаются автоматически. <code>@Environment</code> даёт доступ к общим значениям.","MVVM: View отображает состояние модели и передаёт действия, модель содержит логику и ходит в сеть или базу. Навигация через <code>NavigationStack</code>, списки — <code>List</code> и <code>ForEach</code>."],"code":"import SwiftUI\n\n@Observable\nfinal class WorkoutsModel {\n    var items: [String] = []\n    var isLoading = false\n    func add(_ name: String) { items.append(name) }\n}\n\nstruct WorkoutsView: View {\n    @State private var model = WorkoutsModel()\n    @State private var newName = \"\"\n\n    var body: some View {\n        NavigationStack {\n            List {\n                ForEach(model.items, id: \\.self) { Text($0) }\n            }\n            .navigationTitle(\"Тренировки\")\n            .toolbar {\n                TextField(\"Новая\", text: $newName)\n                Button(\"Добавить\") { model.add(newName); newName = \"\" }\n            }\n        }\n    }\n}","tips":["<code>$value</code> передаёт Binding — двустороннюю связь","Не держите сетевую логику прямо во View","body пересчитывается часто — он должен быть быстрым и без побочных эффектов"],"q":[{"t":"mc","q":"Что делает @State?","e":"Владеет состоянием конкретный View.","o":["Хранит изменяемое состояние, при изменении которого View перерисуется","Делает свойство константой","Сохраняет данные на диск","Создаёт глобальную переменную"],"a":0},{"t":"fill","q":"Впишите префикс, который передаёт Binding к @State-свойству.","e":"$name — проекция Binding.","c":"TextField(\"Имя\", text: ___name)","ans":["$"]},{"t":"mc","q":"Что значит <code>some View</code> в <code>var body: some View</code>?","e":"Непрозрачный тип.","o":["Конкретный тип View, скрытый от вызывающего","Любой View, определяемый в рантайме","Опциональный View","Массив View"],"a":0},{"t":"mc","q":"Где по MVVM должна быть загрузка данных из сети?","e":"View только отображает состояние.","o":["В body","В модели (ViewModel), которую вызывает View","В AppDelegate","В расширении View"],"a":1}],"run":false},{"t":"ARC, память и сборка в Xcode","body":["Swift управляет памятью через ARC — автоматический подсчёт ссылок. Объект класса освобождается, когда на него не осталось сильных ссылок. Сборщика мусора нет.","Цикл сильных ссылок (A держит B, B держит A) не освободится никогда — это утечка. Разрывают его через <code>weak</code> (опциональная, обнуляется) или <code>unowned</code> (не опциональная, объект должен жить дольше).","Приложение собирают в Xcode. Зависимости подключают через Swift Package Manager. Для публикации нужны аккаунт Apple Developer, подпись, архив (Product → Archive) и загрузка в App Store Connect. Тестируют через TestFlight."],"code":"final class Person {\n    let name: String\n    var apartment: Apartment?\n    init(name: String) { self.name = name }\n    deinit { print(\"\\(name) освобождён\") }\n}\n\nfinal class Apartment {\n    weak var tenant: Person?            // слабая ссылка разрывает цикл\n}\n\nvar p: Person? = Person(name: \"Ада\")\nlet flat = Apartment()\np?.apartment = flat\nflat.tenant = p\np = nil                                 // \"Ада освобождён\"","tips":["Делегаты почти всегда объявляют weak","deinit помогает проверить, что объект освобождается","Instruments → Leaks находит утечки"],"q":[{"t":"mc","q":"Как Swift управляет памятью объектов классов?","e":"Объект освобождается при нулевом счётчике.","o":["Сборщиком мусора","Автоматическим подсчётом ссылок (ARC)","Вручную через free","Не управляет"],"a":1},{"t":"fill","q":"Впишите модификатор ссылки, который разрывает цикл и становится nil.","e":"unowned не становится nil.","c":"___ var delegate: Delegate?","ans":["weak"]},{"t":"mc","q":"Что вызовет утечку памяти?","e":"ARC не освобождает циклы.","o":["Два объекта держат сильные ссылки друг на друга","Использование struct","Использование let","Опционалы"],"a":0},{"t":"mc","q":"Через что раздают бета-версию iOS-приложения тестировщикам?","e":"TestFlight входит в App Store Connect.","o":["App Store","TestFlight","GitHub","Xcode Cloud только"],"a":1}]}],"exam":[{"t":"out","q":"Что выведет код?","e":"struct копируется.","c":"struct P { var x = 0 }\nvar a = P()\nvar b = a\nb.x = 5\nprint(a.x, b.x)","ans":["0 5"]},{"t":"out","q":"Что выведет код?","e":"sorted возвращает новый массив.","c":"let nums = [3, 1, 2]\nprint(nums.sorted().first!, nums.first!)","ans":["1 3"]},{"t":"out","q":"Что выведет код?","e":"map у опционала применяется к значению.","c":"var s: String? = \"swift\"\nprint(s?.count ?? 0, s.map { $0.uppercased() } ?? \"\")","ans":["5 SWIFT"]},{"t":"mc","q":"Чем <code>unowned</code> отличается от <code>weak</code>?","e":"Используйте unowned, если объект точно живёт дольше.","o":["unowned не опционален и не обнуляется — обращение после освобождения вызовет сбой","unowned сильнее weak","weak работает только со struct","Ничем"],"a":0},{"t":"out","q":"Что выведет код?","e":"Замыкание захватывает переменную по ссылке.","c":"var counter = 0\nlet inc = { counter += 1 }\ninc(); inc()\nprint(counter)","ans":["2"]},{"t":"mc","q":"Что такое actor?","e":"Обращения к actor извне идут через await.","o":["Ссылочный тип, который защищает своё состояние от одновременного доступа","Вид struct","Поток выполнения","Протокол для UI"],"a":0},{"t":"fill","q":"Впишите ключевое слово для свойства, вычисляемого при первом обращении.","e":"lazy var создаётся при первом использовании.","c":"___ var formatter = DateFormatter()","ans":["lazy"]},{"t":"out","q":"Что выведет код?","e":"Инициализатор по rawValue возвращает опционал.","c":"enum Dir: String { case north = \"N\", south = \"S\" }\nprint(Dir(rawValue: \"S\") == .south, Dir(rawValue: \"X\") == nil)","ans":["true true"]},{"t":"mc","q":"Чем <code>some View</code> отличается от <code>any View</code>-подобной коробки?","e":"Непрозрачные типы эффективнее.","o":["some сохраняет конкретный тип для компилятора, any стирает его","Ничем","some медленнее","any нельзя вернуть из функции"],"a":0},{"t":"out","q":"Что выведет код?","e":"Уникальных слов два, \"a\" встречается дважды.","c":"let words = [\"a\", \"bb\", \"a\"]\nprint(Set(words).count, Dictionary(grouping: words, by: { $0 })[\"a\"]!.count)","ans":["2 2"]},{"t":"mc","q":"Что делает defer в Swift?","e":"Удобно для освобождения ресурсов.","o":["Выполняет блок при выходе из текущей области видимости","Откладывает вызов функции на следующий кадр","Запускает асинхронную задачу","Ловит ошибки"],"a":0},{"t":"mc","q":"Какой модификатор доступа видимости по умолчанию?","e":"internal виден внутри модуля.","o":["public","private","internal","open"],"a":2}]},{"id":"dart","name":"Dart","land":"Флаттер-бухта","color":"#2f9ad6","about":"Язык Flutter. Одно приложение для iOS, Android, веба и десктопа.","project":{"title":"Flutter-приложение «Курсы валют»","desc":"Кроссплатформенное приложение с актуальными курсами и конвертером.","req":["Загрузка курсов из публичного API через пакет http, модели с fromJson","Состояние через Riverpod или Bloc, экраны загрузки, ошибки и пустого списка","Кэширование последних курсов в shared_preferences для офлайн-режима","Конвертер валют с валидацией ввода","Виджет-тесты и юнит-тесты логики конвертации","Сборка под Android и iOS, скриншоты и инструкция в README"]},"lessons":[{"t":"Переменные, типы и null safety","body":["<code>var</code> выводит тип, <code>final</code> задаёт значение один раз во время выполнения, <code>const</code> — константа времени компиляции. Предпочитайте final и const.","Dart имеет строгую null-безопасность: тип <code>String</code> не может быть null, <code>String?</code> — может. Операторы <code>?.</code>, <code>??</code> и <code>??=</code> работают с nullable значениями, <code>!</code> утверждает «здесь не null».","Строковая интерполяция: <code>'$name'</code> или <code>'${user.name}'</code>. Целочисленное деление — оператор <code>~/</code>."],"code":"void main() {\n  final name = 'Ада';\n  const pi = 3.14;\n  var score = 10;\n  score += 5;\n\n  String? nickname;\n  print(nickname ?? 'Гость');        // Гость\n  nickname ??= 'ada';                // присвоить, если null\n  print('$name: ${score * 2}, ${nickname.length}');\n  print(7 ~/ 2);                     // 3\n  print(7 / 2);                      // 3.5\n}","tips":["final — значение известно при запуске, const — при компиляции","<code>/</code> всегда даёт double, для целого деления <code>~/</code>","late откладывает инициализацию non-null переменной"],"q":[{"t":"out","q":"Что выведет код?","e":"9 ~/ 4 = 2, 9 % 4 = 1.","c":"print(9 ~/ 4 + 9 % 4);","ans":["3"]},{"t":"mc","q":"Чем const отличается от final?","e":"DateTime.now() можно сохранить в final, но не в const.","o":["const вычисляется при компиляции, final — один раз во время выполнения","Ничем","final быстрее","const можно менять"],"a":0},{"t":"fill","q":"Впишите оператор «присвоить, только если сейчас null».","e":"Если cache уже не null, ничего не произойдёт.","c":"cache ___ loadDefault();","ans":["??="]},{"t":"out","q":"Что выведет код?","e":"s равно null.","c":"String? s;\nprint(s?.length ?? -1);","ans":["-1"]}]},{"t":"Функции и коллекции","body":["Функции могут иметь именованные параметры в фигурных скобках <code>{required String name, int age = 0}</code> и необязательные позиционные в квадратных. Короткая функция пишется через <code>=&gt;</code>.","Коллекции: <code>List</code>, <code>Set</code>, <code>Map</code>. Методы <code>map</code>, <code>where</code>, <code>fold</code>, <code>any</code>, <code>firstWhere</code> работают с Iterable и ленивы, пока не вызван <code>toList()</code>.","Collection if и for позволяют строить списки прямо в литерале — это часто используется при построении виджетов. Spread <code>...</code> вставляет элементы другого списка."],"code":"String greet({required String name, String greeting = 'Привет'}) =>\n    '$greeting, $name!';\n\nvoid main() {\n  print(greet(name: 'Ада'));\n\n  final nums = [1, 2, 3, 4, 5];\n  final evens = nums.where((n) => n.isEven).map((n) => n * 10).toList();\n  final sum = nums.fold(0, (a, b) => a + b);\n\n  final isAdmin = true;\n  final menu = ['Главная', if (isAdmin) 'Админка', for (var i in [1, 2]) 'Пункт $i'];\n  final ages = {'Ада': 36, 'Алан': 41};\n\n  print('$evens $sum $menu ${ages['Ада']}');\n  // [20, 40] 15 [Главная, Админка, Пункт 1, Пункт 2] 36\n}","tips":["required делает именованный параметр обязательным","where и map возвращают ленивый Iterable — добавьте toList()","map[key] вернёт null для отсутствующего ключа"],"q":[{"t":"out","q":"Что выведет код?","e":"Квадраты элементов.","c":"print([1, 2, 3].map((x) => x * x).toList());","ans":["[1, 4, 9]"]},{"t":"fill","q":"Впишите слово, делающее именованный параметр обязательным.","e":"Без значения по умолчанию non-null параметр должен быть required.","c":"void create({___ String title}) {}","ans":["required"]},{"t":"out","q":"Что выведет код?","e":"Элемент 'b' не добавлен.","c":"final show = false;\nprint(['a', if (show) 'b', 'c'].length);","ans":["2"]},{"t":"mc","q":"Что вернёт <code>[1, 2, 3].where((x) =&gt; x &gt; 1)</code> без toList()?","e":"Вычисляется при переборе.","o":["Ленивый Iterable","List","Set","bool"],"a":0}]},{"t":"Классы и конструкторы","body":["Классы в Dart лаконичны: <code>User(this.name, this.age)</code> присваивает поля прямо из параметров. Именованные конструкторы <code>User.guest()</code> создают объекты по-разному. <code>factory</code> может вернуть уже существующий объект или подкласс.","Поля с <code>final</code> делают объект неизменяемым — так пишут модели данных. Метод <code>copyWith</code> возвращает копию с изменёнными полями.","<code>extends</code> наследует, <code>implements</code> реализует интерфейс (любой класс может быть интерфейсом), <code>with</code> подмешивает mixin."],"code":"class User {\n  final String name;\n  final int age;\n  const User(this.name, this.age);\n\n  User.guest() : name = 'Гость', age = 0;\n\n  factory User.fromJson(Map<String, dynamic> json) =>\n      User(json['name'] as String, json['age'] as int);\n\n  User copyWith({String? name, int? age}) =>\n      User(name ?? this.name, age ?? this.age);\n\n  @override\n  String toString() => 'User($name, $age)';\n}\n\nmixin Logger { void log(String m) => print('[LOG] $m'); }\nclass Service with Logger { void run() => log('запуск'); }","tips":["Модели делайте неизменяемыми: final поля и copyWith","fromJson обычно factory-конструктор","Для генерации ==, copyWith и JSON используют freezed и json_serializable"],"q":[{"t":"mc","q":"Что делает конструктор <code>User(this.name, this.age)</code>?","e":"Это синтаксический сахар.","o":["Присваивает параметры полям name и age","Создаёт статические поля","Вызывает родительский конструктор","Ничего"],"a":0},{"t":"fill","q":"Впишите тип конструктора, который может вернуть существующий объект.","e":"Обычный конструктор всегда создаёт новый объект.","c":"___ Config.instance() => _cache;","ans":["factory"]},{"t":"mc","q":"Как подмешать mixin к классу?","e":"class A with Logger.","o":["extends","implements","with","mixin"],"a":2},{"t":"out","q":"Что выведет код?","e":"Константы с одинаковыми значениями канонизируются в один объект.","c":"class P { final int x; const P(this.x); }\nprint(identical(const P(1), const P(1)));","ans":["true"]}]},{"t":"Records, pattern matching и sealed","body":["Dart 3 добавил records — лёгкие неизменяемые кортежи: <code>(String, int)</code> или с именованными полями <code>({String name, int age})</code>. Функция может вернуть сразу несколько значений.","Pattern matching работает в <code>switch</code>, <code>if-case</code> и при деструктуризации: <code>var (name, age) = person;</code>. Switch-выражение возвращает значение и проверяет полноту.","<code>sealed class</code> закрывает набор наследников внутри файла. Switch по sealed-типу без default компилятор проверит на полноту — идеально для состояний экрана."],"code":"(String, int) parse(String line) {\n  final parts = line.split(':');\n  return (parts[0], int.parse(parts[1]));\n}\n\nsealed class LoadState {}\nclass Loading extends LoadState {}\nclass Loaded extends LoadState { final List<String> items; Loaded(this.items); }\nclass Failed extends LoadState { final String message; Failed(this.message); }\n\nString render(LoadState s) => switch (s) {\n  Loading() => 'Загрузка…',\n  Loaded(:final items) when items.isEmpty => 'Пусто',\n  Loaded(:final items) => 'Элементов: ${items.length}',\n  Failed(:final message) => 'Ошибка: $message',\n};\n\nvoid main() {\n  final (name, score) = parse('Ада:90');\n  print('$name $score ${render(Loaded(['a']))}');   // Ада 90 Элементов: 1\n}","tips":["Records сравниваются по значению","sealed + switch без default ловит забытые состояния","when в шаблоне добавляет условие"],"q":[{"t":"out","q":"Что выведет код?","e":"Позиционные поля доступны как $1, $2, именованные — по имени.","c":"final r = (1, b: 'x');\nprint('${r.$1}${r.b}');","ans":["1x"]},{"t":"mc","q":"Что даёт sealed class?","e":"Наследники объявляются в том же файле.","o":["Закрытый набор наследников и проверку полноты switch","Запрет на создание объектов","Неизменяемость полей","Автоматический toString"],"a":0},{"t":"fill","q":"Впишите ключевое слово условия внутри шаблона switch.","e":"Охранное условие.","c":"case int n ___ n > 0:","ans":["when"]},{"t":"out","q":"Что выведет код?","e":"Records сравниваются по значению.","c":"print((1, 2) == (1, 2));","ans":["true"]}]},{"t":"Асинхронность: Future и Stream","body":["<code>Future&lt;T&gt;</code> — результат, который появится позже. Функция <code>async</code> возвращает Future, а <code>await</code> ждёт его. Ошибки ловят обычным try/catch.","<code>Future.wait</code> запускает несколько операций параллельно. Dart однопоточный с event loop; тяжёлые вычисления выносят в изолят (<code>Isolate.run</code>), чтобы не тормозил интерфейс.","<code>Stream&lt;T&gt;</code> — последовательность значений во времени: события, сообщения чата, изменения базы. Подписываются через <code>listen</code> или <code>await for</code>."],"code":"Future<String> loadUser() async {\n  await Future.delayed(const Duration(milliseconds: 300));\n  return 'Ада';\n}\n\nFuture<void> main() async {\n  try {\n    final results = await Future.wait([loadUser(), loadUser()]);\n    print(results);                       // [Ада, Ада]\n  } catch (e) {\n    print('Ошибка: $e');\n  }\n\n  final ticks = Stream.periodic(const Duration(seconds: 1), (i) => i).take(3);\n  await for (final t in ticks) {\n    print('Тик $t');\n  }\n}","tips":["Забытый await — частая ошибка: операция не дождётся","Future.wait быстрее последовательных await для независимых задач","Isolate.run для парсинга больших JSON"],"q":[{"t":"mc","q":"Что вернёт функция <code>async</code>, если в ней <code>return 5</code>?","e":"async оборачивает результат в Future.","o":["5","Future&lt;int&gt;","Stream&lt;int&gt;","void"],"a":1},{"t":"fill","q":"Впишите метод запуска нескольких Future параллельно.","e":"Результаты придут списком.","c":"final r = await Future.___([a(), b()]);","ans":["wait"]},{"t":"mc","q":"Зачем изолят во Flutter?","e":"Изоляты не делят память и общаются сообщениями.","o":["Чтобы тяжёлые вычисления не блокировали интерфейс","Для сетевых запросов обязательно","Для хранения данных","Для анимаций"],"a":0},{"t":"out","q":"Что выведет код?","e":"await null уступает очереди микрозадач, а Future() — это событие в обычной очереди, оно выполнится позже.","c":"Future<void> main() async {\n  print('A');\n  Future(() => print('B'));\n  await null;\n  print('C');\n}","ans":["A C B"]}]},{"t":"Виджеты Flutter","body":["Во Flutter всё — виджеты. <code>StatelessWidget</code> рисует интерфейс по параметрам, <code>StatefulWidget</code> хранит состояние в объекте <code>State</code>, а <code>setState</code> запрашивает перерисовку.","Раскладка строится из вложенных виджетов: <code>Column</code>, <code>Row</code>, <code>Stack</code>, <code>Padding</code>, <code>Expanded</code>, <code>ListView.builder</code> для длинных списков.","Метод <code>build</code> вызывается часто, поэтому он должен быть быстрым и без побочных эффектов. Используйте <code>const</code> конструкторы — Flutter не будет пересоздавать такие виджеты."],"code":"import 'package:flutter/material.dart';\n\nclass Counter extends StatefulWidget {\n  const Counter({super.key});\n  @override\n  State<Counter> createState() => _CounterState();\n}\n\nclass _CounterState extends State<Counter> {\n  int _count = 0;\n\n  @override\n  Widget build(BuildContext context) {\n    return Column(\n      mainAxisAlignment: MainAxisAlignment.center,\n      children: [\n        Text('Нажатий: $_count', style: Theme.of(context).textTheme.headlineSmall),\n        const SizedBox(height: 12),\n        FilledButton(\n          onPressed: () => setState(() => _count++),\n          child: const Text('Ещё'),\n        ),\n      ],\n    );\n  }\n}","tips":["ListView.builder строит только видимые элементы","const виджеты экономят перерисовки","Не вызывайте сетевые запросы в build"],"q":[{"t":"mc","q":"Что делает setState?","e":"Изменения внутри колбэка, затем build.","o":["Сообщает Flutter, что состояние изменилось и виджет нужно перерисовать","Сохраняет состояние на диск","Создаёт новый виджет","Отправляет событие на сервер"],"a":0},{"t":"fill","q":"Впишите виджет для вертикального расположения детей.","e":"Row — горизонтально.","c":"___(children: [Text('a'), Text('b')])","ans":["Column"]},{"t":"mc","q":"Какой виджет выбрать для списка из 10 000 элементов?","e":"Он создаёт элементы лениво.","o":["ListView.builder","Column внутри SingleChildScrollView","Stack","Wrap"],"a":0},{"t":"mc","q":"Зачем писать const перед виджетом?","e":"Это дешёвая оптимизация.","o":["Flutter переиспользует его без пересоздания при перерисовке","Чтобы он не отображался","Чтобы его нельзя было нажать","Для анимации"],"a":0}],"run":false},{"t":"Состояние и архитектура","body":["Локальное состояние живёт в StatefulWidget, а общее (пользователь, корзина) выносят в менеджер состояния. Популярные решения: Riverpod, Bloc, Provider.","Слои приложения: UI (виджеты) → контроллер/Notifier (логика и состояние) → репозиторий (откуда брать данные) → источники данных (API, база). UI не знает про HTTP.","Состояние экрана описывают явно: загрузка, данные, ошибка. В Riverpod <code>AsyncValue</code> уже содержит эти варианты, а <code>ref.watch</code> перерисовывает виджет при изменении."],"code":"final ratesProvider = FutureProvider<List<Rate>>((ref) async {\n  final repo = ref.watch(ratesRepositoryProvider);\n  return repo.fetchRates();\n});\n\nclass RatesScreen extends ConsumerWidget {\n  const RatesScreen({super.key});\n\n  @override\n  Widget build(BuildContext context, WidgetRef ref) {\n    final rates = ref.watch(ratesProvider);\n    return rates.when(\n      loading: () => const Center(child: CircularProgressIndicator()),\n      error: (e, _) => Center(child: Text('Ошибка: $e')),\n      data: (list) => ListView.builder(\n        itemCount: list.length,\n        itemBuilder: (_, i) => ListTile(title: Text(list[i].code)),\n      ),\n    );\n  }\n}","tips":["Всегда показывайте состояния загрузки и ошибки","Репозиторий позволяет подменить API в тестах","Не храните бизнес-логику в виджетах"],"q":[{"t":"mc","q":"Какие три состояния обычно описывают для экрана с данными из сети?","e":"AsyncValue.when покрывает все три.","o":["Загрузка, данные, ошибка","Создание, удаление, обновление","Светлое, тёмное, системное","Старт, пауза, стоп"],"a":0},{"t":"fill","q":"Впишите метод Riverpod, который подписывает виджет на провайдер.","e":"ref.read читает без подписки.","c":"final user = ref.___(userProvider);","ans":["watch"]},{"t":"mc","q":"Кто в слоистой архитектуре знает про HTTP-запросы?","e":"UI работает с готовыми моделями.","o":["Виджет","Notifier","Репозиторий или источник данных","main.dart"],"a":2},{"t":"mc","q":"Зачем выносить общее состояние из виджетов?","e":"Логика без виджетов легко тестируется.","o":["Чтобы разные экраны использовали одни данные и логику можно было тестировать","Для ускорения анимаций","Так требует Dart","Чтобы уменьшить размер приложения"],"a":0}],"run":false},{"t":"Навигация, сеть и тесты","body":["Навигация: <code>Navigator.push</code> открывает экран, <code>pop</code> закрывает. Для больших приложений используют <code>go_router</code> с маршрутами и deep links.","Сетевые запросы делают пакетами <code>http</code> или <code>dio</code>. JSON разбирают в модели через <code>fromJson</code>. Проверяйте статус ответа и обрабатывайте отсутствие интернета.","Тесты: юнит-тесты логики (<code>test</code>), виджет-тесты (<code>testWidgets</code> с <code>WidgetTester</code>) и интеграционные. Запуск — <code>flutter test</code>. Сборка: <code>flutter build apk</code> и <code>flutter build ipa</code>."],"code":"Future<List<Rate>> fetchRates(http.Client client) async {\n  final res = await client.get(Uri.parse('https://api.example.com/rates'));\n  if (res.statusCode != 200) {\n    throw HttpException('Статус ${res.statusCode}');\n  }\n  final data = jsonDecode(res.body) as List<dynamic>;\n  return data.map((e) => Rate.fromJson(e as Map<String, dynamic>)).toList();\n}\n\ntestWidgets('счётчик увеличивается', (tester) async {\n  await tester.pumpWidget(const MaterialApp(home: Scaffold(body: Counter())));\n  await tester.tap(find.text('Ещё'));\n  await tester.pump();\n  expect(find.text('Нажатий: 1'), findsOneWidget);\n});","tips":["Передавайте http.Client параметром — в тестах подставите мок","pump() перерисовывает кадр после действия","Для iOS-сборки нужен Mac с Xcode"],"q":[{"t":"mc","q":"Что делает <code>tester.pump()</code> в виджет-тесте?","e":"Без него изменения не отрисуются.","o":["Перестраивает кадр после изменения состояния","Запускает приложение на устройстве","Очищает экран","Отправляет HTTP-запрос"],"a":0},{"t":"fill","q":"Впишите функцию разбора строки JSON из dart:convert.","e":"jsonEncode — обратное преобразование.","c":"final data = ___(response.body);","ans":["jsonDecode"]},{"t":"mc","q":"Какая команда запускает тесты Flutter?","e":"flutter doctor проверяет окружение.","o":["flutter test","flutter run --test","dart build test","flutter doctor"],"a":0},{"t":"mc","q":"Зачем передавать http.Client в функцию параметром?","e":"Внедрение зависимостей.","o":["Чтобы в тестах подменить его на мок без сети","Так быстрее","Иначе не скомпилируется","Для кэширования"],"a":0}],"run":false}],"exam":[{"t":"out","q":"Что выведет код?","e":"Списки — ссылочные объекты.","c":"var list = [1, 2, 3];\nvar copy = list;\ncopy.add(4);\nprint(list.length);","ans":["4"]},{"t":"out","q":"Что выведет код?","e":"Spread создал новый список.","c":"final a = [1, 2];\nfinal b = [...a, 3];\nb[0] = 9;\nprint(a);","ans":["[1, 2]"]},{"t":"out","q":"Что выведет код?","e":"Второе присваивание пропущено: x уже не null.","c":"int? x;\nx ??= 5;\nx ??= 7;\nprint(x);","ans":["5"]},{"t":"out","q":"Что выведет код?","e":"Каскад .. вернул сам список после sort.","c":"print([3, 1, 2]..sort());","ans":["[1, 2, 3]"]},{"t":"mc","q":"Что делает каскадный оператор <code>..</code>?","e":"Например, Paint()..color = c..strokeWidth = 2.","o":["Вызывает методы последовательно на одном объекте и возвращает этот объект","Создаёт диапазон","Копирует объект","Делает объект const"],"a":0},{"t":"out","q":"Что выведет код?","e":"Микрозадачи выполняются раньше событий.","c":"void main() async {\n  print('1');\n  Future.microtask(() => print('2'));\n  Future(() => print('3'));\n  print('4');\n}","ans":["1 4 2 3"]},{"t":"fill","q":"Впишите модификатор переменной, которая будет инициализирована позже, но не может быть null.","e":"Обращение до инициализации — ошибка.","c":"___ String token;","ans":["late"]},{"t":"mc","q":"Почему BuildContext нельзя использовать после await без проверки?","e":"Проверка if (!context.mounted) return.","o":["Виджет мог быть удалён, нужно проверить context.mounted","Context становится null всегда","Это запрещено компилятором","Context доступен только в initState"],"a":0},{"t":"out","q":"Что выведет код?","e":"Ключа b нет, подставлена длина map.","c":"final m = {'a': 1};\nprint(m['b'] ?? m.length);","ans":["1"]},{"t":"mc","q":"Где инициализировать контроллер (например TextEditingController)?","e":"В build он создавался бы при каждой перерисовке.","o":["В initState и освобождать в dispose","В build","В конструкторе виджета-родителя","В main"],"a":0},{"t":"mc","q":"Что такое hot reload?","e":"Hot restart сбрасывает состояние.","o":["Подстановка изменённого кода без перезапуска и с сохранением состояния","Перезапуск приложения с нуля","Сборка релиза","Обновление зависимостей"],"a":0},{"t":"out","q":"Что выведет код?","e":"Квадраты 0, 1, 4, 9, нечётные 1 и 9.","c":"print(List.generate(4, (i) => i * i).where((x) => x.isOdd).toList());","ans":["[1, 9]"]}]},{"id":"php","name":"PHP","land":"Республика PHP","color":"#7a86b8","about":"Язык веб-бэкенда. Laravel, WordPress, интернет-магазины и огромное число вакансий.","project":{"title":"Блог-платформа на Laravel","desc":"Многопользовательский блог с панелью автора.","req":["Регистрация и вход, роли автор и администратор (Laravel Breeze, политики доступа)","CRUD постов с загрузкой обложки, тегами и черновиками","Комментарии с модерацией, пагинация и поиск","Миграции, фабрики и сидеры для тестовых данных","Feature-тесты на PHPUnit или Pest для основных сценариев","Развёртывание на хостинге или через Docker (Laravel Sail), README"]},"lessons":[{"t":"Синтаксис, переменные и типы","body":["Код PHP пишут между <code>&lt;?php</code> и <code>?&gt;</code> (в файлах только с кодом закрывающий тег не ставят). Переменные начинаются с <code>$</code>, тип определяется значением.","Современный PHP поддерживает объявление типов: <code>function total(int $qty, float $price): float</code>. Строка <code>declare(strict_types=1);</code> в начале файла запрещает неявное приведение типов в вызовах.","Строки в двойных кавычках подставляют переменные, в одинарных — нет. Конкатенация — точка <code>.</code>. Сравнение <code>===</code> проверяет и значение, и тип."],"code":"<?php\ndeclare(strict_types=1);\n\n$name = 'Ада';\n$age = 36;\necho \"Привет, $name! Через год: \" . ($age + 1) . \"\\n\";\necho 'Без подстановки: $name' . \"\\n\";\n\nfunction total(int $qty, float $price): float {\n    return $qty * $price;\n}\necho total(3, 9.5), \"\\n\";          // 28.5\n\nvar_dump(0 == \"a\");    // false в PHP 8\nvar_dump(\"1\" === 1);   // false\n$city = $user['city'] ?? 'Алматы';","tips":["Всегда используйте === вместо ==","strict_types=1 в каждом файле ловит ошибки типов","Оператор ?? не выдаёт предупреждение на несуществующий ключ"],"q":[{"t":"out","q":"Что выведет код?","e":"В одинарных кавычках подстановки нет.","c":"$x = 5;\necho 'x = $x', \" / \", \"x = $x\";","ans":["x = $x / x = 5"]},{"t":"fill","q":"Впишите оператор конкатенации строк.","e":"Плюс в PHP складывает числа.","c":"echo \"Итого: \" ___ $sum;","ans":["."]},{"t":"mc","q":"Что делает <code>declare(strict_types=1)</code>?","e":"Например, строка \"5\" не превратится в int.","o":["Запрещает неявное приведение скалярных типов при вызове функций","Включает строгий синтаксис","Запрещает глобальные переменные","Ускоряет код"],"a":0},{"t":"out","q":"Что выведет код?","e":"Числовые строки при == сравниваются как числа.","c":"var_dump(\"10\" == \"1e1\", \"10\" === \"1e1\");","ans":["bool(true) bool(false)","bool(true)bool(false)"]}]},{"t":"Массивы и функции","body":["Массив в PHP — упорядоченный словарь: и список <code>[1, 2, 3]</code>, и ассоциативный <code>['name' =&gt; 'Ада']</code>. Перебирают через <code>foreach ($arr as $key =&gt; $value)</code>.","Полезные функции: <code>count</code>, <code>in_array</code>, <code>array_map</code>, <code>array_filter</code>, <code>array_column</code>, <code>usort</code>, <code>array_key_exists</code>. Стрелочные функции <code>fn($x) =&gt; $x * 2</code> захватывают внешние переменные автоматически.","Массивы передаются в функции по значению (копия при изменении). Чтобы изменить исходный массив, нужен <code>&amp;</code>."],"code":"$orders = [\n    ['id' => 1, 'total' => 120, 'paid' => true],\n    ['id' => 2, 'total' => 80,  'paid' => false],\n    ['id' => 3, 'total' => 200, 'paid' => true],\n];\n\n$paid = array_filter($orders, fn($o) => $o['paid']);\n$revenue = array_sum(array_column($paid, 'total'));     // 320\n$ids = array_map(fn($o) => $o['id'], $orders);          // [1, 2, 3]\n\nusort($orders, fn($a, $b) => $b['total'] <=> $a['total']);\necho $orders[0]['id'];                                   // 3\n\nforeach (['a' => 1, 'b' => 2] as $key => $value) {\n    echo \"$key=$value \";\n}","tips":["array_filter сохраняет ключи — для списка вызовите array_values","Оператор <code>&lt;=&gt;</code> (spaceship) удобен для сортировки","usort меняет массив по ссылке и возвращает bool"],"q":[{"t":"out","q":"Что выведет код?","e":"Массивы копируются по значению.","c":"$a = [1, 2, 3];\n$b = $a;\n$b[] = 4;\necho count($a);","ans":["3"]},{"t":"out","q":"Что выведет код?","e":"array_values переиндексирует массив.","c":"print_r(array_values(array_filter([1, 2, 3, 4], fn($x) => $x % 2 === 0)));","ans":["Array ( [0] => 2 [1] => 4 )","Array([0]=>2[1]=>4)"]},{"t":"fill","q":"Впишите оператор сравнения, который возвращает -1, 0 или 1.","e":"Spaceship-оператор.","c":"usort($list, fn($a, $b) => $a ___ $b);","ans":["<=>"]},{"t":"mc","q":"Как изменить массив внутри функции так, чтобы изменения были видны снаружи?","e":"function add(array &amp;$list).","o":["Передать его по ссылке через &amp;","Объявить global внутри","Вернуть void","Никак"],"a":0}]},{"t":"ООП в PHP","body":["Классы поддерживают типизированные свойства, модификаторы <code>public</code>, <code>protected</code>, <code>private</code> и <code>readonly</code>. Промоушен в конструкторе объявляет и заполняет свойства в одной строке.","Интерфейсы задают контракт, абстрактные классы — общую основу, трейты (<code>trait</code>) переиспользуют код в нескольких классах. <code>enum</code> (PHP 8.1) описывает фиксированный набор значений.","Классы загружаются автоматически через автозагрузку Composer по стандарту PSR-4: пространство имён соответствует папке."],"code":"<?php\nnamespace App\\Models;\n\nenum Status: string {\n    case Draft = 'draft';\n    case Published = 'published';\n}\n\ninterface HasSlug { public function slug(): string; }\n\nfinal class Post implements HasSlug {\n    public function __construct(\n        public readonly int $id,\n        public readonly string $title,\n        private Status $status = Status::Draft,\n    ) {}\n\n    public function publish(): void { $this->status = Status::Published; }\n    public function slug(): string {\n        return strtolower(str_replace(' ', '-', $this->title));\n    }\n}\n\n$post = new Post(1, 'Hello World');\necho $post->slug();        // hello-world","tips":["readonly свойства нельзя изменить после инициализации","Пространства имён + PSR-4 = порядок в проекте","enum безопаснее строковых констант"],"q":[{"t":"mc","q":"Что делает промоушен свойств в конструкторе?","e":"Экономит шаблонный код.","o":["Объявляет и присваивает свойства прямо в параметрах конструктора","Делает свойства статическими","Повышает видимость до public","Наследует свойства родителя"],"a":0},{"t":"fill","q":"Впишите модификатор свойства, которое нельзя изменить после создания.","e":"Появился в PHP 8.1.","c":"public ___ string $email;","ans":["readonly"]},{"t":"mc","q":"Что такое trait?","e":"Подключается через use внутри класса.","o":["Набор методов, которые можно подключить в разные классы","Интерфейс","Абстрактный класс","Пространство имён"],"a":0},{"t":"out","q":"Что выведет код?","e":"from находит вариант по значению, name — имя варианта.","c":"enum Size: string { case S = 'small'; case L = 'large'; }\necho Size::from('large')->name;","ans":["L"]}]},{"t":"HTTP, формы и безопасность","body":["PHP получает данные запроса через <code>$_GET</code>, <code>$_POST</code>, <code>$_SERVER</code>, загрузки — через <code>$_FILES</code>. Сессии (<code>session_start()</code>, <code>$_SESSION</code>) хранят данные между запросами.","Любые входные данные — недоверенные. Выводя их в HTML, экранируйте через <code>htmlspecialchars</code>, иначе возможен XSS. Формы защищают CSRF-токеном.","Пароли храните только как хэш: <code>password_hash</code> и <code>password_verify</code>. Никогда не используйте md5 или sha1 для паролей."],"code":"<?php\nsession_start();\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    if (!hash_equals($_SESSION['csrf'] ?? '', $_POST['csrf'] ?? '')) {\n        http_response_code(419);\n        exit('Неверный токен');\n    }\n    $email = filter_input(INPUT_POST, 'email', FILTER_VALIDATE_EMAIL);\n    if ($email === false || $email === null) {\n        exit('Некорректный email');\n    }\n    $hash = password_hash($_POST['password'], PASSWORD_DEFAULT);\n}\n\n$_SESSION['csrf'] ??= bin2hex(random_bytes(32));\n$q = $_GET['q'] ?? '';\necho 'Вы искали: ' . htmlspecialchars($q, ENT_QUOTES, 'UTF-8');","tips":["htmlspecialchars на любой вывод пользовательских данных","password_hash сам добавляет соль","Используйте hash_equals для сравнения токенов"],"q":[{"t":"mc","q":"Чем хранить пароли?","e":"password_hash использует bcrypt или argon2 с солью.","o":["md5","sha1","password_hash","base64_encode"],"a":2},{"t":"fill","q":"Впишите функцию экранирования HTML.","e":"Защищает от XSS.","c":"echo ___($comment, ENT_QUOTES, 'UTF-8');","ans":["htmlspecialchars"]},{"t":"mc","q":"От чего защищает CSRF-токен?","e":"Злоумышленник не знает токен сессии.","o":["От отправки формы с чужого сайта от имени пользователя","От SQL-инъекций","От перебора паролей","От XSS"],"a":0},{"t":"mc","q":"Какая функция проверяет пароль против хэша?","e":"Она извлекает соль из хэша сама.","o":["password_verify","password_check","hash_equals","crypt_compare"],"a":0}]},{"t":"Базы данных и PDO","body":["PDO — единый интерфейс к разным СУБД. Подготовленные запросы (<code>prepare</code> + <code>execute</code>) передают значения отдельно от SQL и полностью защищают от SQL-инъекций.","Включайте режим исключений <code>PDO::ERRMODE_EXCEPTION</code>, чтобы ошибки базы не терялись. Связанные изменения объединяйте в транзакцию.","В Laravel эту работу берут на себя Eloquent ORM и Query Builder, но понимать PDO и SQL всё равно нужно."],"code":"$pdo = new PDO('pgsql:host=localhost;dbname=blog', 'user', 'secret', [\n    PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,\n    PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,\n]);\n\n$stmt = $pdo->prepare('SELECT id, title FROM posts WHERE author_id = :author AND status = :status');\n$stmt->execute(['author' => $authorId, 'status' => 'published']);\n$posts = $stmt->fetchAll();\n\n$pdo->beginTransaction();\ntry {\n    $pdo->prepare('UPDATE accounts SET balance = balance - ? WHERE id = ?')->execute([100, 1]);\n    $pdo->prepare('UPDATE accounts SET balance = balance + ? WHERE id = ?')->execute([100, 2]);\n    $pdo->commit();\n} catch (Throwable $e) {\n    $pdo->rollBack();\n    throw $e;\n}","tips":["Никогда не вставляйте переменные в SQL через конкатенацию","ERRMODE_EXCEPTION — обязательная настройка","При ошибке в транзакции вызывайте rollBack"],"q":[{"t":"mc","q":"Что защищает от SQL-инъекций в PDO?","e":"Значения передаются отдельно от SQL.","o":["Подготовленные запросы с параметрами","addslashes","Проверка длины строки","Режим FETCH_ASSOC"],"a":0},{"t":"fill","q":"Впишите метод PDO для подготовки запроса.","e":"Затем execute с параметрами.","c":"$stmt = $pdo->___('SELECT * FROM users WHERE id = ?');","ans":["prepare"]},{"t":"mc","q":"Что делает PDO::FETCH_ASSOC?","e":"Ключи — имена столбцов.","o":["Возвращает строки как ассоциативные массивы по именам столбцов","Возвращает объекты","Возвращает только первый столбец","Кэширует запрос"],"a":0},{"t":"mc","q":"Что вызвать при исключении внутри транзакции?","e":"Изменения транзакции отменятся.","o":["rollBack()","commit()","close()","Ничего"],"a":0}],"run":false},{"t":"Composer и экосистема","body":["Composer — менеджер зависимостей PHP. <code>composer require vendor/package</code> добавляет пакет, <code>composer.json</code> описывает зависимости, <code>composer.lock</code> фиксирует точные версии.","Автозагрузка PSR-4 подключает классы по пространствам имён без ручных require. Стандарты PSR описывают стиль кода (PSR-12), логирование, HTTP-сообщения.","Инструменты качества: PHPStan или Psalm для статического анализа, PHP-CS-Fixer для стиля, PHPUnit или Pest для тестов."],"code":"// composer.json\n// {\n//   \"require\": { \"php\": \"^8.3\", \"guzzlehttp/guzzle\": \"^7.8\" },\n//   \"require-dev\": { \"phpunit/phpunit\": \"^11.0\" },\n//   \"autoload\": { \"psr-4\": { \"App\\\\\": \"src/\" } }\n// }\n\nrequire __DIR__ . '/vendor/autoload.php';\n\nuse App\\Services\\Weather;\nuse GuzzleHttp\\Client;\n\n$weather = new Weather(new Client(['timeout' => 5]));\necho $weather->today('Almaty');\n\n// composer install          — поставить по lock-файлу\n// vendor/bin/phpunit        — тесты\n// vendor/bin/phpstan analyse src --level=8","tips":["composer.lock коммитят в репозиторий приложения","Папку vendor/ не коммитят","PHPStan на высоком уровне ловит баги до запуска"],"q":[{"t":"mc","q":"Зачем composer.lock?","e":"composer install ставит версии из lock.","o":["Фиксирует точные версии зависимостей для одинаковой установки у всех","Хранит пароли","Ускоряет PHP","Заменяет composer.json"],"a":0},{"t":"fill","q":"Впишите стандарт автозагрузки по пространствам имён.","e":"PSR-4.","c":"\"autoload\": { \"psr-___\": { \"App\\\\\": \"src/\" } }","ans":["4"]},{"t":"mc","q":"Что не нужно коммитить в Git?","e":"Зависимости ставятся из lock-файла.","o":["vendor/","composer.json","composer.lock","src/"],"a":0},{"t":"mc","q":"Что делает PHPStan?","e":"Уровни строгости от 0 до максимального.","o":["Статически анализирует код и находит ошибки типов без запуска","Запускает тесты","Форматирует код","Устанавливает пакеты"],"a":0}],"run":false},{"t":"Laravel: основы фреймворка","body":["Laravel — самый популярный PHP-фреймворк. Маршруты в <code>routes/web.php</code> и <code>routes/api.php</code> ведут к контроллерам. Шаблоны пишут на Blade, данные — через Eloquent ORM.","Миграции описывают схему базы в коде, <code>php artisan migrate</code> применяет их. Валидация запросов — <code>$request-&gt;validate([...])</code> или Form Request классы.","Middleware обрабатывает запрос до контроллера: <code>auth</code> проверяет вход. Очереди (<code>dispatch</code>) выносят долгие задачи, например отправку писем, в фон."],"code":"// routes/web.php\nRoute::middleware('auth')->group(function () {\n    Route::resource('posts', PostController::class);\n});\n\n// app/Http/Controllers/PostController.php\npublic function store(Request $request)\n{\n    $data = $request->validate([\n        'title' => ['required', 'string', 'max:200'],\n        'body'  => ['required', 'string'],\n    ]);\n    $post = $request->user()->posts()->create($data);\n    return redirect()->route('posts.show', $post);\n}\n\n// Eloquent\n$latest = Post::with('author')->where('status', 'published')->latest()->paginate(10);\n\n// php artisan make:model Post -mcr\n// php artisan migrate","tips":["with() подгружает связи одним запросом и решает N+1","Поля для массового заполнения перечисляют в $fillable","Секреты держат в .env, его не коммитят"],"q":[{"t":"mc","q":"Что решает <code>Post::with('author')</code>?","e":"Это жадная загрузка связей.","o":["Проблему N+1, загружая авторов одним дополнительным запросом","Создаёт автора","Фильтрует посты по автору","Кэширует посты"],"a":0},{"t":"fill","q":"Впишите команду применения миграций.","e":"Откат — migrate:rollback.","c":"// php artisan ___","ans":["migrate"]},{"t":"mc","q":"Где хранить пароль от базы в Laravel?","e":"config читает значения через env().","o":["В файле .env, который не попадает в Git","В routes/web.php","В контроллере","В README"],"a":0},{"t":"mc","q":"Что делает middleware auth?","e":"Остальных перенаправляет на вход.","o":["Пропускает к маршруту только вошедших пользователей","Шифрует запрос","Логирует запрос","Кэширует ответ"],"a":0}],"run":false},{"t":"Тестирование и деплой","body":["Тесты бывают юнит (одна функция или класс) и feature (HTTP-запрос через всё приложение). В Laravel feature-тест отправляет запрос и проверяет ответ и базу.","Для тестов используют отдельную базу и <code>RefreshDatabase</code>, а данные создают фабриками. Внешние сервисы подменяют фейками: <code>Mail::fake()</code>, <code>Http::fake()</code>.","Деплой: <code>composer install --no-dev --optimize-autoloader</code>, <code>php artisan migrate --force</code>, кэширование конфигурации и маршрутов. Ошибки в продакшене не показывают пользователю: <code>APP_DEBUG=false</code>."],"code":"use Illuminate\\Foundation\\Testing\\RefreshDatabase;\n\nclass PostTest extends TestCase\n{\n    use RefreshDatabase;\n\n    public function test_author_can_create_post(): void\n    {\n        $user = User::factory()->create();\n\n        $response = $this->actingAs($user)->post('/posts', [\n            'title' => 'Первый пост',\n            'body'  => 'Текст',\n        ]);\n\n        $response->assertRedirect();\n        $this->assertDatabaseHas('posts', ['title' => 'Первый пост']);\n    }\n\n    public function test_guest_is_redirected(): void\n    {\n        $this->post('/posts', [])->assertRedirect('/login');\n    }\n}","tips":["APP_DEBUG=true в продакшене раскроет секреты","Фабрики делают тестовые данные короткими и читаемыми","Тестируйте и успешные, и запрещённые сценарии"],"q":[{"t":"mc","q":"Что проверяет feature-тест в Laravel?","e":"Он ближе к реальному использованию.","o":["Работу маршрута целиком: запрос, контроллер, база, ответ","Только одну функцию","Скорость сервера","Вёрстку страницы"],"a":0},{"t":"fill","q":"Впишите трейт, который пересоздаёт базу для каждого теста.","e":"Тесты не влияют друг на друга.","c":"use ___;","ans":["RefreshDatabase"]},{"t":"mc","q":"Какое значение APP_DEBUG должно быть в продакшене?","e":"Иначе пользователь увидит стек ошибок и конфигурацию.","o":["false","true","1","debug"],"a":0},{"t":"mc","q":"Как в тесте не отправлять настоящие письма?","e":"Фейк записывает отправленные письма для проверок.","o":["Mail::fake()","Отключить интернет","Удалить почтовый класс","APP_ENV=mail"],"a":0}],"run":false}],"exam":[{"t":"out","q":"Что выведет код?","e":"$b — ссылка на тот же массив.","c":"$a = ['x' => 1];\n$b = &$a;\n$b['x'] = 2;\necho $a['x'];","ans":["2"]},{"t":"out","q":"Что выведет код?","e":"intdiv даёт 3, остаток 1, деление 3.5.","c":"echo intdiv(7, 2), 7 % 2, 7 / 2;","ans":["313.5"]},{"t":"out","q":"Что выведет код?","e":"Длина 3, первая буква в верхнем регистре, два дефиса.","c":"$s = 'abc';\necho strlen($s) . strtoupper($s[0]) . str_repeat('-', 2);","ans":["3A--"]},{"t":"out","q":"Что выведет код?","e":"?? проверяет только null, false — не null.","c":"var_dump(null ?? false ?? 'x');","ans":["bool(false)"]},{"t":"out","q":"Что выведет код?","e":"Новый ключ — максимальный числовой плюс один.","c":"$arr = [3 => 'a'];\n$arr[] = 'b';\necho implode(',', array_keys($arr));","ans":["3,4"]},{"t":"mc","q":"Что вернёт <code>array_search('1', [0, 1, 2])</code>?","e":"Нестрогое сравнение находит 1 по индексу 1.","o":["'1'","1","true","false"],"a":1},{"t":"fill","q":"Впишите функцию, превращающую массив в JSON.","e":"json_decode — обратное преобразование.","c":"echo ___(['a' => 1]);","ans":["json_encode"]},{"t":"mc","q":"Чем <code>include</code> отличается от <code>require</code> при отсутствии файла?","e":"Для обязательных файлов используйте require_once.","o":["include выдаст предупреждение и продолжит, require — фатальную ошибку","Ничем","require выдаст предупреждение","include не работает с путями"],"a":0},{"t":"out","q":"Что выведет код?","e":"Variadic-параметр собирает аргументы в массив.","c":"function f(int ...$n): int { return array_sum($n); }\necho f(1, 2, 3);","ans":["6"]},{"t":"mc","q":"Что вернёт <code>match(true) { 5 &gt; 3 =&gt; 'a', default =&gt; 'b' }</code>?","e":"match сравнивает строго и возвращает первое совпадение.","o":["'a'","'b'","true","Ошибку"],"a":0},{"t":"mc","q":"Где в Laravel логично проверять, может ли пользователь редактировать пост?","e":"Правила доступа держат в одном месте.","o":["В политике (Policy) через authorize","В Blade-шаблоне","В миграции","В .env"],"a":0},{"t":"out","q":"Что выведет код?","e":"Приведение берёт ведущие цифры.","c":"$x = '5 apples';\nvar_dump((int) $x);","ans":["int(5)"]}]},{"id":"rb","name":"Ruby","land":"Рубиновые острова","color":"#b84c5d","about":"Выразительный язык, созданный для удобства программиста. Веб на Ruby on Rails, стартапы, автоматизация.","project":{"title":"Сервис бронирования столиков на Rails","desc":"Веб-приложение для ресторана: гости бронируют столик, администратор управляет бронями.","req":["Модели Restaurant, Table, Reservation с валидациями и ассоциациями","Проверка пересечения броней и вместимости стола","Аутентификация (Devise или has_secure_password), роль администратора","Письмо-подтверждение через Action Mailer и фоновую задачу Active Job","Тесты на RSpec: модели и request-спеки","Деплой на Render или Fly.io, README со ссылкой"]},"lessons":[{"t":"Основы: объекты, переменные, строки","body":["В Ruby всё — объект, даже числа: <code>5.times</code>, <code>nil.to_a</code>. Переменные не объявляют, тип определяется значением.","Строки в двойных кавычках поддерживают интерполяцию <code>\"#{name}\"</code>, в одинарных — нет. Символы <code>:name</code> — неизменяемые имена, часто служат ключами хэшей.","Только <code>nil</code> и <code>false</code> ложны. Ноль, пустая строка и пустой массив — истинны. Методы, возвращающие булево значение, по соглашению заканчиваются на <code>?</code>, а опасные (меняющие объект) — на <code>!</code>."],"code":"name = \"Ада\"\nage = 36\nputs \"#{name}, #{age + 1}\"        # Ада, 37\nputs 'без #{name}'                # без #{name}\n\nputs 10.even?, 0 ? \"истина\" : \"ложь\"   # true, истина\ns = \"hello\"\ns.upcase                          # новая строка\ns.upcase!                         # меняет s\nputs s                            # HELLO\nputs 7 / 2, 7.0 / 2, 7.fdiv(2)    # 3, 3.5, 3.5","tips":["0 и \"\" истинны — в отличие от многих языков","Метод с ! обычно меняет объект на месте","puts выводит с переводом строки, print — без"],"q":[{"t":"mc","q":"Какие значения ложны в Ruby?","e":"Всё остальное истинно.","o":["0, \"\", nil, false","Только nil и false","Только false","nil, false и []"],"a":1},{"t":"out","q":"Что выведет код?","e":"0 — истинное значение.","c":"x = 0\nputs x ? \"да\" : \"нет\"","ans":["да"]},{"t":"fill","q":"Впишите синтаксис интерполяции переменной в строку.","e":"#{...} работает в двойных кавычках.","c":"puts \"Привет, ___{name}\"","ans":["#"]},{"t":"out","q":"Что выведет код?","e":"Метод без ! вернул новую строку, с ! изменил s.","c":"s = \"ruby\"\ns.capitalize\nputs s\ns.capitalize!\nputs s","ans":["ruby Ruby","rubyRuby"]}]},{"t":"Условия, циклы и диапазоны","body":["Кроме <code>if</code> есть <code>unless</code> (если не) и модификаторы в конце строки: <code>return if user.nil?</code>. <code>case/when</code> сравнивает через <code>===</code> и работает с диапазонами и классами.","Циклы <code>while</code> и <code>for</code> существуют, но идиоматично перебирать коллекции итераторами: <code>each</code>, <code>times</code>, <code>upto</code>, <code>each_with_index</code>.","Диапазоны: <code>1..5</code> включает 5, <code>1...5</code> — нет. Почти любое выражение возвращает значение, в том числе <code>if</code> и <code>case</code>."],"code":"age = 20\nputs \"взрослый\" if age >= 18\nputs \"ребёнок\" unless age >= 18\n\ngrade = case 85\n        when 90.. then \"A\"\n        when 75...90 then \"B\"\n        else \"C\"\n        end\nputs grade                          # B\n\n3.times { |i| print i }             # 012\n1.upto(3) { |i| print i }           # 123\n%w[a b c].each_with_index { |ch, i| puts \"#{i}:#{ch}\" }\nputs (1..10).step(3).to_a.inspect   # [1, 4, 7, 10]","tips":["Модификатор <code>if</code> в конце строки — для коротких проверок","<code>1...5</code> не включает 5","%w[a b] — короткая запись массива строк"],"q":[{"t":"out","q":"Что выведет код?","e":"1 + 2 + 3.","c":"puts (1...4).to_a.sum","ans":["6"]},{"t":"out","q":"Что выведет код?","e":"case сравнивает значение с диапазоном через ===.","c":"x = case 5\n    when 1..3 then \"low\"\n    when 4..6 then \"mid\"\n    end\nputs x","ans":["mid"]},{"t":"fill","q":"Впишите ключевое слово «если не».","e":"unless — противоположность if.","c":"___ logged_in? then redirect_to login_path end","ans":["unless"]},{"t":"mc","q":"Что делает <code>5.times { |i| ... }</code>?","e":"times считает с нуля.","o":["Выполняет блок 5 раз с i от 0 до 4","Выполняет блок 5 раз с i от 1 до 5","Умножает 5 на i","Возвращает массив из 5 элементов"],"a":0}]},{"t":"Массивы, хэши и блоки","body":["Блок — кусок кода в <code>{ }</code> или <code>do...end</code>, который передают методу. Методы коллекций принимают блоки: <code>map</code>, <code>select</code>, <code>reject</code>, <code>reduce</code>, <code>find</code>, <code>sort_by</code>, <code>group_by</code>.","Хэш хранит пары ключ–значение. Современный синтаксис: <code>{ name: \"Ада\", age: 36 }</code> — ключи-символы. Отсутствующий ключ вернёт nil, <code>fetch</code> бросит ошибку или вернёт запасное значение.","Запись <code>&amp;:method</code> — сокращение для блока <code>{ |x| x.method }</code>."],"code":"nums = [1, 2, 3, 4, 5]\nevens = nums.select(&:even?)                  # [2, 4]\nsquares = nums.map { |n| n * n }              # [1, 4, 9, 16, 25]\nsum = nums.reduce(0) { |acc, n| acc + n }     # 15\n\nusers = [{ name: \"Ада\", city: \"Лондон\" }, { name: \"Алан\", city: \"Лондон\" }]\nby_city = users.group_by { |u| u[:city] }\nputs by_city[\"Лондон\"].size                   # 2\n\ncounts = Hash.new(0)\n\"a b a\".split.each { |w| counts[w] += 1 }\nputs counts                                   # {\"a\"=>2, \"b\"=>1}\nputs users.first.fetch(:email, \"нет\")         # нет","tips":["Hash.new(0) задаёт значение по умолчанию для отсутствующих ключей","select оставляет, reject убирает","each возвращает исходную коллекцию, map — новую"],"q":[{"t":"out","q":"Что выведет код?","e":"reject убрал нечётные.","c":"p [1, 2, 3, 4].reject(&:odd?)","ans":["[2, 4]"]},{"t":"out","q":"Что выведет код?","e":"[] вернул nil, fetch — запасное значение.","c":"h = { a: 1 }\np h[:b], h.fetch(:b, 0)","ans":["nil 0","nil0"]},{"t":"fill","q":"Впишите метод, который сворачивает массив в одно значение.","e":"inject — синоним reduce.","c":"total = prices.___(0) { |sum, p| sum + p }","ans":["reduce","inject"]},{"t":"mc","q":"Что вернёт <code>[1, 2, 3].each { |x| x * 2 }</code>?","e":"each возвращает исходный массив.","o":["[1, 2, 3]","[2, 4, 6]","nil","6"],"a":0}]},{"t":"Методы, классы и модули","body":["Метод возвращает последнее вычисленное выражение. Параметры могут быть по умолчанию и именованными: <code>def greet(name, greeting: \"Привет\")</code>.","Класс: <code>initialize</code> — конструктор, <code>@var</code> — переменная экземпляра, <code>attr_reader</code> / <code>attr_accessor</code> создают геттеры и сеттеры. <code>self.method</code> — метод класса.","Модули группируют методы и подмешиваются в классы через <code>include</code> (методы экземпляра) или <code>extend</code> (методы класса). Так в Ruby переиспользуют поведение вместо множественного наследования."],"code":"module Greetable\n  def greet = \"Привет, #{name}\"\nend\n\nclass User\n  include Greetable\n  attr_reader :name\n  attr_accessor :email\n\n  def initialize(name, email: nil)\n    @name = name\n    @email = email\n  end\n\n  def self.guest = new(\"Гость\")\n\n  def to_s = \"User(#{name})\"\nend\n\nu = User.new(\"Ада\", email: \"ada@mail.kz\")\nputs u.greet, User.guest, u.email\nclass Admin < User; end\nputs Admin.new(\"Алан\").is_a?(User)    # true","tips":["attr_accessor создаёт и чтение, и запись","include — методы экземпляра, extend — методы класса","Однострочные методы <code>def x = ...</code> появились в Ruby 3"],"q":[{"t":"mc","q":"Что делает <code>attr_accessor :email</code>?","e":"attr_reader — только чтение.","o":["Создаёт методы email и email=","Делает email приватным","Создаёт только геттер","Объявляет константу"],"a":0},{"t":"fill","q":"Впишите имя метода-конструктора.","e":"Вызывается при User.new.","c":"def ___(name)\n  @name = name\nend","ans":["initialize"]},{"t":"out","q":"Что выведет код?","e":"6 + 5.","c":"def calc(a, b = 2) = a * b\nputs calc(3) + calc(1, b = 5)","ans":["11"]},{"t":"mc","q":"Как подключить методы модуля как методы экземпляра?","e":"extend добавит их как методы класса.","o":["include","extend","require","import"],"a":0}]},{"t":"Исключения, файлы и гемы","body":["Ошибки обрабатывают через <code>begin</code> / <code>rescue</code> / <code>ensure</code> (в методе <code>begin</code> можно опустить). Своё исключение наследуют от <code>StandardError</code>, выбрасывают через <code>raise</code>.","Файлы читают и пишут через <code>File.read</code>, <code>File.write</code> или блок <code>File.open(...) { |f| }</code> — файл закроется сам.","Библиотеки (гемы) ставят через <code>gem install</code> или описывают в <code>Gemfile</code> и устанавливают <code>bundle install</code>. Bundler фиксирует версии в <code>Gemfile.lock</code>."],"code":"require \"json\"\n\nclass ConfigError < StandardError; end\n\ndef load_config(path)\n  data = JSON.parse(File.read(path))\n  raise ConfigError, \"нет ключа api_key\" unless data.key?(\"api_key\")\n  data\nrescue Errno::ENOENT\n  { \"api_key\" => nil }\nrescue JSON::ParserError => e\n  raise ConfigError, \"битый JSON: #{e.message}\"\nensure\n  puts \"проверка конфигурации завершена\"\nend\n\nFile.open(\"log.txt\", \"a\") { |f| f.puts \"запуск #{Time.now}\" }","tips":["Ловите конкретные классы ошибок, а не все подряд","ensure выполняется всегда, как finally","Gemfile.lock коммитят для приложений"],"q":[{"t":"mc","q":"Что выполняется в любом случае, была ошибка или нет?","e":"Аналог finally.","o":["rescue","ensure","else","raise"],"a":1},{"t":"fill","q":"Впишите слово, которым выбрасывают исключение.","e":"raise создаёт и бросает исключение.","c":"___ ArgumentError, \"сумма отрицательная\" if amount < 0","ans":["raise"]},{"t":"mc","q":"От какого класса наследовать своё исключение?","e":"rescue без класса ловит StandardError и наследников.","o":["StandardError","Exception","Object","Error"],"a":0},{"t":"mc","q":"Какая команда ставит гемы из Gemfile?","e":"Bundler разрешает и фиксирует версии.","o":["bundle install","gem build","ruby install","rails new"],"a":0}]},{"t":"Rails: MVC и маршруты","body":["Ruby on Rails следует MVC: модель (данные и правила), представление (шаблоны ERB), контроллер (обрабатывает запрос). Принцип «соглашения важнее конфигурации»: правильные имена избавляют от настройки.","Маршруты в <code>config/routes.rb</code>. <code>resources :posts</code> создаёт семь REST-маршрутов: index, show, new, create, edit, update, destroy.","Генераторы создают каркас: <code>rails generate model</code>, <code>rails generate controller</code>, <code>rails db:migrate</code>. Strong parameters (<code>params.require(...).permit(...)</code>) защищают от подмены полей."],"code":"# config/routes.rb\nRails.application.routes.draw do\n  resources :reservations, only: %i[index new create show]\n  root \"reservations#index\"\nend\n\n# app/controllers/reservations_controller.rb\nclass ReservationsController < ApplicationController\n  before_action :authenticate_user!\n\n  def create\n    @reservation = current_user.reservations.build(reservation_params)\n    if @reservation.save\n      redirect_to @reservation, notice: \"Столик забронирован\"\n    else\n      render :new, status: :unprocessable_entity\n    end\n  end\n\n  private\n\n  def reservation_params\n    params.require(:reservation).permit(:table_id, :starts_at, :guests)\n  end\nend","tips":["Без permit Rails не даст массово присвоить поля","before_action выполняется перед действиями контроллера","Логика данных — в моделях, не в контроллерах"],"q":[{"t":"mc","q":"Сколько маршрутов создаёт <code>resources :posts</code> без ограничений?","e":"index, show, new, create, edit, update, destroy.","o":["4","5","7","8"],"a":2},{"t":"fill","q":"Впишите метод разрешения полей в strong parameters.","e":"Остальные поля будут отброшены.","c":"params.require(:post).___(:title, :body)","ans":["permit"]},{"t":"mc","q":"Что такое «соглашения важнее конфигурации»?","e":"Например, модель Post ищет таблицу posts.","o":["Следуя стандартным именам и структуре, вы почти ничего не настраиваете вручную","Конфигурацию писать запрещено","Все настройки в одном файле","Соглашения пишут в README"],"a":0},{"t":"mc","q":"Что делает before_action?","e":"Часто используется для проверки входа.","o":["Вызывает метод перед действиями контроллера","Выполняется после рендера","Создаёт маршрут","Кэширует ответ"],"a":0}],"run":false},{"t":"Active Record","body":["Active Record связывает классы с таблицами. Ассоциации: <code>belongs_to</code>, <code>has_many</code>, <code>has_one</code>, <code>has_many :through</code>. Валидации проверяют данные перед сохранением.","Запросы строятся цепочкой: <code>where</code>, <code>order</code>, <code>limit</code>, <code>joins</code>. Запрос ленивый и выполняется при обращении к данным. <code>includes</code> подгружает связи заранее и устраняет проблему N+1.","Scope — именованный запрос в модели. Колбэки (<code>before_save</code>) существуют, но злоупотреблять ими не стоит: скрытая логика усложняет отладку."],"code":"class Reservation < ApplicationRecord\n  belongs_to :user\n  belongs_to :table\n\n  validates :guests, numericality: { greater_than: 0 }\n  validate :fits_table\n\n  scope :upcoming, -> { where(\"starts_at > ?\", Time.current).order(:starts_at) }\n\n  private\n\n  def fits_table\n    errors.add(:guests, \"больше мест за столом\") if table && guests > table.seats\n  end\nend\n\nReservation.upcoming.includes(:user).limit(10).each do |r|\n  puts \"#{r.user.name}: #{r.starts_at}\"\nend","tips":["Используйте ? в where для параметров — это защита от инъекций","includes решает N+1","save возвращает false при неудачной валидации, save! бросает исключение"],"q":[{"t":"mc","q":"Что вернёт <code>record.save</code>, если валидация не прошла?","e":"save! в этом случае бросит исключение.","o":["false","nil","Исключение","true"],"a":0},{"t":"fill","q":"Впишите метод жадной загрузки связей.","e":"Без него будет запрос на каждый пост.","c":"Post.___(:comments).each { |p| p.comments.size }","ans":["includes"]},{"t":"mc","q":"Как безопасно подставить значение в where со строкой?","e":"Плейсхолдер экранирует значение.","o":["where(\"price &gt; ?\", value)","where(\"price &gt; #{value}\")","where(\"price &gt; \" + value.to_s)","where(price &gt; value)"],"a":0},{"t":"mc","q":"Какая ассоциация у Reservation к User?","e":"Внешний ключ user_id лежит в reservations.","o":["belongs_to :user","has_many :users","has_one :user","references :user"],"a":0}],"run":false},{"t":"Тестирование и фоновые задачи","body":["RSpec — популярный фреймворк тестов в Ruby. Блоки <code>describe</code> и <code>it</code> описывают поведение, <code>expect(...).to</code> — проверки. Фабрики (FactoryBot) создают тестовые данные.","Request-спеки проверяют HTTP-запрос через всё приложение, модельные — валидации и методы модели.","Долгие операции (письма, обработка файлов) выносят в Active Job и выполняют фоновым обработчиком, например Sidekiq. Пользователь не ждёт, пока отправится письмо."],"code":"RSpec.describe Reservation, type: :model do\n  it \"не даёт посадить больше гостей, чем мест\" do\n    table = Table.create!(seats: 2)\n    r = Reservation.new(table: table, user: create(:user), guests: 4)\n    expect(r).not_to be_valid\n    expect(r.errors[:guests]).to be_present\n  end\nend\n\nRSpec.describe \"Reservations\", type: :request do\n  it \"перенаправляет гостя на вход\" do\n    post reservations_path, params: { reservation: { guests: 2 } }\n    expect(response).to redirect_to(new_user_session_path)\n  end\nend\n\nclass ConfirmationJob < ApplicationJob\n  def perform(reservation_id)\n    ReservationMailer.confirmed(Reservation.find(reservation_id)).deliver_now\n  end\nend\nConfirmationJob.perform_later(reservation.id)","tips":["В задачу передавайте id, а не весь объект","Тестируйте и успешный путь, и ошибки","perform_later ставит задачу в очередь, perform_now выполняет сразу"],"q":[{"t":"mc","q":"Что делает perform_later?","e":"Обработчик очереди выполнит её позже.","o":["Ставит задачу в очередь для фонового выполнения","Выполняет задачу сразу","Откладывает на сутки","Отменяет задачу"],"a":0},{"t":"fill","q":"Впишите метод проверки в RSpec.","e":"expect(...).to сопоставитель.","c":"___(user.name).to eq(\"Ада\")","ans":["expect"]},{"t":"mc","q":"Почему в фоновую задачу передают id, а не объект?","e":"Задача выполняется позже, возможно на другом сервере.","o":["Аргументы сериализуются, а к выполнению объект может измениться — его лучше загрузить свежим","Объекты нельзя передавать в Ruby","Так быстрее компилируется","Для безопасности паролей"],"a":0},{"t":"mc","q":"Что проверяют request-спеки?","e":"Это интеграционные тесты.","o":["Обработку HTTP-запроса через маршруты, контроллер и модель","Только SQL","Только вёрстку","Скорость"],"a":0}],"run":false}],"exam":[{"t":"out","q":"Что выведет код?","e":"a и b — один объект.","c":"a = [1, 2, 3]\nb = a\nb << 4\np a.size","ans":["4"]},{"t":"out","q":"Что выведет код?","e":"Квадраты 1, 4, 9, 16, чётные 4 и 16.","c":"p (1..4).map { |x| x * x }.select(&:even?)","ans":["[4, 16]"]},{"t":"out","q":"Что выведет код?","e":"У nil есть методы-преобразования.","c":"x = nil\np x.to_a, x.to_s, x.to_i","ans":["[] \"\" 0","[]\"\"0"]},{"t":"out","q":"Что выведет код?","e":"Значение по умолчанию — один общий массив, а ключ не создаётся.","c":"h = Hash.new([])\nh[:a] << 1\np h[:b], h.size","ans":["[1] 0","[1]0"]},{"t":"mc","q":"Чем <code>==</code> отличается от <code>equal?</code> в Ruby?","e":"\"a\" == \"a\" истинно, \"a

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1b29">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AVALAND">
<meta name="description" content="Учите 15 языков программирования, захватывая карту мира кода: уроки, тесты, задачи и компилятор.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>AVALAND — играть</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* AVALAND — night sea chart. Hex world map, war-room panels, lessons as dispatches. Single dark world by design. */
:root{
  --sea:#0a1b29; --sea-2:#0e2335; --shallow:#14354a; --grid:#17324a;
  --ink:#e8ecef; --muted:#93a6b5; --faint:#6b8193; --line:#22405a;
  --panel:#0d1a27; --panel-2:#12253a; --panel-3:#173049;
  --gold:#e2b04a; --gold-ink:#1d1405;
  --warn:#e8a33a; --danger:#e0654f; --ok:#80c27a; --fire:#f08a3c;
  --fog:#243140; --fog-2:#33414f;
  --display:"Russo One","Arial Black",Impact,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:radial-gradient(120% 70% at 30% 0%, var(--sea-2), var(--sea) 60%) fixed;
  background-color:var(--sea);
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px 32px;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;justify-content:space-between;padding-top:4px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,34px);letter-spacing:.06em;margin:0;color:var(--gold);line-height:1}
.brand .mark{width:30px;height:34px;clip-path:var(--hex);background:conic-gradient(from 30deg,#6fa060,#c9a43a,#b8673f,#6585b5,#8b5fb0,#45a3a6,#6fa060)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 11px;min-height:44px}
.chip small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.chip b{font-family:var(--display);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}
.chip.alert{border-color:var(--danger)}
.chip.alert b{color:var(--danger)}
.chip svg{flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring.xp .fg{stroke:var(--ok)}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:8px;font-weight:600;font-size:14px}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{background:var(--panel-3);color:var(--ink)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:-2px}
@media (max-width:960px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;border-radius:0;border-width:1px 0 0;justify-content:space-around;
    padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px)}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;flex:1;min-height:48px;justify-content:center}
  .tab svg{width:22px;height:22px}
  .tab[aria-selected="true"]{background:transparent;color:var(--gold)}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .chip{padding:5px 9px}
  .chip small{font-size:9.5px}
  .chip b{font-size:15px}
  .chip .wide{display:none}
}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
.main.single{grid-template-columns:minmax(0,1fr)}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)} .main>.panel.side{display:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2,.card h3{margin:0}
.h-sec{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.03em;margin:0;line-height:1.15;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}

/* continue card */
.cont{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:linear-gradient(100deg,var(--panel-3),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cont .hexsw{width:40px;height:46px}
.cont b{display:block;font-size:15.5px;line-height:1.3}
.cont small{color:var(--muted);font-size:12.5px}
@media (max-width:520px){.cont{grid-template-columns:auto minmax(0,1fr)} .cont .btn{grid-column:1 / -1}}

/* map */
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;position:relative}
#map{display:block;width:100%;height:auto;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:12px;margin-right:6px;vertical-align:-1px;clip-path:var(--hex)}
.oc{fill:var(--sea);stroke:var(--grid);stroke-width:.6}
.oc.sh{fill:var(--shallow)}
.hx{stroke:rgba(0,0,0,.25);stroke-width:.6;cursor:pointer}
.hx.fog{fill:var(--fog)}
.hx.siege{fill:#5a5f66}
@media (hover:hover){.hx:hover{filter:brightness(1.3)}}
.hatch{fill:url(#hatch);pointer-events:none}
.shatch{fill:url(#shatch);pointer-events:none}
.e-coast{stroke:#cfe0ea;stroke-opacity:.42;stroke-width:1.4;stroke-linecap:round}
.e-prov{stroke:#000;stroke-opacity:.32;stroke-width:1;stroke-dasharray:2 2}
.e-open{stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:4 3;animation:march 1.2s linear infinite}
.e-warn{stroke:var(--warn);stroke-width:2;stroke-linecap:round}
.e-sel{stroke:#fff;stroke-opacity:.9;stroke-width:2.4;stroke-linecap:round}
.crown{pointer-events:none}
@keyframes march{to{stroke-dashoffset:-14}}
.lbl{font-family:var(--display);letter-spacing:.05em;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.lbl.sub{font-family:var(--mono);letter-spacing:.02em;fill:var(--muted)}
.lbl.dim{fill:#a2afba}

/* panel */
.panel{display:flex;flex-direction:column;gap:14px}
.ph{display:flex;align-items:center;gap:12px}
.ph h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.1;letter-spacing:.03em;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.hexsw{width:34px;height:38px;flex:none;clip-path:var(--hex)}
.back{background:none;border:0;color:var(--muted);padding:4px 0;font-size:13.5px;align-self:flex-start;min-height:32px}
.back:hover{color:var(--ink)}
.about{margin:0;color:var(--muted);font-size:13.5px}
.bar{height:8px;border-radius:99px;background:var(--fog-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel-2);border:1px solid transparent;border-radius:10px;padding:9px 10px;min-height:52px}
.lrow:hover{border-color:var(--line)}
.lrow .hexsw{width:22px;height:25px}
.lrow b{display:block;font-weight:600;font-size:14px;line-height:1.25}
.lrow small{color:var(--muted);font-size:12px}
.segs{display:flex;gap:2px}
.segs i{width:8px;height:10px;clip-path:var(--hex);background:var(--fog-2)}
.trow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--panel-2);min-height:54px}
.trow .n{font-family:var(--display);font-size:13px;width:26px;height:30px;display:grid;place-items:center;clip-path:var(--hex);background:var(--fog-2);color:var(--muted)}
.trow b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.trow small{font-size:12px;color:var(--muted)}
.trow.warn small{color:var(--warn)}
.trow.siege small{color:var(--danger)}
.trow.held .n,.trow.warn .n{color:#10161c}
.trow.siege .n{background:#5a5f66;color:var(--ink)}
.trow.open .n{background:var(--gold);color:var(--gold-ink)}
.btn{border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn.red{border-color:var(--danger);color:var(--danger)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.big{padding:11px 20px;font-size:15px;min-height:46px}
.btn.full{width:100%}
.box{border:1px dashed var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px}
.box.exam{border-style:solid;border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:color-mix(in srgb,var(--gold) 6%,transparent)}
.box h3{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.box p{margin:0;font-size:13px;color:var(--muted)}
.box ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--panel-3);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.pill.red{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}

/* review / awards / profile */
.due{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--panel-2)}
.due .hexsw{width:22px;height:25px}
.due b{display:block;font-size:14px}
.due small{font-size:12px;color:var(--muted)}
.due.warn small{color:var(--warn)}
.due.siege small{color:var(--danger)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:330px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--panel-2);display:block;max-width:100%}
.cal i.l1{background:color-mix(in srgb,var(--fire) 35%,var(--panel-2))}
.cal i.l2{background:color-mix(in srgb,var(--fire) 70%,var(--panel-2))}
.cal i.l3{background:var(--fire)}
.cal i.today{outline:2px solid var(--ink);outline-offset:1px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach div{background:var(--panel-2);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:4px;border:1px solid transparent}
.ach div.on{border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.ach div b{font-size:13.5px;line-height:1.25}
.ach div small{font-size:12px;color:var(--muted);line-height:1.35}
.ach div:not(.on){opacity:.55}
.ach .medal{width:30px;height:34px;clip-path:var(--hex);display:grid;place-items:center;background:var(--fog-2);color:var(--muted)}
.ach .on .medal{background:var(--gold);color:var(--gold-ink)}
.ach .medal svg{width:16px;height:16px}
.cert{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--panel-2)}
.cert .hexsw{width:22px;height:25px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--muted)}
.input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.input:focus{border-color:var(--gold);outline:none}
.seg{display:flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-weight:600;font-size:13.5px;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--panel-3);color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--fog-2);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(18px)}
.note{font-size:12px;color:var(--muted);margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* ---------- modal / sheet ---------- */
.ov{position:fixed;inset:0;background:rgba(4,10,16,.74);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:20;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  overscroll-behavior:contain}
.dlg{width:min(740px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:auto 0}
@media (max-width:640px){
  .ov{align-items:flex-start;padding:max(10px,env(safe-area-inset-top,0px)) 0 0}
  .dlg{border-radius:18px 18px 0 0;margin:auto 0 0;min-height:60vh;border-width:1px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .dh,.db{padding-left:max(16px,env(safe-area-inset-left,0px)) !important;padding-right:max(16px,env(safe-area-inset-right,0px)) !important}
}
.dh{padding:16px 20px 13px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;background:var(--panel);z-index:1}
.dh .hexsw{width:28px;height:32px;margin-top:3px}
.dh small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.dh h2{font-family:var(--display);font-weight:400;font-size:21px;margin:2px 0 0;line-height:1.15;text-wrap:balance}
.dh .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:26px;line-height:1;padding:2px 8px;min-width:40px;min-height:40px}
.db{padding:16px 20px 22px;display:flex;flex-direction:column;gap:14px}
.db p.txt{margin:0;max-width:64ch;font-size:15.5px;line-height:1.6}
.db p.txt code,.q code,.opt code,.exp code,.tips code,.box code{font-family:var(--mono);font-size:.88em;background:#07121c;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.codewrap{position:relative}
pre.code{margin:0;background:#07121c;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.6;color:#d6dee5;tab-size:4}
.code .s{color:#e7c27a}.code .c{color:#6f8799;font-style:italic}.code .k{color:#8fc3f0}.code .n{color:#c9a0e8}
.copy{position:absolute;top:6px;right:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;font-size:11.5px;padding:3px 9px;color:var(--muted)}
.tips{margin:0;padding:12px 14px 12px 34px;background:color-mix(in srgb,var(--gold) 7%,transparent);border-radius:10px;border:1px solid color-mix(in srgb,var(--gold) 25%,transparent);display:flex;flex-direction:column;gap:6px;font-size:14px}
.tips li::marker{color:var(--gold)}
.tips-h{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0 0 -6px}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{width:10px;height:12px;clip-path:var(--hex);background:var(--fog-2)}
.pips i.ok{background:var(--ok)}.pips i.no{background:var(--danger)}.pips i.cur{background:var(--gold)}
.q{font-size:17px;font-weight:600;margin:0;line-height:1.45}
.kind{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel-2))}
.opt.no{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,var(--panel-2))}
.answer{display:flex;gap:8px}
.answer .input{font-family:var(--mono)}
.answer .input.ok{border-color:var(--ok)}
.answer .input.no{border-color:var(--danger)}
.exp{margin:0;font-size:14.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.exp .right{display:block;margin-top:4px;color:var(--ink);font-family:var(--mono);font-size:13.5px}
.res{text-align:center;padding:8px 0 2px;display:flex;flex-direction:column;gap:8px;align-items:center}
.res .big{font-family:var(--display);font-size:52px;line-height:1}
.res p{margin:0;color:var(--muted);max-width:48ch}
.xp-gain{font-family:var(--display);color:var(--ok);font-size:18px}
.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 90px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--gold);color:var(--gold-ink);font-weight:700;padding:10px 18px;border-radius:999px;transition:.3s;z-index:40;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.imgout{width:100%;border-radius:10px;border:1px solid var(--line);display:block}

/* onboarding */
.onb{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 80% at 50% 0%, var(--sea-2), var(--sea) 65%);overflow-y:auto;
  padding:max(28px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.onb .inner{width:min(520px,100%);display:flex;flex-direction:column;gap:18px;margin:auto 0}
.onb h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1.05;margin:0;letter-spacing:.02em;text-wrap:balance}
.onb h1 span{color:var(--gold)}
.onb p.lead{margin:0;color:var(--muted);font-size:16px}
.onb .steps{display:flex;gap:6px}
.onb .steps i{flex:1;height:4px;border-radius:9px;background:var(--fog-2)}
.onb .steps i.on{background:var(--gold)}
.feat{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.feat .hexsw{width:36px;height:40px;display:grid;place-items:center;color:#10161c}
.feat .hexsw svg{width:18px;height:18px}
.feat b{display:block;font-size:15px}
.feat span{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.lchip{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:7px 13px 7px 8px;font-weight:600;font-size:14px;min-height:40px}
.lchip i{width:16px;height:18px;clip-path:var(--hex)}
.lchip[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel-2))}
.mini{width:100%;max-width:100%;height:auto;display:block}
@media (prefers-reduced-motion:reduce){.e-open{animation:none}.toast,.ring .fg{transition:none}}

/* practice */
.pbars{display:flex;flex-direction:column;gap:8px}
.pbar{display:grid;grid-template-columns:70px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13px}
.pbar span{color:var(--muted)}
.pbar b{font-variant-numeric:tabular-nums;text-align:right}
.ptopic{display:flex;flex-direction:column;gap:6px}
.prow{grid-template-columns:26px minmax(0,1fr) auto}
.pm{width:22px;height:25px;clip-path:var(--hex);background:var(--fog-2);display:grid;place-items:center}
.pm.ok{background:var(--ok);color:#10161c}
.pm.ok svg{width:14px;height:14px}
.pm.try{background:color-mix(in srgb,var(--gold) 55%,var(--fog-2))}
a.pill{text-decoration:none}
.lcstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lcstats div{background:var(--panel-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.lcstats b{font-family:var(--display);font-weight:400;font-size:20px}
.lcstats b.ok{color:var(--ok)}.lcstats b.gold{color:var(--gold)}.lcstats b.red{color:var(--danger)}
.lcstats small{font-size:11.5px;color:var(--muted)}
.exbox{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:14px;overflow-wrap:anywhere}
.exbox code,.case code,.verdict code{font-family:var(--mono);font-size:12.5px}
.edwrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#07121c}
.editor{display:block;width:100%;min-height:260px;resize:vertical;border:0;background:transparent;color:#d6dee5;font-family:var(--mono);font-size:14px;line-height:1.55;padding:12px 14px;tab-size:4;white-space:pre;overflow:auto}
.editor:focus{outline:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 55%,transparent)}
.keys{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.keys button{flex:none;min-width:36px;height:34px;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;font-family:var(--mono);font-size:14px}
@media (hover:hover) and (pointer:fine){.keys{display:none}}
.verdict{display:flex;flex-direction:column;gap:2px;border-radius:10px;padding:10px 12px;border:1px solid}
.verdict.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.verdict.ok b{color:var(--ok)}
.verdict.no{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.verdict.no b{color:var(--danger)}
.verdict span{font-size:14px;overflow-wrap:anywhere}
#run-out{display:flex;flex-direction:column;gap:8px}
.case{background:var(--panel-2);border-radius:10px;padding:9px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere;border-left:3px solid var(--ok)}
.case.no{border-left-color:var(--danger)}
.log summary{cursor:pointer;color:var(--muted);font-size:13px}
.log pre{margin-top:6px;max-height:200px}

pre.code,.editor,code,.answer .input{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-family:var(--mono);font-weight:600;color:var(--muted);background:var(--panel-2)}
.tbl tr:last-child td{border-bottom:0}
.grid-2col{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
/* compiler / code editor */
.edwrap.cm{height:clamp(240px,46vh,560px);background:#07121c}
.edwrap.cm .cm-editor{height:100%}
.edwrap.cm .editor{height:100%;min-height:0;resize:none}
.playbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.select{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:6px 34px 6px 12px;font-weight:600;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stdin summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:32px;display:flex;align-items:center}
.stdin-ta{font-family:var(--mono);margin-top:6px;resize:vertical;min-height:70px}
.console{display:flex;flex-direction:column;gap:8px}
.cout{margin:0;background:#07121c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:380px;overflow:auto;color:#d6dee5}
.cout:empty{display:none}
.cout .err,.cout.err{color:#f2a090}
.lchip.lang{padding:7px 13px}
/* account */
.oauths{display:grid;gap:8px}
.btn.oauth{justify-content:flex-start;gap:10px;min-height:46px;font-weight:600}
.btn.oauth small{margin-left:auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.btn.oauth:disabled{opacity:.55}
.acc-h{display:flex;align-items:center;gap:10px}
.ava{width:32px;height:32px;border-radius:50%;border:1px solid var(--line)}
input[type=password].input,input[type=email].input{font-family:var(--body)}

<script>
window.AVA_CONTENT=[{"id":"base","name":"Основы CS","land":"Остров основ","color":"#9a8f5c","about":"То, что спрашивают на любом собеседовании: сложность алгоритмов, структуры данных, Git, сеть и базовая архитектура.","project":{"title":"Портфолио и подготовка к собеседованию","desc":"Собрать всё, что увидит работодатель, и пройти тренировочные собеседования.","req":["Аккаунт GitHub с 2–3 законченными проектами из курсов, у каждого README, скриншоты и инструкция запуска","Решить 60 задач на LeetCode или Codewars: массивы, строки, хэш-таблицы, два указателя, деревья","Резюме на одну страницу: стек, проекты со ссылками, результаты в цифрах","Профиль на LinkedIn и hh.kz, сопроводительное письмо под вакансию","Три пробных собеседования с другом или ментором: теория, лайвкодинг, рассказ о проекте","Список из 30 вакансий и откликов с отметками об ответах"]},"lessons":[{"t":"Сложность алгоритмов: O-нотация","body":["O-нотация описывает, как растёт время или память алгоритма при росте входных данных. Константы и младшие слагаемые отбрасывают: O(2n + 10) — это O(n).","Основные классы от быстрых к медленным: O(1) — доступ по индексу, O(log n) — бинарный поиск, O(n) — один проход, O(n log n) — хорошая сортировка, O(n²) — вложенные циклы, O(2ⁿ) — перебор подмножеств.","На собеседовании всегда называют сложность решения по времени и памяти и думают, можно ли быстрее. Часто O(n²) превращается в O(n) с помощью хэш-таблицы."],"code":"# O(n²): проверяем все пары\ndef has_pair_slow(nums, target):\n    for i in range(len(nums)):\n        for j in range(i + 1, len(nums)):\n            if nums[i] + nums[j] == target:\n                return True\n    return False\n\n# O(n): запоминаем увиденное в множестве\ndef has_pair_fast(nums, target):\n    seen = set()\n    for x in nums:\n        if target - x in seen:\n            return True\n        seen.add(x)\n    return False","tips":["Два вложенных цикла по n — O(n²)","Деление задачи пополам на каждом шаге — O(log n)","Память тоже считается: доп. множество — O(n) памяти"],"q":[{"t":"mc","q":"Какая сложность у бинарного поиска?","e":"Каждый шаг отбрасывает половину.","o":["O(1)","O(log n)","O(n)","O(n log n)"],"a":1},{"t":"mc","q":"Какая сложность у O(3n² + 5n + 100)?","e":"Константы и младшие слагаемые отбрасывают.","o":["O(3n²)","O(n²)","O(n)","O(100)"],"a":1},{"t":"out","q":"Сколько раз выполнится тело внутреннего цикла при n = 4?","e":"4 + 3 + 2 + 1.","c":"for i in range(n):\n    for j in range(i, n):\n        pass","ans":["10"]},{"t":"mc","q":"Какая сложность у лучших сортировок сравнением?","e":"Быстрее сравнениями в общем случае нельзя.","o":["O(n log n)","O(n)","O(n²)","O(log n)"],"a":0}]},{"t":"Массивы, строки и хэш-таблицы","body":["Массив хранит элементы подряд: доступ по индексу O(1), вставка в начало O(n). Динамический массив (list, vector, ArrayList) растёт с запасом, поэтому добавление в конец в среднем O(1).","Хэш-таблица (dict, HashMap, Map) хранит пары ключ–значение. Хэш-функция вычисляет «корзину» для ключа, поэтому поиск, вставка и удаление в среднем O(1). При коллизиях несколько ключей попадают в одну корзину.","Типичные приёмы: подсчёт частот через хэш-таблицу, два указателя для отсортированного массива, скользящее окно для подстрок."],"code":"# частоты символов\ndef is_anagram(a, b):\n    if len(a) != len(b):\n        return False\n    count = {}\n    for ch in a:\n        count[ch] = count.get(ch, 0) + 1\n    for ch in b:\n        if count.get(ch, 0) == 0:\n            return False\n        count[ch] -= 1\n    return True\n\n# два указателя: палиндром\ndef is_palindrome(s):\n    l, r = 0, len(s) - 1\n    while l < r:\n        if s[l] != s[r]:\n            return False\n        l, r = l + 1, r - 1\n    return True","tips":["Поиск в списке — O(n), в множестве — O(1)","Два указателя часто убирают вложенный цикл","Ключ хэш-таблицы должен быть неизменяемым"],"q":[{"t":"mc","q":"Какая средняя сложность поиска по ключу в хэш-таблице?","e":"В худшем случае при множестве коллизий — O(n).","o":["O(1)","O(log n)","O(n)","O(n²)"],"a":0},{"t":"mc","q":"Сколько стоит вставка в начало массива из n элементов?","e":"Все элементы сдвигаются.","o":["O(1)","O(log n)","O(n)","O(n²)"],"a":2},{"t":"out","q":"Что вернёт is_anagram(\"listen\", \"silent\") из примера?","e":"Одинаковый набор букв.","ans":["True","true"]},{"t":"mc","q":"Какой приём подходит для поиска самой длинной подстроки без повторов?","e":"Окно расширяется и сжимается за O(n).","o":["Скользящее окно","Сортировка пузырьком","Рекурсия без запоминания","Полный перебор подстрок"],"a":0}]},{"t":"Стек, очередь, связный список","body":["Стек работает по принципу LIFO — последним пришёл, первым вышел: <code>push</code> кладёт, <code>pop</code> снимает сверху. Применение: отмена действий, проверка скобок, обход в глубину, стек вызовов функций.","Очередь — FIFO, первым пришёл, первым вышел. Применение: обработка задач по порядку, обход в ширину. В Python для очереди используют <code>collections.deque</code>: <code>list.pop(0)</code> работает за O(n).","Связный список хранит узлы со ссылкой на следующий. Вставка и удаление при известном узле — O(1), а доступ по индексу — O(n)."],"code":"from collections import deque\n\ndef valid_brackets(s):\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n    return not stack\n\nq = deque([\"a\", \"b\"])\nq.append(\"c\")\nprint(q.popleft())        # a\nprint(valid_brackets(\"([]{})\"), valid_brackets(\"(]\"))   # True False","tips":["Скобки, «отмена», DFS — подумайте о стеке","Порядок обработки, BFS — подумайте об очереди","Переполнение стека вызовов — признак слишком глубокой рекурсии"],"q":[{"t":"mc","q":"Какой принцип у стека?","e":"Последний добавленный снимается первым.","o":["LIFO","FIFO","Случайный доступ","По приоритету"],"a":0},{"t":"out","q":"Что вернёт valid_brackets(\"({[]})\") из примера?","e":"Все скобки закрыты в правильном порядке.","ans":["True","true"]},{"t":"mc","q":"Какая структура подходит для обхода графа в ширину?","e":"BFS обрабатывает вершины по уровням.","o":["Стек","Очередь","Хэш-таблица","Куча"],"a":1},{"t":"mc","q":"Сколько стоит доступ к k-му элементу односвязного списка?","e":"Нужно пройти k узлов.","o":["O(1)","O(k)","O(log k)","O(k²)"],"a":1}]},{"t":"Рекурсия, сортировка и поиск","body":["Рекурсия — функция вызывает саму себя на меньшей задаче. Нужны базовый случай (когда остановиться) и шаг к нему. Без базового случая будет переполнение стека.","Сортировка слиянием делит массив пополам, сортирует половины и сливает их: O(n log n) всегда. Быстрая сортировка в среднем O(n log n), в худшем O(n²). В реальном коде используют встроенную сортировку языка.","Бинарный поиск работает только на отсортированных данных: сравниваем с серединой и отбрасываем половину. Мемоизация (запоминание результатов) превращает экспоненциальную рекурсию в линейную — это основа динамического программирования."],"code":"from functools import lru_cache\n\ndef binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if arr[mid] == target:\n            return mid\n        if arr[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n\n@lru_cache(maxsize=None)\ndef fib(n):\n    return n if n < 2 else fib(n - 1) + fib(n - 2)\n\nprint(binary_search([1, 3, 5, 7, 9], 7), fib(50))   # 3 12586269025","tips":["Без базового случая рекурсия бесконечна","Бинарный поиск — только по отсортированному массиву","Наивный fib — O(2ⁿ), с мемоизацией — O(n)"],"q":[{"t":"out","q":"Что вернёт binary_search([1, 3, 5, 7, 9], 4)?","e":"Элемента нет.","ans":["-1"]},{"t":"mc","q":"Что обязательно должно быть в рекурсивной функции?","e":"Иначе рекурсия не остановится.","o":["Базовый случай","Цикл","Глобальная переменная","Два параметра"],"a":0},{"t":"mc","q":"Какая худшая сложность быстрой сортировки?","e":"Например, при неудачном выборе опорного элемента.","o":["O(n log n)","O(n²)","O(n)","O(log n)"],"a":1},{"t":"out","q":"Что вернёт функция при n = 4?","e":"Факториал 4.","c":"def f(n):\n    return 1 if n <= 1 else n * f(n - 1)","ans":["24"]}]},{"t":"Деревья и графы","body":["Дерево — иерархия узлов: корень, дети, листья. Бинарное дерево поиска хранит слева меньшие значения, справа большие: поиск O(log n), если дерево сбалансировано, и O(n) в худшем случае.","Обходы дерева: в глубину (pre-order, in-order, post-order) и в ширину по уровням. In-order обход BST выдаёт значения в отсортированном порядке.","Граф — вершины и рёбра (соцсеть, карта дорог, зависимости). Его хранят списком смежности. BFS находит кратчайший путь по числу рёбер в невзвешенном графе, DFS — проверяет связность и ищет циклы."],"code":"from collections import deque\n\ngraph = {\n    \"A\": [\"B\", \"C\"],\n    \"B\": [\"D\"],\n    \"C\": [\"D\"],\n    \"D\": [],\n}\n\ndef shortest_path_len(g, start, goal):\n    queue = deque([(start, 0)])\n    seen = {start}\n    while queue:\n        node, dist = queue.popleft()\n        if node == goal:\n            return dist\n        for nxt in g[node]:\n            if nxt not in seen:\n                seen.add(nxt)\n                queue.append((nxt, dist + 1))\n    return -1\n\nprint(shortest_path_len(graph, \"A\", \"D\"))   # 2","tips":["Множество seen защищает от бесконечного обхода циклов","In-order обход BST даёт отсортированные значения","Кратчайший путь во взвешенном графе — алгоритм Дейкстры"],"q":[{"t":"mc","q":"Что выдаст in-order обход бинарного дерева поиска?","e":"Левое поддерево, узел, правое поддерево.","o":["Значения по возрастанию","Значения по уровням","Корень первым","Случайный порядок"],"a":0},{"t":"mc","q":"Какой обход найдёт кратчайший путь по числу рёбер в невзвешенном графе?","e":"BFS идёт по уровням удалённости.","o":["BFS","DFS","In-order","Сортировка"],"a":0},{"t":"out","q":"Что вернёт shortest_path_len(graph, \"B\", \"A\") для графа из примера?","e":"Из B нет рёбер обратно к A.","ans":["-1"]},{"t":"mc","q":"Какая высота сбалансированного дерева из n узлов?","e":"Поэтому поиск в нём быстрый.","o":["O(log n)","O(n)","O(1)","O(n²)"],"a":0}]},{"t":"Git и командная работа","body":["Git хранит историю проекта снимками (коммитами). Базовый цикл: изменить файлы → <code>git add</code> → <code>git commit -m \"...\"</code> → <code>git push</code>. Хороший коммит — одно логическое изменение с понятным сообщением.","Ветки позволяют работать над задачей отдельно: <code>git switch -c feature/login</code>. Изменения попадают в main через Pull Request с код-ревью. Конфликт возникает, когда две ветки изменили одни строки — его решают вручную.","<code>git merge</code> объединяет истории с коммитом слияния, <code>git rebase</code> переписывает коммиты поверх другой ветки и даёт линейную историю. Не переписывайте историю общих веток."],"code":"git clone https://github.com/you/shop.git\ncd shop\ngit switch -c feature/cart\n\n# ...правки...\ngit status\ngit add src/cart.py tests/test_cart.py\ngit commit -m \"Добавить расчёт скидки в корзине\"\ngit push -u origin feature/cart\n# открыть Pull Request на GitHub\n\ngit switch main\ngit pull\ngit log --oneline --graph -10","tips":["Не коммитьте секреты, .env, node_modules — используйте .gitignore","Маленькие PR ревьюят быстрее и внимательнее","git restore отменяет незакоммиченные правки в файле"],"q":[{"t":"mc","q":"Что делает <code>git add</code>?","e":"Затем git commit фиксирует индекс.","o":["Добавляет изменения в индекс для следующего коммита","Создаёт коммит","Отправляет на сервер","Создаёт ветку"],"a":0},{"t":"fill","q":"Впишите команду создания ветки и переключения на неё.","e":"Аналог старого git checkout -b.","c":"git switch ___ feature/login","ans":["-c"]},{"t":"mc","q":"Почему нельзя делать rebase общей ветки, с которой работают другие?","e":"Переписывайте только свою локальную историю.","o":["Rebase переписывает коммиты и ломает историю у коллег","Rebase удаляет файлы","Rebase запрещён в Git","Rebase медленный"],"a":0},{"t":"mc","q":"Что должно быть в .gitignore?","e":"Например, .env, node_modules, dist.","o":["Секреты, зависимости и артефакты сборки","Исходный код","README","Тесты"],"a":0}],"run":false},{"t":"HTTP, REST и веб","body":["HTTP — протокол запросов и ответов. Запрос: метод, адрес, заголовки, тело. Ответ: статус-код, заголовки, тело. HTTPS шифрует соединение через TLS.","Методы: GET — получить, POST — создать, PUT — заменить, PATCH — частично изменить, DELETE — удалить. GET, PUT и DELETE идемпотентны: повтор не меняет результат.","Коды ответа: 2xx — успех (200, 201, 204), 3xx — перенаправление, 4xx — ошибка клиента (400, 401, 403, 404, 422), 5xx — ошибка сервера. REST API строится вокруг ресурсов: <code>GET /users/42</code>, <code>POST /users</code>."],"code":"POST /api/orders HTTP/1.1\nHost: shop.kz\nAuthorization: Bearer eyJhbGciOi...\nContent-Type: application/json\n\n{\"product_id\": 7, \"qty\": 2}\n\nHTTP/1.1 201 Created\nLocation: /api/orders/105\nContent-Type: application/json\n\n{\"id\": 105, \"status\": \"new\", \"total\": 37980}","tips":["401 — не авторизован, 403 — авторизован, но нет доступа","Сервер не хранит состояние между запросами — авторизация в каждом запросе","Пароли и токены передают только по HTTPS"],"q":[{"t":"mc","q":"Какой код вернуть, если ресурс не найден?","e":"400 — плохой запрос, 500 — ошибка сервера.","o":["400","401","404","500"],"a":2},{"t":"mc","q":"Какой метод используют для частичного изменения ресурса?","e":"PUT заменяет ресурс целиком.","o":["PUT","PATCH","POST","GET"],"a":1},{"t":"fill","q":"Впишите код ответа «создано».","e":"Обычно с заголовком Location.","c":"HTTP/1.1 ___ Created","ans":["201"]},{"t":"mc","q":"Чем 401 отличается от 403?","e":"Это частый вопрос на собеседованиях.","o":["401 — нужно войти, 403 — вход есть, но прав нет","Ничем","403 — сервер упал","401 — неверный URL"],"a":0}],"run":false},{"t":"Архитектура, тесты и собеседование","body":["Чистый код: понятные имена, маленькие функции с одной задачей, отсутствие дублирования. Принципы SOLID, особенно единственная ответственность и зависимость от абстракций, помогают коду расти без переписывания.","Пирамида тестов: много быстрых юнит-тестов, меньше интеграционных, мало сквозных. Тест проверяет поведение, а не реализацию.","На собеседовании джуниора обычно проверяют: основы языка, структуры данных, SQL, Git, HTTP и умение рассуждать вслух. Решая задачу, сначала уточните условия, назовите простое решение и его сложность, затем улучшайте. Рассказывайте о своих проектах: что делали сами, какие были трудности, что бы улучшили."],"code":"Схема ответа на задачу:\n1. Повторить условие своими словами, уточнить ограничения\n2. Разобрать пример вручную, включая крайние случаи (пусто, один элемент)\n3. Назвать простое решение и его сложность\n4. Предложить оптимизацию (хэш-таблица, два указателя, сортировка)\n5. Написать код, проговаривая шаги\n6. Прогнать пример и крайние случаи, назвать итоговую сложность","tips":["Молчание на собеседовании хуже неидеального решения","Крайние случаи: пустой ввод, один элемент, дубликаты, отрицательные числа","О проекте говорите конкретно: «я сделал», «я выбрал», «я бы улучшил»"],"q":[{"t":"mc","q":"Что означает буква S в SOLID?","e":"Single Responsibility Principle.","o":["Единственная ответственность: у класса одна причина для изменения","Безопасность","Скорость","Статическая типизация"],"a":0},{"t":"mc","q":"Каких тестов в пирамиде должно быть больше всего?","e":"Они быстрые и дешёвые.","o":["Юнит-тестов","Сквозных (E2E)","Ручных","Нагрузочных"],"a":0},{"t":"mc","q":"С чего начать решение задачи на собеседовании?","e":"Это показывает умение работать с требованиями.","o":["Уточнить условие и разобрать пример","Сразу писать оптимальный код","Молча думать 10 минут","Спросить ответ у интервьюера"],"a":0},{"t":"mc","q":"Какой крайний случай чаще всего забывают?","e":"Всегда проверяйте пустой список и строку.","o":["Пустой ввод","Очень красивый ввод","Ввод из документации","Ввод без пробелов"],"a":0}],"run":false}],"exam":[{"t":"mc","q":"Какая сложность у проверки «есть ли в массиве дубликаты» с помощью множества?","e":"Один проход с множеством увиденных.","o":["O(n) время, O(n) память","O(n²) время, O(1) память","O(log n)","O(1)"],"a":0},{"t":"mc","q":"Какая сложность у сортировки и последующего прохода для поиска дубликатов?","e":"Сортировка доминирует.","o":["O(n log n)","O(n)","O(n²)","O(log n)"],"a":0},{"t":"out","q":"Сколько сравнений в худшем случае сделает бинарный поиск в массиве из 1024 элементов (округлите до целого)?","e":"log₂(1024) = 10 делений, плюс финальная проверка.","ans":["11","10"]},{"t":"mc","q":"Какая структура данных лежит в основе очереди с приоритетом?","e":"Извлечение минимума — O(log n).","o":["Куча (heap)","Стек","Связный список","Хэш-таблица"],"a":0},{"t":"mc","q":"Что выведет обход в ширину дерева 1 → (2, 3), 2 → (4)?","e":"По уровням слева направо.","o":["1 2 3 4","1 2 4 3","4 2 3 1","1 3 2 4"],"a":0},{"t":"mc","q":"Какой HTTP-метод не идемпотентен?","e":"Повторный POST может создать второй ресурс.","o":["GET","PUT","DELETE","POST"],"a":3},{"t":"fill","q":"Впишите команду, которая показывает изменения в рабочей директории относительно последнего коммита.","e":"git diff показывает строки, git status — список файлов.","c":"git ___","ans":["diff","status"]},{"t":"mc","q":"Вы случайно закоммитили пароль и запушили. Что правильно сделать в первую очередь?","e":"Секрет уже скомпрометирован, история хранит его.","o":["Сменить (отозвать) пароль, затем убрать его из истории","Удалить файл новым коммитом и забыть","Сделать репозиторий приватным","Переименовать файл"],"a":0},{"t":"mc","q":"Какая сложность у вставки в сбалансированное бинарное дерево поиска?","e":"Высота дерева логарифмическая.","o":["O(log n)","O(1)","O(n)","O(n log n)"],"a":0},{"t":"mc","q":"Что такое идемпотентность?","e":"Важно для повторов при сбоях сети.","o":["Повторный одинаковый запрос не меняет результат после первого","Запрос выполняется быстро","Запрос кэшируется","Запрос без тела"],"a":0},{"t":"mc","q":"Что значит DRY?","e":"Don't Repeat Yourself.","o":["Не повторяйся: одна логика — в одном месте","Пиши сухие комментарии","Удаляй тесты","Не используй рекурсию"],"a":0},{"t":"mc","q":"Как лучше ответить, если на собеседовании не знаете ответ?","e":"Интервьюеры ценят честность и ход мысли.","o":["Честно сказать и порассуждать, как бы вы это выяснили","Придумать уверенный ответ","Сменить тему","Промолчать"],"a":0}]},{"id":"py","name":"Python","land":"Пайтония","color":"#6fa060","about":"Простой синтаксис и огромная экосистема. Бэкенд, анализ данных, автоматизация, ИИ.","project":{"title":"Консольный трекер расходов","desc":"Приложение в терминале, которое хранит расходы в JSON-файле и показывает отчёты по категориям и месяцам.","req":["Команды add, list, report, delete через модуль argparse","Данные сохраняются в expenses.json и переживают перезапуск","Класс Expense через @dataclass, отдельные модули для логики и для CLI","Обработка ошибок: неверная дата, отрицательная сумма, повреждённый файл","Минимум 8 тестов на pytest","Репозиторий на GitHub с README: как установить, как запустить, пример вывода"]},"lessons":[{"t":"Переменные, типы и ввод-вывод","body":["В Python тип не объявляют: переменная — это имя, которое ссылается на объект, а тип есть у объекта. Основные встроенные типы: <code>int</code>, <code>float</code>, <code>str</code>, <code>bool</code> и <code>None</code>.","<code>input()</code> всегда возвращает строку, поэтому число из ввода нужно явно привести через <code>int()</code> или <code>float()</code>. Узнать тип можно через <code>type()</code>, а проверить — через <code>isinstance()</code>.","Деление <code>/</code> всегда даёт float, <code>//</code> делит нацело с округлением вниз, <code>%</code> — остаток, <code>**</code> — степень."],"code":"name = input(\"Имя: \")          # всегда str\nage = int(input(\"Возраст: \"))  # приводим к int\nprint(f\"{name}, через год вам {age + 1}\")\nprint(7 / 2, 7 // 2, 7 % 2, 2 ** 10)  # 3.5 3 1 1024\nprint(-7 // 2)                  # -4: округление вниз\nprint(isinstance(age, int))     # True","tips":["<code>input()</code> возвращает строку: <code>\"5\" + 1</code> вызовет TypeError","<code>//</code> округляет вниз, а не к нулю: <code>-7 // 2 == -4</code>","f-строки — самый читаемый способ форматирования"],"q":[{"t":"mc","q":"Что вернёт <code>input()</code>, если пользователь ввёл 42?","e":"input всегда возвращает str. Число получают через int().","o":["Число 42","Строку \"42\"","None","float 42.0"],"a":1},{"t":"out","q":"Что выведет код?","e":"7 // 2 = 3, 7 % 3 = 1, 2 ** 3 = 8.","c":"print(7 // 2, 7 % 3, 2 ** 3)","ans":["3 1 8"]},{"t":"out","q":"Что выведет код?","e":"Целочисленное деление округляет вниз, к минус бесконечности.","c":"print(-7 // 2)","ans":["-4"]},{"t":"fill","q":"Впишите функцию, которая превратит строку в целое число.","e":"int(\"42\") вернёт 42.","c":"age = ___(input())","ans":["int"]}]},{"t":"Условия и циклы","body":["Блоки в Python задаются отступами, а не скобками. Условия пишут через <code>if</code>, <code>elif</code>, <code>else</code>. Пустые коллекции, <code>0</code>, <code>\"\"</code> и <code>None</code> считаются ложными.","<code>for</code> перебирает элементы любой коллекции. <code>range(start, stop, step)</code> генерирует числа без включения <code>stop</code>. <code>enumerate()</code> даёт индекс и значение сразу.","<code>while</code> повторяет, пока условие истинно. <code>break</code> выходит из цикла, <code>continue</code> переходит к следующей итерации. У циклов есть <code>else</code>: он выполняется, если цикл не был прерван через break."],"code":"for i, ch in enumerate(\"abc\"):\n    print(i, ch)\n\nn = 10\nwhile n > 0:\n    n -= 3\nprint(n)              # -2\n\nfor x in [3, 5, 7]:\n    if x % 2 == 0:\n        break\nelse:\n    print(\"чётных нет\")","tips":["<code>range(5)</code> — это 0, 1, 2, 3, 4","Пустой список в условии ложен: <code>if items:</code> проверяет непустоту","Тернарный оператор: <code>a if условие else b</code>"],"q":[{"t":"mc","q":"Какие числа даёт <code>range(2, 10, 3)</code>?","e":"Начало 2, шаг 3, 10 не включается.","o":["2, 5, 8, 11","2, 5, 8","3, 6, 9","2, 4, 6, 8"],"a":1},{"t":"out","q":"Что выведет код?","e":"1 + 2 + 4 = 7, тройка пропущена.","c":"total = 0\nfor i in range(1, 5):\n    if i == 3:\n        continue\n    total += i\nprint(total)","ans":["7"]},{"t":"out","q":"Что выведет код?","e":"Цикл прерван break на 5, поэтому else не выполнился.","c":"for x in [1, 3, 5]:\n    if x > 4:\n        break\nelse:\n    print(\"A\")\nprint(\"B\")","ans":["B"]},{"t":"mc","q":"Что выведет <code>print(\"да\" if [] else \"нет\")</code>?","e":"Пустой список ложен.","o":["да","нет","Ошибку","None"],"a":1}]},{"t":"Строки","body":["Строки неизменяемы: методы вроде <code>upper()</code> или <code>replace()</code> возвращают новую строку. Срезы <code>s[start:stop:step]</code> работают как у списков, а <code>s[::-1]</code> разворачивает строку.","<code>split()</code> режет строку в список, <code>join()</code> склеивает список в строку. <code>strip()</code> убирает пробелы по краям. Проверка вхождения — оператор <code>in</code>.","Склеивание в цикле через <code>+=</code> медленно на больших объёмах: правильнее собрать части в список и вызвать <code>\"\".join(parts)</code>."],"code":"s = \"  Hello, World  \"\nt = s.strip().lower()           # \"hello, world\"\nwords = t.split(\", \")           # [\"hello\", \"world\"]\nprint(\"-\".join(words))          # hello-world\nprint(t[::-1])                  # dlrow ,olleh\nprint(\"wor\" in t, t.count(\"o\")) # True 2\nprint(f\"{3.14159:.2f}\")         # 3.14","tips":["<code>s[0] = \"X\"</code> вызовет TypeError: строки не меняются","<code>split()</code> без аргумента режет по любым пробелам и убирает пустые части","Формат <code>{x:.2f}</code> оставляет два знака после точки"],"q":[{"t":"out","q":"Что выведет код?","e":"Индексы 1, 2, 3.","c":"print(\"python\"[1:4])","ans":["yth"]},{"t":"out","q":"Что выведет код?","e":"split даёт [\"a\",\"b\",\"c\"], join склеивает через дефис.","c":"print(\"-\".join(\"a b c\".split()))","ans":["a-b-c"]},{"t":"mc","q":"Что будет после <code>s = \"abc\"; s.upper()</code>, если вывести s?","e":"upper возвращает новую строку, исходная не меняется.","o":["abc","ABC","None","Ошибка"],"a":0},{"t":"fill","q":"Впишите метод, который убирает пробелы по краям строки.","e":"strip() убирает пробельные символы с обоих краёв.","c":"clean = raw.___()","ans":["strip"]}]},{"t":"Коллекции: list, tuple, set, dict","body":["<code>list</code> — изменяемый упорядоченный список. <code>tuple</code> — неизменяемый кортеж, его можно использовать как ключ словаря. <code>set</code> — множество уникальных значений с быстрой проверкой <code>in</code>. <code>dict</code> — словарь ключ–значение.","Присваивание не копирует: <code>b = a</code> создаёт второе имя для того же списка. Копию делают через <code>a.copy()</code> или <code>list(a)</code>, а для вложенных структур нужен <code>copy.deepcopy</code>.","Проверка <code>x in set</code> и <code>key in dict</code> в среднем занимает O(1), а <code>x in list</code> — O(n)."],"code":"nums = [3, 1, 2]\nnums.sort()                  # меняет список на месте\npoint = (10, 20)\nx, y = point                 # распаковка\nseen = {1, 2, 2, 3}          # {1, 2, 3}\nages = {\"Ада\": 36}\nages[\"Алан\"] = 41\nprint(ages.get(\"Боб\", 0))    # 0\nfor name, age in ages.items():\n    print(name, age)","tips":["<code>list.sort()</code> возвращает None, а <code>sorted(list)</code> — новый список","Ключом словаря может быть только неизменяемый объект","<code>{}</code> — это пустой dict, пустое множество — <code>set()</code>"],"q":[{"t":"out","q":"Что выведет код?","e":"a и b ссылаются на один список.","c":"a = [1, 2]\nb = a\nb.append(3)\nprint(a)","ans":["[1, 2, 3]"]},{"t":"mc","q":"Что создаёт выражение <code>{}</code>?","e":"Для множества используйте set().","o":["Пустое множество","Пустой словарь","Пустой кортеж","Ошибку"],"a":1},{"t":"out","q":"Что выведет код?","e":"Множество хранит только уникальные значения.","c":"print(len({1, 1, 2, 3, 3}))","ans":["3"]},{"t":"mc","q":"Что вернёт <code>[3, 1, 2].sort()</code>?","e":"sort сортирует на месте и возвращает None.","o":["[1, 2, 3]","None","[3, 2, 1]","Ошибку"],"a":1}]},{"t":"Функции","body":["Функцию объявляют через <code>def</code>. Аргументы можно передавать по позиции и по имени. <code>*args</code> собирает лишние позиционные аргументы в кортеж, <code>**kwargs</code> — именованные в словарь.","Значения по умолчанию вычисляются один раз при объявлении функции. Поэтому изменяемый объект по умолчанию (<code>[]</code>, <code>{}</code>) будет общим для всех вызовов. Используйте <code>None</code> и создавайте список внутри.","Переменная, которой присваивают значение внутри функции, локальна. Чтобы изменить глобальную, нужен <code>global</code>, но лучше возвращать значение."],"code":"def add_item(item, items=None):\n    if items is None:\n        items = []\n    items.append(item)\n    return items\n\ndef stats(*nums, round_to=2):\n    return round(sum(nums) / len(nums), round_to)\n\nprint(stats(1, 2, 4))          # 2.33\nprint(stats(1, 2, round_to=0)) # 2.0","tips":["Никогда не пишите <code>def f(x=[])</code> — список станет общим","Без return функция вернёт None","Функции — объекты: их можно передавать в другие функции"],"q":[{"t":"out","q":"Что выведет код?","e":"Список по умолчанию создаётся один раз и общий для вызовов.","c":"def f(x, acc=[]):\n    acc.append(x)\n    return acc\n\nf(1)\nprint(f(2))","ans":["[1, 2]"]},{"t":"out","q":"Что выведет код?","e":"Два позиционных и один именованный.","c":"def f(*args, **kwargs):\n    return len(args) + len(kwargs)\n\nprint(f(1, 2, a=3))","ans":["3"]},{"t":"mc","q":"Что выведет код: <code>x = 1; def g(): x = 2</code> затем <code>g(); print(x)</code>?","e":"x внутри g — новая локальная переменная.","o":["1","2","None","UnboundLocalError"],"a":0},{"t":"fill","q":"Впишите, что собирает именованные аргументы в словарь.","e":"Две звёздочки собирают именованные аргументы.","c":"def config(___):\n    return kwargs","ans":["**kwargs"]}]},{"t":"Comprehensions, генераторы и lambda","body":["List comprehension строит список в одну строку: <code>[выражение for x in коллекция if условие]</code>. Так же пишутся dict и set comprehension.","Генератор отдаёт значения по одному и не держит всё в памяти. Генераторное выражение пишут в круглых скобках, а функция-генератор использует <code>yield</code>. Генератор можно пройти только один раз.","<code>lambda</code> — короткая безымянная функция в одно выражение. Чаще всего её передают в <code>sorted(key=...)</code>, <code>max(key=...)</code>, <code>map</code> и <code>filter</code>."],"code":"squares = [n * n for n in range(6) if n % 2 == 0]  # [0, 4, 16]\nlengths = {w: len(w) for w in [\"code\", \"map\"]}     # {'code': 4, 'map': 3}\ntotal = sum(n * n for n in range(1_000_000))       # без списка в памяти\n\ndef countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\nprint(list(countdown(3)))                          # [3, 2, 1]\nusers = [(\"Ада\", 36), (\"Алан\", 41)]\nprint(max(users, key=lambda u: u[1]))              # ('Алан', 41)","tips":["Генератор исчерпывается: второй проход вернёт пусто","Сложную логику не пихайте в comprehension — пишите обычный цикл","<code>key=</code> в sorted принимает функцию, а не результат её вызова"],"q":[{"t":"out","q":"Что выведет код?","e":"Нечётные 1 и 3, умноженные на 2.","c":"print([x * 2 for x in range(5) if x % 2])","ans":["[2, 6]"]},{"t":"out","q":"Что выведет код?","e":"После первого sum генератор исчерпан.","c":"g = (x for x in range(3))\nprint(sum(g), sum(g))","ans":["3 0"]},{"t":"fill","q":"Впишите ключевое слово, которое превращает функцию в генератор.","e":"yield отдаёт значение и приостанавливает функцию.","c":"def nums():\n    ___ 1\n    ___ 2","ans":["yield"]},{"t":"out","q":"Что выведет код?","e":"Сортировка по длине строки.","c":"words = [\"bb\", \"a\", \"ccc\"]\nprint(sorted(words, key=len))","ans":["['a', 'bb', 'ccc']"]}]},{"t":"ООП: классы, наследование, dataclass","body":["Класс объединяет данные и поведение. <code>__init__</code> заполняет новый объект, <code>self</code> — ссылка на него. Атрибуты класса общие для всех экземпляров, атрибуты через <code>self</code> — у каждого свои.","Наследование указывают в скобках: <code>class Admin(User)</code>. <code>super()</code> вызывает метод родителя. Магические методы вроде <code>__str__</code>, <code>__eq__</code>, <code>__len__</code> задают поведение встроенных операций.","<code>@property</code> превращает метод в атрибут только для чтения. <code>@dataclass</code> сам пишет <code>__init__</code>, <code>__repr__</code> и <code>__eq__</code> для классов-хранилищ данных."],"code":"from dataclasses import dataclass\n\nclass User:\n    def __init__(self, name):\n        self.name = name\n    def greet(self):\n        return f\"Привет, {self.name}\"\n\nclass Admin(User):\n    def greet(self):\n        return super().greet() + \" (админ)\"\n\n@dataclass\nclass Point:\n    x: int\n    y: int\n\nprint(Admin(\"Ада\").greet())        # Привет, Ада (админ)\nprint(Point(1, 2) == Point(1, 2))  # True","tips":["Без <code>__eq__</code> два одинаковых объекта не равны: сравниваются ссылки","Изменяемый атрибут класса (список) станет общим для всех объектов","Наследуйте, только если «является», иначе используйте композицию"],"q":[{"t":"mc","q":"Что делает <code>super().greet()</code>?","e":"super() даёт доступ к методам родителя.","o":["Вызывает greet текущего объекта рекурсивно","Вызывает реализацию greet из родительского класса","Создаёт новый объект родителя","Делает метод статическим"],"a":1},{"t":"out","q":"Что выведет код?","e":"items — атрибут класса, он общий.","c":"class A:\n    items = []\n\na, b = A(), A()\na.items.append(1)\nprint(len(b.items))","ans":["1"]},{"t":"mc","q":"Что автоматически генерирует @dataclass?","e":"По умолчанию dataclass пишет эти три метода.","o":["Только __init__","__init__, __repr__ и __eq__","Геттеры и сеттеры","Сериализацию в JSON"],"a":1},{"t":"fill","q":"Впишите имя метода, который определяет текст при print(obj).","e":"print вызывает str(obj), а он — __str__.","c":"def ___(self):\n    return f\"User {self.name}\"","ans":["__str__"]}]},{"t":"Исключения, файлы и модули","body":["Ошибки обрабатывают через <code>try</code> / <code>except</code>. Ловите конкретные исключения, а не все подряд. Блок <code>else</code> выполняется, если ошибки не было, <code>finally</code> — всегда. Свою ошибку выбрасывают через <code>raise</code>.","Файлы открывают через <code>with open(...)</code>: файл закроется сам, даже если внутри произошла ошибка. Указывайте <code>encoding=\"utf-8\"</code>.","Любой .py файл — модуль. Код под <code>if __name__ == \"__main__\":</code> выполняется только при прямом запуске файла. Зависимости ставят через <code>pip</code> в виртуальное окружение: <code>python -m venv .venv</code>."],"code":"import json\n\ndef load(path):\n    try:\n        with open(path, encoding=\"utf-8\") as f:\n            return json.load(f)\n    except FileNotFoundError:\n        return []\n    except json.JSONDecodeError as e:\n        raise ValueError(f\"Файл повреждён: {e}\") from e\n\nif __name__ == \"__main__\":\n    print(load(\"data.json\"))","tips":["Голый <code>except:</code> ловит даже Ctrl+C — так делать нельзя","<code>with</code> закрывает файл автоматически","Для каждого проекта — своё виртуальное окружение и requirements.txt"],"q":[{"t":"out","q":"Что выведет код?","e":"Ошибки не было: try, else, finally.","c":"try:\n    print(\"1\", end=\"\")\nexcept Exception:\n    print(\"2\", end=\"\")\nelse:\n    print(\"3\", end=\"\")\nfinally:\n    print(\"4\", end=\"\")","ans":["134"]},{"t":"mc","q":"Зачем открывать файл через with?","e":"with вызывает закрытие файла при выходе из блока.","o":["Так файл читается быстрее","Файл гарантированно закроется, даже при ошибке","Без with нельзя писать в файл","with включает кодировку UTF-8"],"a":1},{"t":"fill","q":"Впишите слово для выбрасывания исключения.","e":"raise выбрасывает исключение.","c":"if amount < 0:\n    ___ ValueError(\"Сумма отрицательная\")","ans":["raise"]},{"t":"mc","q":"Когда выполняется код под <code>if __name__ == \"__main__\":</code>?","e":"При импорте __name__ равно имени модуля.","o":["Только при прямом запуске файла","При каждом импорте","Никогда","Только в тестах"],"a":0}]}],"exam":[{"t":"out","q":"Что выведет код?","e":"Умножение списка копирует ссылку на один и тот же внутренний список.","c":"a = [[0] * 2] * 2\na[0][0] = 1\nprint(a)","ans":["[[1, 0], [1, 0]]"]},{"t":"out","q":"Что выведет код?","e":"Срез [:] создаёт новую копию списка.","c":"x = [1, 2, 3]\ny = x[:]\ny.append(4)\nprint(len(x), len(y))","ans":["3 4"]},{"t":"out","q":"Что выведет код?","e":"Заглавные буквы идут раньше строчных в Unicode.","c":"print(sorted([\"b\", \"A\", \"c\"]))","ans":["['A', 'b', 'c']"]},{"t":"out","q":"Что выведет код?","e":"== сравнивает значения, is — идентичность объектов.","c":"a = [1]\nb = [1]\nprint(a == b, a is b)","ans":["True False"]},{"t":"out","q":"Что выведет код?","e":"Буква a встречается дважды, ключей три.","c":"d = {}\nfor w in \"abca\":\n    d[w] = d.get(w, 0) + 1\nprint(d[\"a\"], len(d))","ans":["2 3"]},{"t":"out","q":"Что выведет код?","e":"Генератор даёт 0, 1, 4.","c":"def gen():\n    for i in range(3):\n        yield i * i\nprint(list(gen())[-1])","ans":["4"]},{"t":"out","q":"Что выведет код?","e":"Звёздочка распаковывает список в отдельные аргументы.","c":"print(*[1, 2, 3], sep=\"-\")","ans":["1-2-3"]},{"t":"out","q":"Что выведет код?","e":"Строка \"0\" непустая, поэтому истинна.","c":"print(bool([]), bool(\"0\"), bool(0.0))","ans":["False True False"]},{"t":"mc","q":"Какова средняя сложность проверки <code>x in s</code>, если s — set?","e":"Множество — хэш-таблица.","o":["O(1)","O(log n)","O(n)","O(n log n)"],"a":0},{"t":"out","q":"Что выведет код?","e":"Лямбды захватывают переменную i, а не её значение. К моменту вызова i = 2.","c":"funcs = [lambda: i for i in range(3)]\nprint(funcs[0]())","ans":["2"]},{"t":"out","q":"Что выведет код?","e":"Атрибут класса общий и увеличивается при каждом создании.","c":"class Counter:\n    count = 0\n    def __init__(self):\n        Counter.count += 1\n\nCounter(); Counter()\nprint(Counter.count)","ans":["2"]},{"t":"fill","q":"Впишите декоратор, который превращает метод в атрибут только для чтения.","e":"@property позволяет писать c.area без скобок.","c":"class Circle:\n    def __init__(self, r):\n        self.r = r\n    @___\n    def area(self):\n        return 3.14 * self.r ** 2","ans":["property"]},{"t":"out","q":"Что выведет код?","e":"Строка выравнивается вправо до ширины 5.","c":"print(\"{:>5}|\".format(\"ab\"))","ans":["ab|","   ab|"]},{"t":"mc","q":"Что вернёт <code>{**{\"a\": 1}, **{\"a\": 2}}</code>?","e":"Правый словарь перезаписывает значения левого.","o":["{'a': 1}","{'a': 2}","{'a': [1, 2]}","Ошибку из-за повтора ключа"],"a":1}]},{"id":"js","name":"JavaScript","land":"Джунгли JS","color":"#c9a43a","about":"Язык браузера и Node.js. Интерфейсы сайтов, серверы, мобильные и десктопные приложения.","project":{"title":"Канбан-доска без фреймворков","desc":"Веб-приложение для задач с колонками «Сделать», «В работе», «Готово».","req":["Добавление, редактирование и удаление задач, перетаскивание между колонками","Данные сохраняются в localStorage","Поиск и фильтр по тегам без перезагрузки страницы","Загрузка стартовых задач из публичного API через fetch с обработкой ошибок","Код разбит на ES-модули, нет глобальных переменных","Адаптивная вёрстка, публикация на GitHub Pages, ссылка в README"]},"lessons":[{"t":"Переменные, типы и сравнение","body":["<code>const</code> объявляет переменную, которую нельзя переприсвоить, <code>let</code> — обычную. <code>var</code> устарел: у него функциональная область видимости и всплытие, из-за чего появляются ошибки.","Примитивные типы: <code>number</code>, <code>string</code>, <code>boolean</code>, <code>null</code>, <code>undefined</code>, <code>bigint</code>, <code>symbol</code>. Всё остальное — объекты, включая массивы и функции.","<code>==</code> сравнивает с приведением типов и даёт неожиданные результаты, поэтому всегда используйте <code>===</code>. <code>NaN</code> не равен даже самому себе: проверяйте через <code>Number.isNaN()</code>."],"code":"const user = \"Ада\";\nlet score = 10;\nscore += 5;\n\nconsole.log(typeof score);       // \"number\"\nconsole.log(typeof null);        // \"object\" (историческая ошибка)\nconsole.log(0 == \"\", 0 === \"\");  // true false\nconsole.log(0.1 + 0.2 === 0.3);  // false\nconsole.log(Number.isNaN(NaN));  // true","tips":["Используйте const по умолчанию, let — когда значение меняется","Дробные числа хранятся неточно: <code>0.1 + 0.2</code> не равно <code>0.3</code>","<code>typeof null === \"object\"</code> — известная особенность языка"],"q":[{"t":"out","q":"Что выведет код?","e":"Плюс со строкой склеивает, минус приводит к числу.","c":"console.log(\"5\" + 2, \"5\" - 2);","ans":["52 3"]},{"t":"mc","q":"Что вернёт <code>NaN === NaN</code>?","e":"NaN не равен ничему, даже себе.","o":["true","false","undefined","Ошибку"],"a":1},{"t":"out","q":"Что выведет код?","e":"const запрещает переприсваивание, но не изменение содержимого.","c":"const a = [1];\na.push(2);\nconsole.log(a.length);","ans":["2"]},{"t":"fill","q":"Впишите оператор строгого сравнения.","e":"Строгое сравнение не приводит типы.","c":"if (age ___ 18) { }","ans":["==="]}]},{"t":"Условия и циклы","body":["Ложными считаются <code>false</code>, <code>0</code>, <code>\"\"</code>, <code>null</code>, <code>undefined</code>, <code>NaN</code>. Всё остальное, включая <code>[]</code> и <code>{}</code>, истинно.","<code>for...of</code> перебирает значения массива или строки, <code>for...in</code> — ключи объекта. Классический <code>for (let i = 0; ...)</code> нужен, когда важен индекс.","Оператор <code>??</code> подставляет значение по умолчанию только для <code>null</code> и <code>undefined</code>, а <code>||</code> — для любого ложного значения. Опциональная цепочка <code>?.</code> не падает, если объекта нет."],"code":"const items = [\"a\", \"b\"];\nfor (const item of items) console.log(item);\n\nconst user = { name: \"Ада\", settings: null };\nconsole.log(user.settings?.theme ?? \"light\"); // \"light\"\n\nconst count = 0;\nconsole.log(count || 10);  // 10\nconsole.log(count ?? 10);  // 0\n\nswitch (true) {\n  case count > 5: console.log(\"много\"); break;\n  default: console.log(\"мало\");\n}","tips":["<code>[]</code> и <code>{}</code> истинны — пустоту массива проверяют через <code>.length</code>","<code>??</code> лучше <code>||</code>, когда 0 или пустая строка — допустимые значения","Не забывайте break в switch"],"q":[{"t":"out","q":"Что выведет код?","e":"|| реагирует на ложные значения, ?? — только на null и undefined.","c":"console.log(0 || \"a\", 0 ?? \"a\");","ans":["a 0"]},{"t":"mc","q":"Что перебирает <code>for...in</code> у объекта?","e":"Для значений используйте for...of с Object.values().","o":["Ключи","Значения","Пары ключ–значение","Ничего, он только для массивов"],"a":0},{"t":"out","q":"Что выведет код?","e":"0 + 2 + 4.","c":"let s = 0;\nfor (let i = 0; i < 5; i++) {\n  if (i % 2) continue;\n  s += i;\n}\nconsole.log(s);","ans":["6"]},{"t":"fill","q":"Впишите оператор, который безопасно читает свойство, если объекта может не быть.","e":"Опциональная цепочка вернёт undefined вместо ошибки.","c":"const city = user.address___city;","ans":["?."]}]},{"t":"Функции и замыкания","body":["Функцию можно объявить через <code>function</code>, функциональное выражение или стрелку <code>=&gt;</code>. Объявления <code>function</code> всплывают и доступны до строки объявления.","Замыкание — функция, которая помнит переменные места, где её создали. На замыканиях строятся счётчики, приватные данные и колбэки.","У стрелочных функций нет своего <code>this</code>: они берут его из внешней области. Поэтому стрелки удобны в колбэках, но не подходят как методы объекта, которым нужен <code>this</code>."],"code":"function makeCounter() {\n  let count = 0;\n  return () => ++count;\n}\nconst next = makeCounter();\nnext(); next();\nconsole.log(next());           // 3\n\nconst greet = (name = \"гость\") => `Привет, ${name}`;\nconst sum = (...nums) => nums.reduce((a, b) => a + b, 0);\nconsole.log(greet(), sum(1, 2, 3)); // Привет, гость 6","tips":["Каждый вызов makeCounter создаёт новое замыкание с собственным count","Параметр по умолчанию срабатывает только для undefined","<code>...rest</code> собирает аргументы в настоящий массив"],"q":[{"t":"out","q":"Что выведет код?","e":"add(2) возвращает функцию, которая помнит a = 2.","c":"const add = a => b => a + b;\nconsole.log(add(2)(3));","ans":["5"]},{"t":"out","q":"Что выведет код?","e":"var общий для всех итераций. С let вывело бы 0 1 2.","c":"for (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 0);\n}","ans":["3 3 3"]},{"t":"mc","q":"Почему стрелочная функция плохо подходит как метод объекта?","e":"this берётся из внешней области видимости.","o":["Она медленнее","У неё нет своего this","Её нельзя вызвать","Она не возвращает значение"],"a":1},{"t":"fill","q":"Впишите синтаксис, который соберёт все аргументы в массив.","e":"Rest-параметр.","c":"function log(___args) { console.log(args.length); }","ans":["..."]}]},{"t":"Массивы и их методы","body":["<code>map</code> преобразует каждый элемент, <code>filter</code> отбирает, <code>reduce</code> сворачивает в одно значение, <code>find</code> возвращает первый подходящий элемент, <code>some</code> и <code>every</code> проверяют условие.","Методы <code>push</code>, <code>pop</code>, <code>splice</code>, <code>sort</code>, <code>reverse</code> меняют исходный массив. <code>map</code>, <code>filter</code>, <code>slice</code>, <code>concat</code> и новые <code>toSorted</code> возвращают новый.","<code>sort()</code> без функции сравнивает элементы как строки, поэтому числа сортируют так: <code>arr.sort((a, b) =&gt; a - b)</code>."],"code":"const orders = [\n  { id: 1, total: 120, paid: true },\n  { id: 2, total: 80,  paid: false },\n  { id: 3, total: 200, paid: true },\n];\nconst revenue = orders\n  .filter(o => o.paid)\n  .reduce((sum, o) => sum + o.total, 0);   // 320\nconst ids = orders.map(o => o.id);         // [1, 2, 3]\nconst big = orders.find(o => o.total > 150);\nconsole.log([10, 9, 1].sort());            // [1, 10, 9]\nconsole.log([10, 9, 1].sort((a, b) => a - b)); // [1, 9, 10]","tips":["sort без компаратора ломает числа","forEach ничего не возвращает, для преобразования нужен map","Цепочки filter → map → reduce читаются лучше вложенных циклов"],"q":[{"t":"out","q":"Что выведет код?","e":"Сравнение как строк: \"100\" &lt; \"20\" &lt; \"3\".","c":"console.log([3, 20, 100].sort());","ans":["[100, 20, 3]","100,20,3"]},{"t":"out","q":"Что выведет код?","e":"Нечётные 1 и 3, умноженные на 10.","c":"const r = [1, 2, 3, 4].filter(n => n % 2).map(n => n * 10);\nconsole.log(r);","ans":["[10, 30]"]},{"t":"mc","q":"Какой метод вернёт первый подходящий элемент, а не массив?","e":"find возвращает элемент или undefined.","o":["filter","find","some","map"],"a":1},{"t":"fill","q":"Впишите начальное значение аккумулятора, чтобы сумма пустого массива была 0.","e":"Без начального значения reduce на пустом массиве бросит TypeError.","c":"const sum = arr.reduce((a, b) => a + b, ___);","ans":["0"]}]},{"t":"Объекты, деструктуризация и JSON","body":["Объект хранит пары ключ–значение. Деструктуризация достаёт поля в переменные: <code>const { name, age } = user</code>. Можно задать значение по умолчанию и переименовать поле.","Spread <code>...</code> копирует поля в новый объект или элементы в новый массив. Это поверхностная копия: вложенные объекты остаются общими. Глубокую копию делает <code>structuredClone</code>.","<code>JSON.stringify</code> превращает объект в строку для отправки или хранения, <code>JSON.parse</code> — обратно. Функции и <code>undefined</code> в JSON не попадают."],"code":"const user = { name: \"Ада\", role: \"admin\", meta: { visits: 3 } };\nconst { name, role: position, age = 18 } = user;\nconsole.log(name, position, age);      // Ада admin 18\n\nconst copy = { ...user, name: \"Алан\" };\ncopy.meta.visits = 100;\nconsole.log(user.meta.visits);         // 100: вложенный объект общий\n\nconst json = JSON.stringify({ a: 1, f() {} });\nconsole.log(json);                     // {\"a\":1}","tips":["Spread копирует только верхний уровень","Два разных объекта с одинаковыми полями не равны по ===","<code>Object.entries(obj)</code> удобно перебирать через for...of"],"q":[{"t":"out","q":"Что выведет код?","e":"Spread создал новый объект, a не изменился.","c":"const a = { x: 1 };\nconst b = { ...a, x: 2, y: 3 };\nconsole.log(a.x, b.x);","ans":["1 2"]},{"t":"out","q":"Что выведет код?","e":"Третьего элемента нет, сработало значение по умолчанию.","c":"const [first, , third = 9] = [1, 2];\nconsole.log(first, third);","ans":["1 9"]},{"t":"mc","q":"Что вернёт <code>{ a: 1 } === { a: 1 }</code>?","e":"Сравниваются ссылки на разные объекты.","o":["true","false","undefined","Ошибку"],"a":1},{"t":"fill","q":"Впишите метод, который превращает строку JSON в объект.","e":"JSON.parse разбирает строку.","c":"const data = JSON.___(text);","ans":["parse"]}]},{"t":"Классы и прототипы","body":["Класс в JavaScript — удобный синтаксис над прототипами. <code>constructor</code> заполняет объект, методы попадают в прототип и общие для всех экземпляров.","<code>extends</code> наследует класс, <code>super()</code> вызывает конструктор родителя и обязателен до обращения к <code>this</code>. Поля с <code>#</code> приватные: снаружи их не прочитать.","<code>static</code> методы принадлежат самому классу. Геттер <code>get</code> позволяет читать вычисляемое значение как свойство."],"code":"class Account {\n  #balance = 0;\n  constructor(owner) { this.owner = owner; }\n  deposit(sum) {\n    if (sum <= 0) throw new Error(\"Сумма должна быть больше 0\");\n    this.#balance += sum;\n    return this;\n  }\n  get balance() { return this.#balance; }\n  static fromJSON(data) { return new Account(data.owner); }\n}\n\nclass Savings extends Account {\n  constructor(owner, rate) {\n    super(owner);\n    this.rate = rate;\n  }\n}\nconst s = new Savings(\"Ада\", 0.1).deposit(100);\nconsole.log(s.balance, s instanceof Account); // 100 true","tips":["В наследнике вызовите super() до первого this","<code>return this</code> позволяет строить цепочки вызовов","Приватное поле #x нельзя прочитать как obj.#x снаружи класса"],"q":[{"t":"mc","q":"Что произойдёт, если в конструкторе наследника обратиться к this до super()?","e":"Объект ещё не создан родителем.","o":["this будет undefined","ReferenceError","Ничего","Вызовется конструктор Object"],"a":1},{"t":"out","q":"Что выведет код?","e":"Статические методы тоже наследуются.","c":"class A { static make() { return \"A\"; } }\nclass B extends A {}\nconsole.log(B.make());","ans":["A"]},{"t":"mc","q":"Где хранятся методы, объявленные в классе?","e":"Поэтому методы не дублируются в памяти.","o":["В каждом объекте отдельно","В прототипе класса","В глобальном объекте","В конструкторе"],"a":1},{"t":"fill","q":"Впишите символ, который делает поле класса приватным.","e":"Приватные поля начинаются с решётки.","c":"class User { ___password = \"\"; }","ans":["#"]}]},{"t":"Асинхронность и event loop","body":["JavaScript выполняет код в одном потоке. Долгие операции (сеть, таймеры) уходят в фон, а их колбэки возвращаются через очередь event loop.","Микрозадачи (<code>Promise.then</code>, <code>await</code>) выполняются раньше макрозадач (<code>setTimeout</code>). Поэтому <code>setTimeout(fn, 0)</code> сработает после всех готовых промисов.","<code>Promise.all</code> ждёт все промисы и падает на первой ошибке, <code>Promise.allSettled</code> ждёт все и сообщает результат каждого. Независимые запросы запускайте параллельно, а не последовательными await."],"code":"console.log(\"1\");\nsetTimeout(() => console.log(\"2\"), 0);\nPromise.resolve().then(() => console.log(\"3\"));\nconsole.log(\"4\");\n// 1 4 3 2\n\nasync function loadAll(ids) {\n  const res = await Promise.all(\n    ids.map(id => fetch(`/api/items/${id}`).then(r => r.json()))\n  );\n  return res;\n}","tips":["await в цикле for делает запросы по очереди — это медленно","fetch не отклоняет промис на 404: проверяйте <code>res.ok</code>","Необработанный отклонённый промис — ошибка в продакшене"],"q":[{"t":"out","q":"Что выведет код?","e":"Сначала синхронный код, потом микрозадачи, потом таймеры.","c":"setTimeout(() => console.log(\"A\"), 0);\nPromise.resolve().then(() => console.log(\"B\"));\nconsole.log(\"C\");","ans":["C B A"]},{"t":"mc","q":"Что сделает fetch при ответе сервера 404?","e":"Промис отклоняется только при сетевой ошибке.","o":["Выбросит исключение","Успешно вернёт Response с ok = false","Вернёт undefined","Повторит запрос"],"a":1},{"t":"mc","q":"Чем Promise.allSettled отличается от Promise.all?","e":"all отклоняется сразу при первой ошибке.","o":["Ждёт все промисы и не падает на первой ошибке","Возвращает самый быстрый результат","Выполняет промисы по очереди","Ничем"],"a":0},{"t":"fill","q":"Впишите метод, который запустит промисы параллельно и дождётся всех.","e":"Promise.all принимает массив промисов.","c":"const [a, b] = await Promise.___([loadA(), loadB()]);","ans":["all"]}]},{"t":"DOM и события","body":["DOM — дерево элементов страницы, доступное из JavaScript. Элементы находят через <code>querySelector</code>, создают через <code>createElement</code>, а текст меняют через <code>textContent</code>.","Пользовательские данные вставляйте через <code>textContent</code>, а не <code>innerHTML</code>: иначе через ввод можно внедрить чужой скрипт (XSS).","<code>addEventListener</code> подписывает на событие. Делегирование: один обработчик на родителе ловит клики по всем дочерним элементам, даже
